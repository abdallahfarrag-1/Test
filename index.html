    <!-- كود الجافاسكريبت لإدارة النظام والصفحات -->
    <script>
        // إعدادات اتصال Supabase
        const SUPABASE_URL = 'https://byiayomtcwqlgrknvgcz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_buMxNAI5pVKhgLa_KlcHoQ_Tf_jN6Ks';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserRole = "زائر";
        let currentUserType = "زائر"; 
        let selectedBrand = "";
        let selectedModel = "";
        let selectedPart = "";
        let selectedModelCode = ""; 
        let currentScreenCompatibility = "";
        let currentBatteryModel = "";

        function getRotatingCardStyle(index) {
            const styles = [
                { bg: "bg-blue-50/80 hover:bg-blue-100", border: "border-blue-200", text: "text-blue-800", icon: "text-blue-500" },
                { bg: "bg-emerald-50/80 hover:bg-emerald-100", border: "border-emerald-200", text: "text-emerald-800", icon: "text-emerald-500" },
                { bg: "bg-amber-50/80 hover:bg-amber-100", border: "border-amber-200", text: "text-amber-800", icon: "text-amber-500" }
            ];
            return styles[index % 3];
        }

        const sparePartsList = [
            "شاشة", "بطارية", "ضهرية", "فلاتة ربط", "فلاتة باور", 
            "فلاتة شحن", "فريم", "ميدل", "سماعة داخلية مكالمات",

        // ================= 1. واجهة تسجيل الدخول (الصفحة الأولى) =================
        function renderLoginScreen() {
            const html = `

                        <div class="mb-6">

                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">اسم المحل</label>
                                    <input type="text" id="regShopName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">

                                    <label class="block text-xs font-semibold text-gray-600 mb-1">عنوان المحل</label>
                                    <input type="text" id="regShopAddress" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">

                                </div>
                                <div>

                                    <input type="password" id="regPassword" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">

        function switchTab(tab) {
            const loginForm = document.getElementById('loginFormContainer');
            const registerForm = document.getElementById('registerFormContainer');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-blue-600 shadow-sm";
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-600 shadow-sm";
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const { data, error } = await supabaseClient.rpc('login_user', { p_phone_number: phone, p_password: password });
            if (error || !data || (Array.isArray(data) && data.length === 0)) {
                alert('خطأ في رقم الهاتف أو رمز المرور!');
                return;
            }

            const userData = Array.isArray(data) ? data[0] : data;
            currentUserRole = userData.phone_number || phone;
            currentUserType = userData.user_type || "ادمن"; 
            initAppLayout();
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const user_name = document.getElementById('regUserName').value.trim();
            const shop_name = document.getElementById('regShopName').value.trim();
            const shop_address = document.getElementById('regShopAddress').value.trim();
            const phone_number = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            const { error } = await supabaseClient.rpc('signup_user', { 
                p_user_name: user_name, p_shop_name: shop_name, p_shop_address: shop_address, p_phone_number: phone_number, p_password: password 
            });

            if (error) {
                alert('حدث خطأ أثناء إنشاء الحساب أو الرقم مسجل مسبقاً: ' + error.message);
                return;
            }

            alert('تم إنشاء الحساب بنجاح!');
            currentUserRole = phone_number;
            currentUserType = "ادمن"; 
            initAppLayout();
        }

        function loginAsVisitor() {
            currentUserRole = "زائر";
            currentUserType = "زائر";
            initAppLayout();
        }

        // ================= بناء التخطيط الرئيسي (القائمة الجانبية + محتوى الشاشات) =================

            const layoutHtml = `
                <div class="flex-1 flex flex-col md:flex-row gap-4 overflow-hidden">
                    <!-- القائمة الجانبية (Sidebar) -->
                    <aside class="w-full md:w-64 bg-gray-50 border border-gray-200 rounded-2xl p-4 flex flex-col justify-between flex-shrink-0">
                        <div>
                            <div class="text-center mb-4 pb-3 border-b border-gray-200">
                                <h1 class="text-xl font-bold text-gray-800">Electricity Aswan</h1>
                                <span class="text-xs text-blue-600 font-semibold mt-1 inline-block bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-100">${currentUserRole}</span>
                            </div>

                            <!-- حاوية عناصر القائمة الديناميكية -->

                                <a href="#" onclick="renderMainDashboard(); return false;" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-all">
                                    <span>الرئيسية</span>

                            </nav>
                        </div>

                        <div class="pt-3 border-t border-gray-200 mt-2">
                            <button onclick="renderLoginScreen()" class="w-full flex items-center justify-center gap-2 bg-red-50 hover:bg-red-100 text-red-600 py-2.5 rounded-xl text-sm font-bold transition-all border border-red-200">
                                تسجيل الخروج
                            </button>
                        </div>
                    </aside>

                    <!-- حاوية المحتوى الديناميكي للشاشات -->

                    </main>
                </div>
            `;
            document.getElementById('mainLayoutContainer').innerHTML = layoutHtml;
            loadDynamicSidebarMenu();
            renderMainDashboard();
        }

        // ================= جلب وعرض القائمة الجانبية من قاعدة البيانات =================
        async function loadDynamicSidebarMenu() {
            try {
                const { data: menuItems, error } = await supabaseClient.rpc('get_menu_items', {
                    p_user_type: currentUserType
                });

                if (error) throw error;

                const navContainer = document.getElementById('sidebarNavItems');
                if (!navContainer) return;

                let html = `
                    <a href="#" onclick="renderMainDashboard(); return false;" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-all">
                        <span>الرئيسية</span>
                    </a>
                `;

                if (menuItems && menuItems.length > 0) {
                    menuItems.forEach(item => {
                        html += `
                            <a href="#" onclick="handleMenuAction('${item.action}'); return false;" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-all">
                                <span>${item.title}</span>
                            </a>
                        `;
                    });
                }

                navContainer.innerHTML = html;
            } catch (err) {
                console.error('خطأ في جلب القائمة الجانبية:', err.message);
            }
        }

        function handleMenuAction(action) {
            if (typeof window[action] === 'function') {
                window[action]();
            } else {
                alert(`الإجراء غير معرف: ${action}`);
            }
        }

                                  class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-xs sm:text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        </div>
                        <button onclick="alert('بحث صوتي')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-2.5 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث صوتي">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>

        function renderMainDashboard() {

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-4">

                        <div onclick="alert('تنبيهات بعد التركيب')" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white p-4 sm:p-5 rounded-2xl shadow-md cursor-pointer transition-all flex items-center justify-between">
                            <span class="font-bold text-base sm:text-lg">تنبيهات بعد التركيب</span>

                        <div onclick="alert('للتواصل مع الشركة')" class="bg-gradient-to-r from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 text-white p-4 sm:p-5 rounded-2xl shadow-md cursor-pointer transition-all flex items-center justify-between">
                            <span class="font-bold text-base sm:text-lg">التواصل مع الشركة</span>
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>

            document.getElementById('contentArea').innerHTML = html;

        // ================= 3. شاشة الماركات =================
        async function renderBrandsScreen() {
            let brands = [];
            const { data, error } = await supabaseClient.from('brands').select('*');
            if (!error && data) {
                brands = data.map(item => item.brand_name || item.name || Object.values(item)[1]); 
            }

            let brandsHtml = "";
            if (brands.length > 0) {
                brandsHtml = brands.map((brand, index) => {
                    const style = getRotatingCardStyle(index);
                    return `
                        <div onclick="renderModelsScreen('${brand}')" class="w-full ${style.bg} border ${style.border} p-3.5 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                            <span class="font-bold text-gray-800">${brand}</span>
                            <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>
                    `;
                }).join('');
            } else {
                brandsHtml = `<div class="text-center text-gray-500 py-6">لا توجد ماركات متاحة حالياً</div>`;
            }

            const html = `

                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm font-bold text-gray-800">اختر الماركة</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-2.5 p-1">
                    ${brandsHtml}
                </div>
            `;
            document.getElementById('contentArea').innerHTML = html;

        // ================= 4. شاشة الموديلات =================
        async function renderModelsScreen(brand) {
            selectedBrand = brand;
            let tableName = "", nameColumn = "device_name", codeColumn = "model_code", compatColumn = "screen_compatibility", batteryColumn = "battery_model";
            
            const b = brand.toLowerCase();
            if (b.includes('samsung')) { tableName = 'samsung_models'; nameColumn = 'samsung_phone_name'; codeColumn = 'samsung_phone_code'; compatColumn = 'samsung_screen_compatibility'; batteryColumn = 'samsung_battery_model'; }
            else if (b.includes('iphone') || b.includes('apple')) { tableName = 'apple_models'; nameColumn = 'apple_phone_name'; codeColumn = 'apple_phone_code'; compatColumn = 'apple_screen_compatibility'; batteryColumn = 'apple_battery_model'; }
            else if (b.includes('xiaomi') || b.includes('poco')) { tableName = 'xiaomi_models'; nameColumn = 'xiaomi_phone_name'; codeColumn = 'xiaomi_phone_code'; compatColumn = 'xiaomi_screen_compatibility'; batteryColumn = 'xiaomi_battery_model'; }
            else if (b.includes('redmi')) { tableName = 'redmi_models'; nameColumn = 'redmi_phone_name'; codeColumn = 'redmi_phone_code'; compatColumn = 'redmi_screen_compatibility'; batteryColumn = 'redmi_battery_model'; }
            else if (b.includes('huawei')) { tableName = 'huawei_models'; nameColumn = 'huawei_phone_name'; codeColumn = 'huawei_phone_code'; compatColumn = 'huawei_screen_compatibility'; batteryColumn = 'huawei_battery_model'; }
            else if (b.includes('honor')) { tableName = 'honor_models'; nameColumn = 'honor_phone_name'; codeColumn = 'honor_phone_code'; compatColumn = 'honor_screen_compatibility'; batteryColumn = 'honor_battery_model'; }
            else if (b.includes('oppo')) { tableName = 'oppo_models'; nameColumn = 'oppo_phone_name'; codeColumn = 'oppo_phone_code'; compatColumn = 'oppo_screen_compatibility'; batteryColumn = 'oppo_battery_model'; }
            else if (b.includes('realme')) { tableName = 'realme_models'; nameColumn = 'realme_phone_name'; codeColumn = 'realme_phone_code'; compatColumn = 'realme_screen_compatibility'; batteryColumn = 'realme_battery_model'; }
            else if (b.includes('itel')) { tableName = 'itel_models'; nameColumn = 'itel_phone_name'; codeColumn = 'itel_phone_code'; compatColumn = 'itel_screen_compatibility'; batteryColumn = 'itel_battery_model'; }
            else if (b.includes('nokia')) { tableName = 'nokia_models'; nameColumn = 'nokia_phone_name'; codeColumn = 'nokia_phone_code'; compatColumn = 'nokia_screen_compatibility'; batteryColumn = 'nokia_battery_model'; }
            else if (b.includes('vivo')) { tableName = 'vivo_models'; nameColumn = 'vivo_phone_name'; codeColumn = 'vivo_phone_code'; compatColumn = 'vivo_screen_compatibility'; batteryColumn = 'vivo_battery_model'; }
            else if (b.includes('techno') || b.includes('tecno')) { tableName = 'tecno_models'; nameColumn = 'tecno_phone_name'; codeColumn = 'tecno_phone_code'; compatColumn = 'tecno_screen_compatibility'; batteryColumn = 'tecno_battery_model'; }
            else if (b.includes('infinix')) { tableName = 'infinix_models'; nameColumn = 'infinix_phone_name'; codeColumn = 'infinix_phone_code'; compatColumn = 'infinix_screen_compatibility'; batteryColumn = 'infinix_battery_model'; }

            let models = [];
            if (tableName) {
                const { data, error } = await supabaseClient.from(tableName).select('*');
                if (!error && data) {
                    models = data.map(item => ({
                        device_name: item[nameColumn] || item['device_name'],
                        model_code: item[codeColumn] || item['model_code'],
                        screen_compatibility: item[compatColumn] || item['screen_compatibility'] || null,
                        battery_model: item[batteryColumn] || item['battery_model'] || null
                    }));
                }
            }

            let modelsHtml = "";
            if (models.length > 0) {
                modelsHtml = models.map((m, index) => {
                    const style = getRotatingCardStyle(index);
                    const escapedCompat = m.screen_compatibility ? encodeURIComponent(m.screen_compatibility) : '';
                    const escapedBattery = m.battery_model ? encodeURIComponent(m.battery_model) : '';
                    return `
                        <div onclick="selectModelAndProceed('${m.device_name}', '${m.model_code}', '${escapedCompat}', '${escapedBattery}')" class="w-full ${style.bg} border ${style.border} p-3.5 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm">
                            <span class="font-bold text-gray-800">${m.device_name} <span class="text-xs ${style.icon} font-normal">(${m.model_code})</span></span>
                            <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>
                    `;
                }).join('');
            } else {
                modelsHtml = `<div class="text-center text-gray-500 py-6">لا توجد موديلات متاحة</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderBrandsScreen()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">موديلات ${brand}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-2.5 p-1">
                    ${modelsHtml}
                </div>
            `;
            document.getElementById('contentArea').innerHTML = html;
        }

        function selectModelAndProceed(deviceName, modelCode, compatEncoded, batteryEncoded) {
            selectedModel = `${deviceName} (${modelCode})`;
            selectedModelCode = modelCode;
            currentScreenCompatibility = compatEncoded ? decodeURIComponent(compatEncoded) : "";
            currentBatteryModel = batteryEncoded ? decodeURIComponent(batteryEncoded) : "";
            renderPartsScreen(selectedModel);
        }

        // ================= 5. شاشة قطع الغيار =================
        function renderPartsScreen(model) {
            selectedModel = model;
            let partsHtml = sparePartsList.map((part, index) => {
                const style = getRotatingCardStyle(index);
                return `
                    <div onclick="renderProductDetailScreen('${part}')" class="w-full ${style.bg} border ${style.border} p-3.5 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm">
                        <span class="font-bold text-gray-800">${part}</span>
                        <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                `;
            }).join('');

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderModelsScreen('${selectedBrand}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">${selectedBrand} - ${model}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-2.5 p-1">
                    ${partsHtml}
                </div>
            `;
            document.getElementById('contentArea').innerHTML = html;
        }

        // ================= 6. صفحة المنتج النهائية =================
        function renderProductDetailScreen(part) {
            selectedPart = part;
            let compatibilityText = "هذه القطعة متوافقة مع الإصدارات والنسخ المتطابقة من الماركة.";
            if (part === "شاشة") {
                if (currentScreenCompatibility) {
                    compatibilityText = currentScreenCompatibility.toLowerCase() === 'none' 
                        ? "هذه الشاشة غير متوافقة مع موديلات أخرى (خاصة بهذا الموديل فقط)." 
                        : `الموديلات المتوافقة مع هذه الشاشة: ${currentScreenCompatibility}`;
                } else {
                    compatibilityText = "لا توجد توافقات مسجلة لهذه الشاشة حالياً.";
                }
            }

            let batterySectionHtml = "";
            if (part === "بطارية") {
                let batteryDisplay = currentBatteryModel ? currentBatteryModel : "غير متوفر طراز مسجل لهذا الموديل";
                batterySectionHtml = `
                    <div class="bg-indigo-50/70 border border-indigo-100 p-5 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-indigo-800 mb-2 text-base">🔋 طراز البطارية</h3>
                        <p class="text-sm text-gray-600 font-medium">${batteryDisplay}</p>
                    </div>
                `;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderPartsScreen('${selectedModel}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">${part} (${selectedModel})</h2>
                </div>

                <div class="flex-1 overflow-y-auto space-y-4 p-1">
                    ${batterySectionHtml}
                    <div class="bg-blue-50/70 border border-blue-100 p-5 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-blue-800 mb-2 text-base">🛒 شراء المنتج</h3>
                        <p class="text-sm text-gray-600 mb-3">القطعة متوفرة بالضمان الكامل.</p>
                        <button onclick="alert('تمت إضافة الطلب بنجاح!')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm shadow-md transition-all">
                            شراء المنتج / اطلب الآن
                        </button>
                    </div>
                    <div class="bg-emerald-50/70 border border-emerald-100 p-5 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-emerald-800 mb-2 text-base">🔗 التوافقات</h3>
                        <p class="text-sm text-gray-600 font-medium">${compatibilityText}</p>
                    </div>
                    <div class="bg-amber-50/70 border border-amber-100 p-5 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-amber-800 mb-2 text-base">⚠️ تنبيهات بعد التركيب</h3>
                        <p class="text-sm text-gray-600">يُرجى التجربة الفورية قبل التثبيت النهائي وإزالة اللزقات.</p>
                    </div>
                </div>
            `;
            document.getElementById('contentArea').innerHTML = html;
        }

        window.onload = function() {
            renderLoginScreen();
        };
    </script>
</body>
</html>
