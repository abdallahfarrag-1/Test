<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Aswan</title>
    <!-- تضمين Tailwind CSS لتنسيق التصميم باحترافية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-2 sm:p-4">

    <!-- البطاقة البيضاء الرئيسية -->
    <div class="bg-white w-full max-w-xl rounded-3xl shadow-2xl p-5 sm:p-8 transition-all duration-300">
        
        <!-- ================= الجزء الثابت في الأعلى في كل الصفحات ================= -->
        <div class="border-b border-gray-100 pb-4 mb-5">
            <!-- الصف الأول: اسم الشركة، القائمة المنسدلة، وحالة المستخدم -->
            <div class="flex items-center justify-between mb-4">
                <!-- بطاقة القائمة المنسدلة على اليمين -->
                <div class="relative">
                    <select class="bg-gray-50 border border-gray-200 text-gray-700 text-xs sm:text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-sm">
                        <option value="" disabled selected>القائمة</option>
                        <option value="home">الرئيسية</option>
                        <option value="profile">الملف الشخصي</option>
                        <option value="settings">الإعدادات</option>
                        <option value="logout">تسجيل الخروج</option>
                    </select>
                </div>

                <!-- اسم الشركة في المنتصف -->
                <h1 class="text-xl sm:text-2xl font-bold text-gray-800 tracking-wide">Electricity Aswan</h1>

                <!-- بطاقة شفافة برقم هاتف المستخدم أو زائر على اليسار -->
                <div id="userInfoBadge" class="bg-blue-50/60 border border-blue-100 px-3 py-1.5 rounded-xl text-blue-700 text-xs sm:text-sm font-semibold shadow-sm">
                    زائر
                </div>
            </div>

            <!-- الصف الثاني: أدوات البحث (صوت، كاميرا، كتابة) -->
            <div class="flex items-center gap-2">
                <!-- بطاقة البحث بالكتابة -->
                <div class="flex-1 relative">
                    <input type="text" placeholder="ابحث" 
                           class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-xs sm:text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                </div>
                <!-- بطاقة البحث بالصوت -->
                <button onclick="alert('جارِ الاستماع للصوت...فعل ميكروفون المتصفح')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-2.5 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث صوتي">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>
                <!-- بطاقة البحث بالكاميرا -->
                <button onclick="alert('جارِ فتح الكاميرا للبحث بالمسح الضوئي...')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-2.5 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث بالكاميرا">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </div>
        <!-- ================= نهاية الجزء الثابت ================= -->

        <!-- منطقة المحتوى الديناميكي المتغير حسب التنقل -->
        <div id="dynamicContent"></div>

    </div>

    <!-- كود الجافاسكريبت لإدارة التنقل والصفحات بالكامل -->
    <script>
        // حالة التطبيق الحالية
        let currentUserRole = "زائر"; // يمكن تتغير برقم هاتف عند تسجيل الدخول
        let selectedBrand = "";
        let selectedModel = "";
        let selectedPart = "";

        // بيانات الماركات والموديلات الافتراضية
        const brandsData = [
            "Apple", "Samsung", "Xiaomi", "Redmi", "Infinix", 
            "Oppo", "Realme", "Huawei", "Vivo", "Honor", "Itel", "Nokia", "Techno"
        ];

        const sparePartsList = [
            "شاشة", "بطارية", "ضهرية", "فلاتة ربط", "فلاتة باور", 
            "فلاتة شحن", "فريم", "ميدل", "سماعة داخلية مكالمات", 
            "سماعة خارجية مكبر الصوت", "سوكيت", "ايسيهات"
        ];

        // تحديث شارة حالة المستخدم في الأعلى
        function updateUserInfo() {
            document.getElementById('userInfoBadge').innerText = currentUserRole;
        }

        // عرض الشاشة الرئيسية (تحتوي على الـ 4 بطاقات الرئيسية)
        function renderHomeScreen() {
            const html = `
                <!-- الصورة الترويجية أو البانر بحواف دائرية ذات ظلال -->
                <div class="mb-6">
                    <img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=600&q=80" 
                         alt="Banner" class="w-full h-32 sm:h-36 object-cover rounded-2xl shadow-md">
                </div>

                <!-- الـ 4 بطاقات الرئيسية المطلوبة -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <!-- بطاقة الماركات -->
                    <div onclick="renderBrandsScreen()" class="bg-gradient-to-br from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white p-5 rounded-2xl shadow-lg shadow-blue-500/25 cursor-pointer transition-all transform hover:-translate-y-1 flex items-center justify-between">
                        <span class="font-bold text-base sm:text-lg">الماركات</span>
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>

                    <!-- بطاقة التوافقات -->
                    <div onclick="alert('قريباً: قسم التوافقات')" class="bg-gradient-to-br from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white p-5 rounded-2xl shadow-lg shadow-emerald-500/25 cursor-pointer transition-all transform hover:-translate-y-1 flex items-center justify-between">
                        <span class="font-bold text-base sm:text-lg">التوافقات</span>
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>

                    <!-- بطاقة تنبيهات بعد التركيب -->
                    <div onclick="alert('قريباً: تنبيهات بعد التركيب')" class="bg-gradient-to-br from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white p-5 rounded-2xl shadow-lg shadow-amber-500/25 cursor-pointer transition-all transform hover:-translate-y-1 flex items-center justify-between">
                        <span class="font-bold text-base sm:text-lg">تنبيهات بعد التركيب</span>
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>

                    <!-- بطاقة التواصل مع الشركة -->
                    <div onclick="alert('للتواصل مع الشركة: 01000000000')" class="bg-gradient-to-br from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 text-white p-5 rounded-2xl shadow-lg shadow-purple-500/25 cursor-pointer transition-all transform hover:-translate-y-1 flex items-center justify-between">
                        <span class="font-bold text-base sm:text-lg">التواصل مع الشركة</span>
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                </div>
            `;
            document.getElementById('dynamicContent').innerHTML = html;
        }

        // شاشة عرض الماركات (بطاقات أفقية)
        function renderBrandsScreen() {
            let brandsHtml = brandsData.map(brand => `
                <div onclick="renderModelsScreen('${brand}')" class="bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-300 p-3.5 rounded-2xl shadow-sm text-center font-bold text-gray-700 hover:text-blue-600 cursor-pointer transition-all">
                    ${brand}
                </div>
            `).join('');

            const html = `
                <div class="flex items-center justify-between mb-4">
                    <button onclick="renderHomeScreen()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all">
                        ← عودة للرئيسية
                    </button>
                    <h2 class="text-base sm:text-lg font-bold text-gray-800">اختر الماركة</h2>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-[380px] overflow-y-auto p-1">
                    ${brandsHtml}
                </div>
            `;
            document.getElementById('dynamicContent').innerHTML = html;
        }

        // شاشة عرض الموديلات الخاصة بالماركة المحددة (بطاقات أفقية)
        function renderModelsScreen(brand) {
            selectedBrand = brand;
            // موديلات وهمية افتراضية تختلف حسب الماركة أو تكون عامة للاختبار
            const models = ["موديل 1 - Ultra", "موديل 2 - Pro", "موديل 3 - Prime", "موديل 4 - Standard", "موديل 5 - Plus"];

            let modelsHtml = models.map(model => `
                <div onclick="renderPartsScreen('${model}')" class="bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-300 p-3.5 rounded-2xl shadow-sm text-center font-bold text-gray-700 hover:text-blue-600 cursor-pointer transition-all">
                    ${model}
                </div>
            `).join('');

            const html = `
                <div class="flex items-center justify-between mb-4">
                    <!-- زر العودة للماركات -->
                    <button onclick="renderBrandsScreen()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200">
                        ↩ عودة للماركات (${brand})
                    </button>
                    <h2 class="text-base sm:text-lg font-bold text-gray-800">موديلات ${brand}</h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-[380px] overflow-y-auto p-1">
                    ${modelsHtml}
                </div>
            `;
            document.getElementById('dynamicContent').innerHTML = html;
        }

        // شاشة عرض قطع الغيار للموديل المحدد (بطاقات أفقية)
        function renderPartsScreen(model) {
            selectedModel = model;

            let partsHtml = sparePartsList.map(part => `
                <div onclick="renderProductDetailScreen('${part}')" class="bg-gray-50 hover:bg-emerald-50 border border-gray-200 hover:border-emerald-300 p-3.5 rounded-2xl shadow-sm text-center font-bold text-gray-700 hover:text-emerald-600 cursor-pointer transition-all">
                    ${part}
                </div>
            `).join('');

            const html = `
                <div class="flex items-center justify-between mb-4">
                    <!-- زر العودة للموديلات -->
                    <button onclick="renderModelsScreen('${selectedBrand}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200">
                        ↩ عودة للموديلات
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">${selectedBrand} - ${model}</h2>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-[380px] overflow-y-auto p-1">
                    ${partsHtml}
                </div>
            `;
            document.getElementById('dynamicContent').innerHTML = html;
        }

        // الشاشة النهائية المقسمة (شراء المنتج، التوافقات، تنبيهات بعد التركيب)
        function renderProductDetailScreen(part) {
            selectedPart = part;

            const html = `
                <div class="flex items-center justify-between mb-4">
                    <!-- زر العودة للموديلات (أو قطع الغيار) -->
                    <button onclick="renderPartsScreen('${selectedModel}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200">
                        ↩ عودة لقطع الغيار
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">${part} (${selectedModel})</h2>
                </div>

                <!-- محتوى الصفحة المقسمة إلى 3 أقسام أساسية -->
                <div class="space-y-3.5 max-h-[380px] overflow-y-auto p-1">
                    
                    <!-- 1. شراء المنتج -->
                    <div class="bg-blue-50/70 border border-blue-100 p-4 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-blue-800 mb-2 text-sm sm:text-base flex items-center gap-2">
                            🛒 شراء المنتج
                        </h3>
                        <p class="text-xs text-gray-600 mb-3">متوفر الآن بجودة عالية وضمان التشغيل الكامل.</p>
                        <button onclick="alert('تمت إضافة ${part} إلى سلة الطلبات بنجاح!')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs sm:text-sm shadow-md transition-all">
                            إتمام الشراء / اطلب الآن
                        </button>
                    </div>

                    <!-- 2. التوافقات -->
                    <div class="bg-emerald-50/70 border border-emerald-100 p-4 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-emerald-800 mb-2 text-sm sm:text-base flex items-center gap-2">
                            🔗 التوافقات
                        </h3>
                        <p class="text-xs text-gray-600">هذه القطعة متوافقة تماماً مع الإصدارات الفرعية لنفس الفئة والموديلات المشابهة في الماركة.</p>
                    </div>

                    <!-- 3. تنبيهات بعد التركيب -->
                    <div class="bg-amber-50/70 border border-amber-100 p-4 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-amber-800 mb-2 text-sm sm:text-base flex items-center gap-2">
                            ⚠️ تنبيهات بعد التركيب
                        </h3>
                        <ul class="text-xs text-gray-600 space-y-1 list-disc list-inside">
                            <li>يُرجى اختبار القطعة جيداً قبل إزالة لزقة الضمان.</li>
                            <li>التأكد من فصل البطارية تماماً أثناء عملية التركيب لمنع حدوث قفلة.</li>
                        </ul>
                    </div>

                </div>
            `;
            document.getElementById('dynamicContent').innerHTML = html;
        }

        // تهيئة وتشغيل الواجهة عند فتح الصفحة
        window.onload = function() {
            updateUserInfo();
            renderHomeScreen();
        };
    </script>
</body>
</html>
