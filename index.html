<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Aswan</title>
    <!-- تضمين Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تضمين مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-2 sm:p-4 flex items-center justify-center">

    <!-- البطاقة البيضاء الرئيسية - ملء الشاشة -->
    <div class="bg-white w-full h-[96vh] sm:h-[94vh] rounded-3xl shadow-2xl p-4 sm:p-8 flex flex-col justify-between transition-all duration-300 overflow-hidden">
        
        <!-- حاوية الشاشات الديناميكية -->
        <div id="appContainer" class="flex-1 flex flex-col overflow-hidden"></div>

    </div>

    <!-- كود الجافاسكريبت لإدارة النظام والصفحات والتنقل الأفقي -->
    <script>
        // إعدادات اتصال Supabase
        const SUPABASE_URL = 'https://byiayomtcwqlgrknvgcz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_buMxNAI5pVKhgLa_KlcHoQ_Tf_jN6Ks';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserRole = "زائر";
        let selectedBrand = "";
        let selectedModel = "";
        let selectedPart = "";
        let selectedModelCode = ""; 
        let currentScreenCompatibility = "";

        // دالة مساعدة لإرجاع الألوان بالترتيب (أزرق، أخضر، بني)
        function getRotatingCardStyle(index) {
            const styles = [
                { bg: "bg-blue-50/80 hover:bg-blue-100", border: "border-blue-200", text: "text-blue-800", icon: "text-blue-500" },
                { bg: "bg-emerald-50/80 hover:bg-emerald-100", border: "border-emerald-200", text: "text-emerald-800", icon: "text-emerald-500" },
                { bg: "bg-amber-50/80 hover:bg-amber-100", border: "border-amber-200", text: "text-amber-800", icon: "text-amber-500" }
            ];
            return styles[index % 3];
        }

        // قائمة الماركات المطلوبة
        const brandsData = [
            "Apple", "Samsung", "Xiaomi", "Redmi", "Infinix", 
            "Oppo", "Realme", "Huawei", "Vivo", "Honor", "Techno", "itel", "Nokia"
        ];

        // قطع الغيار المطلوبة
        const sparePartsList = [
            "شاشة", "بطارية", "ضهرية", "فلاتة ربط", "فلاتة باور", 
            "فلاتة شحن", "فريم", "ميدل", "سماعة داخلية مكالمات", 
            "سماعة خارجية مكبر الصوت", "سوكيت", "ايسيهات"
        ];

        // ================= 1. واجهة تسجيل الدخول =================
        function renderLoginScreen() {
            const html = `
                <div class="flex-1 overflow-y-auto px-2">
                    <div class="max-w-xl mx-auto w-full py-4">
                        <div class="text-center mb-6">
                            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wide">Electricity Aswan</h1>
                        </div>

                        <div class="mb-6">
                            <img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=800&q=80" 
                                 alt="Banner" class="w-full h-40 sm:h-52 object-cover rounded-2xl shadow-md">
                        </div>

                        <div class="grid grid-cols-2 gap-2 bg-gray-100 p-1.5 rounded-2xl mb-6">
                            <button onclick="switchTab('login')" id="loginTabBtn" class="py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-blue-600 shadow-sm">تسجيل الدخول</button>
                            <button onclick="switchTab('register')" id="registerTabBtn" class="py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700">إنشاء حساب</button>
                        </div>

                        <div id="loginFormContainer">
                            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رقم الهاتف</label>
                                    <input type="text" id="loginPhone" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رمز المرور</label>
                                    <input type="password" id="loginPassword" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/35 transition-all text-sm">تسجيل الدخول</button>
                            </form>
                        </div>

                        <div id="registerFormContainer" class="hidden">
                            <form onsubmit="handleRegisterSubmit(event)" class="space-y-3.5">
                                <div><label class="block text-xs font-semibold text-gray-600 mb-1">الاسم</label><input type="text" id="regOwnerName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50"></div>
                                <div><label class="block text-xs font-semibold text-gray-600 mb-1">اسم المحل</label><input type="text" id="regShopName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50"></div>
                                <div><label class="block text-xs font-semibold text-gray-600 mb-1">عنوان المحل</label><input type="text" id="regShopAddress" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50"></div>
                                <div><label class="block text-xs font-semibold text-gray-600 mb-1">رقم الهاتف</label><input type="text" id="regPhone" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50"></div>
                                <div><label class="block text-xs font-semibold text-gray-600 mb-1">رمز المرور</label><input type="password" id="regPassword" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50"></div>
                                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/35 transition-all text-sm mt-2">إنشاء الحساب</button>
                            </form>
                        </div>

                        <div class="relative my-6">
                            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                            <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-400">أو</span></div>
                        </div>

                        <div>
                            <button onclick="loginAsVisitor()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl transition-all text-sm border border-gray-200">الدخول كزائر</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('loginFormContainer');
            const registerForm = document.getElementById('registerFormContainer');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-blue-600 shadow-sm";
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-600 shadow-sm";
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const { data, error } = await supabaseClient.from('users').select('*').eq('phone_number', phone).eq('password', password).single();
            if (error || !data) {
                alert('خطأ في رقم الهاتف أو رمز المرور!');
                return;
            }
            currentUserRole = data.phone_number;
            renderMainDashboard();
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const owner_name = document.getElementById('regOwnerName').value.trim();
            const shop_name = document.getElementById('regShopName').value.trim();
            const shop_address = document.getElementById('regShopAddress').value.trim();
            const phone_number = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            const { data, error } = await supabaseClient.from('users').insert([{ owner_name, shop_name, shop_address, phone_number, password }]).select();
            if (error) {
                alert('حدث خطأ أثناء إنشاء الحساب أو الرقم مسجل مسبقاً: ' + error.message);
                return;
            }
            alert('تم إنشاء الحساب بنجاح!');
            currentUserRole = phone_number;
            renderMainDashboard();
        }

        function loginAsVisitor() {
            currentUserRole = "زائر";
            renderMainDashboard();
        }

        // ================= القالب الثابت للأعلى =================
        function getHeaderTemplate() {
            return `
                <div class="border-b border-gray-100 pb-4 mb-4 flex-shrink-0">
                    <div class="text-center mb-3"><h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wide">Electricity Aswan</h1></div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="relative">
                            <select onchange="handleMenuChange(this)" class="bg-gray-50 border border-gray-200 text-gray-700 text-xs sm:text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-sm">
                                <option value="" disabled selected>القائمة</option>
                                <option value="home">الرئيسية</option>
                                <option value="logout">تسجيل الخروج</option>
                            </select>
                        </div>
                        <div class="bg-blue-50/60 border border-blue-100 px-3.5 py-2 rounded-xl text-blue-700 text-xs sm:text-sm font-semibold shadow-sm">${currentUserRole}</div>
                    </div>
                </div>
            `;
        }

        function handleMenuChange(select) {
            if (select.value === 'logout') renderLoginScreen();
            else if (select.value === 'home') renderMainDashboard();
            select.value = "";
        }

        // ================= 2. الرئيسية =================
        function renderMainDashboard() {
            const html = `
                ${getHeaderTemplate()}
                <div class="flex-1 overflow-y-auto space-y-4 px-1">
                    <div class="mb-4"><img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=800&q=80" alt="Banner" class="w-full h-36 sm:h-48 object-cover rounded-2xl shadow-md"></div>
                    <div class="space-y-3.5 pb-4">
                        <div onclick="renderBrandsScreen()" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white p-5 rounded-2xl shadow-md cursor-pointer flex items-center justify-between"><span class="font-bold text-lg">الماركات</span><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></div>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        // ================= 3. شاشة الماركات =================
        function renderBrandsScreen() {
            let brandsHtml = brandsData.map((brand, index) => {
                const style = getRotatingCardStyle(index);
                return `
                    <div onclick="renderModelsScreen('${brand}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                        <span class="font-bold text-gray-800">${brand}</span>
                        <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                `;
            }).join('');

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all">← عودة للرئيسية</button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">اختر الماركة</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">${brandsHtml}</div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        // ================= 4. شاشة الموديلات (الربط المباشر والدقيق حسب اسم الماركة) =================
        async function renderModelsScreen(brand) {
            selectedBrand = brand;
            
            let tableName = "";
            let nameCol = "";
            let codeCol = "";
            let compatCol = "";

            const b = brand.toLowerCase();

            // تخصيص اسم الجدول والأعمدة لكل ماركة بدقة مطلقة
            if (b.includes('samsung')) {
                tableName = 'samsung_models';
                nameCol = 'samsung_phone_name';
                codeCol = 'samsung_phone_code';
                compatCol = 'samsung_screen_compatibility';
            } else if (b.includes('apple') || b.includes('iphone')) {
                tableName = 'apple_models';
                nameCol = 'apple_phone_name';
                codeCol = 'apple_phone_code';
                compatCol = 'apple_screen_compatibility';
            } else if (b.includes('nokia')) {
                tableName = 'nokia_models';
                nameCol = 'nokia_phone_name'; // تم التحديث بناءً على ملاحظتك الدقيقة
                codeCol = 'model_code';
                compatCol = 'screen_compatibility';
            } else if (b.includes('vivo')) {
                tableName = 'vivo_models';
                nameCol = 'vivo_phone_name'; // تم التحديث بناءً على ملاحظتك الدقيقة
                codeCol = 'model_code';
                compatCol = 'screen_compatibility';
            } else {
                // باقي الماركات القياسية
                tableName = `${b}_models`; 
                nameCol = 'phone_name';
                codeCol = 'model_code';
                compatCol = 'screen_compatibility';
            }

            let models = [];
            
            try {
                // جلب الأعمدة المحددة من جدول Supabase
                const { data, error } = await supabaseClient
                    .from(tableName)
                    .select(`${nameCol}, ${codeCol}, ${compatCol}`);

                if (error) {
                    console.error("خطأ Supabase للجدول " + tableName + ":", error.message);
                } else if (data) {
                    models = data.map(item => ({
                        device_name: item[nameCol] || "غير محدد",
                        model_code: item[codeCol] || "",
                        screen_compatibility: item[compatCol] || null
                    }));
                }
            } catch (err) {
                console.error("استثناء أثناء الاتصال بقاعدة البيانات:", err);
            }

            let modelsHtml = "";
            if (models.length > 0) {
                modelsHtml = models.map((m, index) => {
                    const style = getRotatingCardStyle(index);
                    const escapedCompat = m.screen_compatibility ? encodeURIComponent(m.screen_compatibility) : '';
                    return `
                        <div onclick="selectModelAndProceed('${m.device_name}', '${m.model_code}', '${escapedCompat}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                            <span class="font-bold text-gray-800">
                                ${m.device_name} <span class="text-xs ${style.icon} font-normal">(${m.model_code})</span>
                            </span>
                            <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>
                    `;
                }).join('');
            } else {
                modelsHtml = `<div class="text-center text-red-500 py-6 font-semibold">لا توجد بيانات متاحة في جدول (${tableName}) أو أن اسم الجدول/الأعمدة غير مطابق بقاعدة البيانات. تأكد من فتح F12 لمعرفة الخطأ.</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderBrandsScreen()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200">↩ عودة للماركات</button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">موديلات ${brand}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">${modelsHtml}</div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        function selectModelAndProceed(deviceName, modelCode, compatEncoded) {
            selectedModel = `${deviceName} (${modelCode})`;
            selectedModelCode = modelCode;
            currentScreenCompatibility = compatEncoded ? decodeURIComponent(compatEncoded) : "";
            renderPartsScreen(selectedModel);
        }

        // ================= 5. شاشة قطع الغيار =================
        function renderPartsScreen(model) {
            selectedModel = model;
            let partsHtml = sparePartsList.map((part, index) => {
                const style = getRotatingCardStyle(index);
                return `
                    <div onclick="renderProductDetailScreen('${part}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                        <span class="font-bold text-gray-800">${part}</span>
                        <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                `;
            }).join('');

            const html = `
                ${getHeaderTechHeader ? getHeaderTemplate() : getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderModelsScreen('${selectedBrand}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200">↩ عودة للموديلات</button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">${selectedBrand} - ${model}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">${partsHtml}</div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        // ================= 6. صفحة تفاصيل المنتج =================
        function renderProductDetailScreen(part) {
            selectedPart = part;
            let compatibilityText = "هذه القطعة متوافقة مع الإصدارات والنسخ المتطابقة من الماركة.";
            if (part === "شاشة") {
                if (currentScreenCompatibility) {
                    compatibilityText = currentScreenCompatibility.toLowerCase() === 'none' 
                        ? "هذه الشاشة غير متوافقة مع موديلات أخرى (خاصة بهذا الموديل فقط)." 
                        : `الموديلات المتوافقة مع هذه الشاشة: ${currentScreenCompatibility}`;
                } else {
                    compatibilityText = "لا توجد توافقات مسجلة لهذه الشاشة حالياً.";
                }
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderPartsScreen('${selectedModel}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200">↩ عودة لقطع الغيار</button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">${part} (${selectedModel})</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-5 p-1">
                    <div class="bg-blue-50/70 border border-blue-100 p-6 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-blue-800 mb-3 text-base">🛒 شراء المنتج</h3>
                        <p class="text-sm text-gray-600 mb-4">القطعة متوفرة بالضمان الكامل.</p>
                        <button onclick="alert('تمت إضافة الطلب بنجاح!')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-sm shadow-md transition-all">شراء المنتج / اطلب الآن</button>
                    </div>
                    <div class="bg-emerald-50/70 border border-emerald-100 p-6 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-emerald-800 mb-3 text-base">🔗 التوافقات</h3>
                        <p class="text-sm text-gray-600 font-medium">${compatibilityText}</p>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        window.onload = function() {
            renderLoginScreen();
        };
    </script>
</body>
</html>
