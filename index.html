<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع الكهرباء - لوحة التحكم</title>
    <!-- تضمين مكتبة Supabase عبر CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .hidden { display: none; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .grid-item {
            background: #e3f2fd;
            padding: 15px;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #90caf9;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #1976d2;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover { background-color: #115293; }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة تسجيل الدخول -->
    <div id="login-section">
        <h2>تسجيل الدخول - نظام الكهرباء</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="handleLogin()">دخول</button>
        <p id="error-msg" style="color: red;"></p>
    </div>

    <!-- لوحة البيانات والشبكة (30 عنصر) -->
    <div id="dashboard-section" class="hidden">
        <h2>لوحة التحكم - شبكة الـ 30 عنصر</h2>
        <button onclick="fetchData()" style="width: auto; margin-bottom: 15px;">تحديث البيانات من قاعدة البيانات</button>
        
        <div class="grid-container" id="grid-30">
            <!-- سيتم توليد الـ 30 عنصر تلقائياً عبر الجافاسكريبت -->
        </div>
    </div>
</div>

<script>
    // بيانات الاتصال بقاعدة بيانات Supabase الخاصة بك
    const SUPABASE_URL = 'https://byiayomtcwqlgrknvgcz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_buMxNAI5pVKhgLa_KlcHoQ_Tf_jN6Ks';
    
    // تهيئة العميل (Supabase Client)
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // دالة تسجيل الدخول والتحقق
    async function handleLogin() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('error-msg');

        // يمكنك تعديل بيانات الاعتماد الافتراضية حسب رغبتك أو ربطها بجدول المستخدمين في Supabase
        if (user === "admin" && pass === "123456") {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            initGrid();
            fetchData();
        } else {
            errorMsg.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة!";
        }
    }

    // بناء شبكة الـ 30 عنصر في واجهة المستخدم
    function initGrid() {
        const grid = document.getElementById('grid-30');
        grid.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
            const item = document.createElement('div');
            item.className = 'grid-item';
            item.id = `item-${i}`;
            item.innerHTML = `<strong>عنصر ${i}</strong><br><span id="val-${i}">جاري التحميل...</span>`;
            grid.appendChild(item);
        }
    }

    // جلب البيانات من جدول قاعدة البيانات في Supabase
    async function fetchData() {
        try {
            // استبدل 'electricity_data' باسم الجدول الفعلي لديك في Supabase إذا كان مختلفاً
            const { data, error } = await supabaseClient
                .from('electricity_data')
                .select('*');

            if (error) {
                console.error('خطأ في جلب البيانات:', error.message);
                return;
            }

            if (data && data.length > 0) {
                // تحديث العناصر بناءً على البيانات المسترجعة
                data.forEach((row, index) => {
                    const id = index + 1;
                    if (id <= 30) {
                        const valSpan = document.getElementById(`val-${id}`);
                        if (valSpan) {
                            // اعرض الحقل المناسب من جدولك (مثلاً status أو value)
                            valSpan.textContent = row.status || row.value || 'نشط';
                        }
                    }
                });
            }
        } catch (err) {
            console.error('حدث استثناء أثناء الاتصال:', err);
        }
    }
</script>

</body>
</html>
