<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Aswan</title>
    <!-- تضمين Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تضمين مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-2 sm:p-4 flex items-center justify-center relative overflow-x-hidden">

    <!-- القائمة الجانبية (Sidebar) المخفية افتراضياً -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity opacity-0 duration-300"></div>
    <div id="sideMenu" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <!-- رأس القائمة الجانبية -->
        <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
            <h3 class="font-bold text-gray-800 text-base">القائمة الرئيسية</h3>
            <button onclick="toggleSidebar()" class="p-2 text-gray-500 hover:text-red-500 rounded-xl transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <!-- محتوى القائمة الجانبية الديناميكي -->
        <div id="sidebarContent" class="flex-1 overflow-y-auto p-4 space-y-2">
            <!-- يتم تعبئتها ديناميكياً -->
        </div>
    </div>

    <!-- البطاقة البيضاء الرئيسية - ملء الشاشة (Full Screen Card) -->
    <div class="bg-white w-full h-[96vh] sm:h-[94vh] rounded-3xl shadow-2xl p-4 sm:p-8 flex flex-col justify-between transition-all duration-300 overflow-hidden">
        
        <!-- حاوية الشاشات الديناميكية -->
        <div id="appContainer" class="flex-1 flex flex-col overflow-hidden"></div>

    </div>

    <!-- كود الجافاسكريبت لإدارة النظام والصفحات والتنقل الأفقي -->
    <script>
        // ================= 1. المتغيرات وإعدادات الاتصال =================
        const SUPABASE_URL = 'https://byiayomtcwqlgrknvgcz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_buMxNAI5pVKhgLa_KlcHoQ_Tf_jN6Ks';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserRole = "زائر";
        let currentUserType = "زائر";
        let currentUserId = null;
        let selectedBrand = "";
        let selectedModel = "";
        let selectedPart = "";
        let selectedModelCode = ""; 
        let currentScreenCompatibility = "";
        let currentBatteryModel = "";
        let currentUserDataGlobal = null; // لتخزين بيانات المستخدم المؤقتة لتعبئة نموذج التعديل

        // قطع الغيار المطلوبة
        const sparePartsList = [
            "شاشة", "بطارية", "ضهرية", "فلاتة ربط", "فلاتة باور", 
            "فلاتة شحن", "فريم", "ميدل", "سماعة داخلية مكالمات", 
            "سماعة خارجية مكبر الصوت", "سوكيت", "ايسيهات"
        ];

        // ================= نظام التنبيهات المخصص للأعطال والحالة =================
        function showSystemAlert(title, idStatus, menuStatus, errorDetails = "") {
            let message = `--- 🔍 تقرير حالة النظام والتنبيهات ---\n\n`;
            message += `📌 الحدث: ${title}\n`;
            message += `🆔 حالة الـ ID: ${idStatus}\n`;
            message += `📋 حالة جلب المنيو أو البيانات: ${menuStatus}\n`;
            if (errorDetails) {
                message += `⚠️ تفاصيل العطل / السبب: ${errorDetails}\n`;
            } else {
                message += `✅ الحالة العامة: سليم بدون أخطاء\n`;
            }
            alert(message);
        }

        // ================= 2. دوال مساعدة عامة =================
        function toggleSidebar() {
            const sidebar = document.getElementById('sideMenu');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function getRotatingCardStyle(index) {
            const styles = [
                { bg: "bg-blue-50/80 hover:bg-blue-100", border: "border-blue-200", text: "text-blue-800", icon: "text-blue-500" },
                { bg: "bg-emerald-50/80 hover:bg-emerald-100", border: "border-emerald-200", text: "text-emerald-800", icon: "text-emerald-500" },
                { bg: "bg-amber-50/80 hover:bg-amber-100", border: "border-amber-200", text: "text-amber-800", icon: "text-amber-500" }
            ];
            return styles[index % 3];
        }

        function getHeaderTemplate() {
            return `
                <div class="border-b border-gray-100 pb-4 mb-4 flex-shrink-0">
                    <div class="text-center mb-3">
                        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wide">Electricity Aswan</h1>
                    </div>

                    <div class="flex items-center justify-between mb-4">
                        <button onclick="toggleSidebar()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs sm:text-sm rounded-xl px-4 py-2.5 flex items-center gap-2 shadow-sm transition-all cursor-pointer">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                            <span>القائمة</span>
                        </button>

                        <div class="bg-blue-50/60 border border-blue-100 px-3.5 py-2 rounded-xl text-blue-700 text-xs sm:text-sm font-semibold shadow-sm">
                            ${currentUserRole}
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="flex-1 relative">
                            <input type="text" placeholder="ابحث" class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-xs sm:text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        </div>
                        <button onclick="alert('جارِ الاستماع للصوت...فعل ميكروفون المتصفح')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-3 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث صوتي">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        </button>
                        <button onclick="alert('جارِ فتح الكاميرا للمسح الضوئي...')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-3 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث بالكاميرا">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        async function loadDynamicMenuIntoSidebar() {
            let idStatusDesc = "";
            let menuStatusDesc = "";
            let errorReason = "";

            try {
                let menuItems = [];
                
                if (!currentUserId) {
                    idStatusDesc = "❌ لم يتم جلب الـ ID (المستخدم زائر أو غير مسجل دخول)";
                    menuStatusDesc = "❌ فشل جلب محتويات المنيو";
                    errorReason = "لا يوجد مستخدم مسجل دخول حالياً لجلب الصلاحيات.";
                    
                    const sidebarContainer = document.getElementById('sidebarContent');
                    if (sidebarContainer) {
                        sidebarContainer.innerHTML = `<div class="text-center text-gray-400 text-xs py-4">الرجاء تسجيل الدخول أولاً</div>`;
                    }
                    return;
                } else {
                    idStatusDesc = `✅ تم جلب الـ ID بنجاح (القيمة: ${currentUserId})`;
                }

                const { data, error } = await supabaseClient.rpc('get_menu_items', {
                    user_id: currentUserId
                });

                if (!error && data !== null) {
                    if (Array.isArray(data)) {
                        menuItems = data;
                    } else if (typeof data === 'object') {
                        menuItems = Array.isArray(data.data) ? data.data : [data];
                    }
                    menuStatusDesc = "✅ تم جلب محتويات المنيو بنجاح";
                } else {
                    menuStatusDesc = "❌ فشل جلب محتويات المنيو";
                    errorReason = error ? error.message : "دالة جلب المنيو أرجعت بيانات فارغة.";
                    showSystemAlert("تحذير جلب قائمة المنيو", idStatusDesc, menuStatusDesc, errorReason);
                }

                const sidebarContainer = document.getElementById('sidebarContent');
                if (sidebarContainer) {
                    let menuHtml = "";
                    if (menuItems && menuItems.length > 0) {
                        menuItems.forEach(item => {
                            const title = item.menu_items || item.title || "عنصر القائمة"; 
                            const action = item.action || title; 
                            menuHtml += `
                                <button onclick="toggleSidebar(); handleMenuAction('${action}', '${title}');" class="w-full text-right px-4 py-3 rounded-xl bg-gray-50 hover:bg-blue-50 text-gray-700 hover:text-blue-600 font-semibold text-sm transition-all flex items-center gap-3">
                                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                    <span>${title}</span>
                                </button>
                            `;
                        });
                    } else {
                        menuHtml = `<div class="text-center text-gray-400 text-xs py-4">لا توجد عناصر مضافة للقائمة</div>`;
                    }
                    sidebarContainer.innerHTML = menuHtml;
                }

            } catch (err) {
                showSystemAlert("عطل برمجي خطير أثناء تحميل القائمة الجانبية", "⚠️ تعذر التحقق", "❌ خطأ استثنائي", err.message);
            }
        }

        function handleMenuAction(actionName, title = "") {
            const cleanAction = (actionName || "").trim();
            const cleanTitle = (title || "").trim();

            if (cleanAction.includes('البيانات الشخصية') || cleanTitle.includes('البيانات الشخصية') || cleanAction === 'renderUserProfile' || cleanAction === 'profile') {
                renderUserProfileScreen();
            } else if (cleanAction.includes('بيانات المستخدمين') || cleanTitle.includes('بيانات المستخدمين') || cleanAction === 'renderAllUsersScreen') {
                renderAllUsersScreen();
            } else if (typeof window[cleanAction] === 'function') {
                window[cleanAction]();
            } else {
                showSystemAlert("تنبيه عدم مطابقة وظيفة القائمة", `المُعرف الحالي: ${currentUserId || 'زائر'}`, "⚠️ تنبيه وظيفة", `تم اختيار العنصر (${cleanTitle || cleanAction}) ولا توجد دالة برمجية مطابقة له بالاسم.`);
            }
        }

        // ================= دالة عرض شاشة بيانات المستخدمين للأدمن =================
        async function renderAllUsersScreen() {
            if (!currentUserId) {
                showSystemAlert("خطأ صلاحيات مستخدم", "❌ مفقود (زائر)", "⛔ مرفوض", "عذراً، يجب تسجيل الدخول أولاً للاطلاع على بيانات المستخدمين!");
                return;
            }

            document.getElementById('appContainer').innerHTML = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">قائمة بيانات المستخدمين</h2>
                </div>
                <div class="flex-1 flex items-center justify-center">
                    <p class="text-gray-500 text-sm">جاري التحقق من الصلاحيات وجلب البيانات...</p>
                </div>
            `;
            loadDynamicMenuIntoSidebar();

            const { data: response, error } = await supabaseClient.rpc('get_all_users_data', {
                p_user_id: currentUserId
            });

            if (error) {
                showSystemAlert("عطل اتصال قاعدة البيانات (get_all_users_data)", `✅ تم إرسال الـ ID: ${currentUserId}`, "❌ فشل الاتصال", error.message);
                renderMainDashboard();
                return;
            }

            if (!response || response.success === false) {
                showSystemAlert("رفض صلاحية عرض المستخدمين", `✅ تم إرسال الـ ID: ${currentUserId}`, "⛔ صلاحية مرفوضة", response?.message || 'غير مسموح لك بالاطلاع على هذه البيانات');
                renderMainDashboard();
                return;
            }

            const allUsers = response.data || [];

            let usersHtml = "";
            if (allUsers.length > 0) {
                usersHtml = allUsers.map(user => `
                    <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm space-y-2 mb-3">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-gray-800 text-base">${user.user_name || 'بدون اسم'}</span>
                            <span class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-lg font-semibold" dir="ltr">${user.phone_number || ''}</span>
                        </div>
                        <p class="text-gray-600 text-sm">🏪 المحل: ${user.shop_name || 'غير متوفر'}</p>
                        <p class="text-gray-500 text-xs">📍 العنوان: ${user.shop_address || 'غير متوفر'}</p>
                        <p class="text-xs text-gray-700 font-semibold" dir="ltr">🔑 كلمة السر: ${user.password || user.pass || 'غير متوفر'}</p>
                        <p class="text-xs text-indigo-500 font-semibold">الصلاحية: ${user.user_role || 'عضو'}</p>
                    </div>
                `).join('');
            } else {
                usersHtml = `<div class="text-center text-gray-400 py-6">لا يوجد مستخدمين مسجلين حالياً</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">قائمة بيانات المستخدمين</h2>
                </div>
                <div class="flex-1 overflow-y-auto p-1">
                    ${usersHtml}
                </div>
            `;
            
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        // ================= دالة فتح شاشة البيانات الشخصية =================
        async function renderUserProfileScreen() {
            if (!currentUserId && currentUserRole === "زائر") {
                showSystemAlert("تنبيه حساب زائر", "❌ غير متوفر", "⚠️ تنبيه", "يجب تسجيل الدخول أولاً لعرض البيانات الشخصية!");
                return;
            }

            const htmlLoading = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">البيانات الشخصية</h2>
                </div>
                <div class="flex-1 flex items-center justify-center">
                    <p class="text-gray-500 text-sm">جاري جلب البيانات الشخصية...</p>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = htmlLoading;
            loadDynamicMenuIntoSidebar();

            try {
                let userData = null;

                if (currentUserId) {
                    const { data: rpcData, error: rpcError } = await supabaseClient.rpc('get_user_profile', { 
                        user_id: currentUserId 
                    });

                    if (rpcError) {
                        showSystemAlert("عطل دالة get_user_profile", `✅ الـ ID: ${currentUserId}`, "❌ فشل استدعاء RPC", rpcError.message);
                    } else if (rpcData) {
                        userData = Array.isArray(rpcData) ? rpcData[0] : rpcData;
                    }
                }

                if (!userData && currentUserRole && currentUserRole !== "زائر") {
                    const { data: userByPhone, error: errPhone } = await supabaseClient
                        .from('users')
                        .select('*')
                        .eq('phone_number', currentUserRole)
                        .single();
                        
                    if (errPhone) {
                        showSystemAlert("فشل جلب البيانات البديلة برقم الهاتف", "⚠️ تعذر المطابقة", "❌ فشل جدول users", errPhone.message);
                    } else if (userByPhone) {
                        userData = userByPhone;
                    }
                }

                currentUserDataGlobal = userData; // حفظ البيانات مؤقتاً للتعديل

                const name = userData?.user_name || userData?.name || "غير متوفر";
                const shopName = userData?.shop_name || "غير متوفر";
                const shopAddress = userData?.shop_address || "غير متوفر";
                const phone = userData?.phone_number || currentUserRole;
                const password = userData?.password || userData?.pass || "********";

                const htmlContent = `
                    ${getHeaderTemplate()}
                    <div class="flex items-center justify-between mb-4 flex-shrink-0">
                        <div class="flex items-center gap-2">
                            <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                <span>رجوع</span>
                            </button>
                            <button onclick="renderEditProfileScreen()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-sm">
                                تعديل البيانات
                            </button>
                        </div>
                        <h2 class="text-sm sm:text-base font-bold text-gray-800">البيانات الشخصية</h2>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-4 p-2 max-w-xl mx-auto w-full">
                        <div class="bg-white border border-gray-200 p-5 rounded-2xl shadow-sm space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1">الاسم</label>
                                <div class="w-full bg-gray-50 border border-gray-200 text-gray-800 font-semibold px-4 py-3 rounded-xl text-sm">${name}</div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1">اسم المحل</label>
                                <div class="w-full bg-gray-50 border border-gray-200 text-gray-800 font-semibold px-4 py-3 rounded-xl text-sm">${shopName}</div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1">العنوان</label>
                                <div class="w-full bg-gray-50 border border-gray-200 text-gray-800 font-semibold px-4 py-3 rounded-xl text-sm">${shopAddress}</div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1">رقم التليفون</label>
                                <div class="w-full bg-gray-50 border border-gray-200 text-gray-800 font-semibold px-4 py-3 rounded-xl text-sm" dir="ltr">${phone}</div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1">كلمة السر</label>
                                <div class="w-full bg-gray-50 border border-gray-200 text-gray-800 font-semibold px-4 py-3 rounded-xl text-sm" dir="ltr">${password}</div>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('appContainer').innerHTML = htmlContent;
                loadDynamicMenuIntoSidebar();

            } catch (err) {
                showSystemAlert("خطأ استثنائي أثناء عرض البيانات الشخصية", "⚠️ جاري الفحص", "❌ عطل برمجي", err.message);
            }
        }

        // ================= شاشة ودالة تعديل البيانات الشخصية =================
        function renderEditProfileScreen() {
            if (!currentUserId) {
                showSystemAlert("خطأ", "❌ غير متوفر", "⚠️ تنبيه", "يجب تسجيل الدخول أولاً لتعديل بياناتك!");
                return;
            }

            const uData = currentUserDataGlobal || {};

            const html = `

        async function handleUpdateProfile(e) {
            e.preventDefault();
            
            const newName = document.getElementById('editUserName').value.trim();
            const newShopName = document.getElementById('editShopName').value.trim();
            const newAddress = document.getElementById('editShopAddress').value.trim();
            const newPhone = document.getElementById('editPhone').value.trim();
            const newPassword = document.getElementById('editPassword').value.trim();

            const { data, error } = await supabaseClient.rpc('update_user_profile', {
                p_user_id: currentUserId,
                p_user_name: newName,
                p_shop_name: newShopName,
                p_shop_address: newAddress,
                p_phone_number: newPhone,
                p_password: newPassword
            });

            if (error) {
                showSystemAlert("خطأ في الاتصال", `ID: ${currentUserId}`, "❌ فشل التحديث", error.message);
                return;
            }

            if (data && data.success) {
                alert('✅ ' + data.message);
                renderUserProfileScreen(); // العودة لشاشة البيانات الشخصية لتحديث العرض
            } else {
                alert('⚠️ ' + (data?.message || 'تعذر حفظ التعديلات'));
            }
        }

        // ================= دالة حذف الحساب =================
        async function handleDeleteAccount() {
            if (!currentUserId) {
                alert("لا يوجد مستخدم مسجل حالياً!");
                return;
            }

            // رسالة تأكيد لمنع الحذف الخاطئ
            const confirmDelete = confirm("هل أنت متأكد من رغبتك في حذف حسابك نهائياً؟ لا يمكن التراجع عن هذا الإجراء.");
            if (!confirmDelete) return;

            try {
                const { data, error } = await supabaseClient.rpc('delete_user_profile', {
                    p_user_id: currentUserId
                });

                if (error) {
                    alert("حدث خطأ أثناء الاتصال بقاعدة البيانات: " + error.message);
                    return;
                }

                if (data && data.success) {
                    alert(data.message);
                    // إعادة ضبط التطبيق للوضع الافتراضي (زائر) ونقله لشاشة تسجيل الدخول
                    loginAsVisitor();
                    renderLoginScreen();
                } else {
                    alert(data?.message || "تعذر حذف الحساب");
                }
            } catch (err) {
                alert("عطل استثنائي: " + err.message);
            }
        }

            e.preventDefault();

                p_phone_number: phone, 
                p_password: password 
            });

            if (error) {
                showSystemAlert("عطل دالة تسجيل الدخول (login_user)", `📱 الهاتف المدخل: ${phone}`, "❌ فشل RPC", error.message);
                return;

            let resObj = data;

                resObj = data[0];

                showSystemAlert("خطأ في بيانات الاعتماد", `📱 الهاتف: ${phone}`, "⚠️ بيانات خاطئة", resObj?.message || 'خطأ: بيانات الدخول غير صحيحة أو لم يتم إرجاع نتيجة.');

            currentUserRole = resObj.phone_number || phone;

            currentUserId = resObj.user?.id || resObj.user_id || resObj.id || resObj.ID || resObj.uuid || null; 
            
            renderMainDashboard();
            loadDynamicMenuIntoSidebar();

                    }));
                } else if (error) {
                    showSystemAlert(`عطل جلب موديلات (${tableName})`, `الماركة: ${brand}`, "❌ خطأ استعلام جدول", error.message);
                }
            } else {
                showSystemAlert("تحذير عدم مطابقة اسم الجدول للماركة", `الماركة: ${brand}`, "⚠️ تحذير نظام", "لم يتم العثور على جدول مطابق لاسم هذه الماركة في قاعدة البيانات.");
            }

            let modelsHtml = "";
            if (models.length > 0) {
                modelsHtml = models.map((m, index) => {
                    const style = getRotatingCardStyle(index);
                    const escapedCompat = m.screen_compatibility ? encodeURIComponent(m.screen_compatibility) : '';
                    const escapedBattery = m.battery_model ? encodeURIComponent(m.battery_model) : '';
                    const escapedCode = m.model_code ? encodeURIComponent(m.model_code) : '';
                    return `
                        <div onclick="renderPartsScreen('${m.device_name}', '${escapedCode}', '${escapedCompat}', '${escapedBattery}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                            <div class="flex items-center gap-2 text-gray-400">
                                <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            </div>
                            <div class="text-left">
                                <span class="font-bold text-gray-800 block">${m.device_name}</span>
                                ${m.model_code ? `<span class="text-xs text-gray-500 block mt-0.5">الكود: ${m.model_code}</span>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                modelsHtml = `<div class="text-center text-gray-500 py-6">لا توجد موديلات متاحة لهذه الماركة حالياً</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderBrandsScreen()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">اختر موديل (${brand})</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${modelsHtml}
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        function renderPartsScreen(modelName, modelCode, screenCompat, batteryModel) {
            selectedModel = modelName;
            selectedModelCode = modelCode ? decodeURIComponent(modelCode) : '';
            currentScreenCompatibility = screenCompat ? decodeURIComponent(screenCompat) : '';
            currentBatteryModel = batteryModel ? decodeURIComponent(batteryModel) : '';

            let partsHtml = sparePartsList.map((part, index) => {
                const style = getRotatingCardStyle(index);
                return `
                    <div onclick="renderPartDetails('${part}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                        <span class="font-bold text-gray-800">${part}</span>
                        <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                `;
            }).join('');

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderModelsScreen('${selectedBrand}')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">اختر قطعة الغيار (${selectedModel})</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${partsHtml}
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        async function renderPartDetails(part) {
            selectedPart = part;
            
            let extraInfoHtml = "";
            if (part === "شاشة" && currentScreenCompatibility) {
                extraInfoHtml = `
                    <div class="bg-blue-50 border border-blue-200 p-4 rounded-2xl mb-4 shadow-sm">
                        <div class="flex items-center gap-2 mb-1">
                            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <h4 class="font-bold text-blue-900 text-sm">قسم توافق الشاشات:</h4>
                        </div>
                        <p class="text-blue-800 text-sm leading-relaxed">${currentScreenCompatibility}</p>
                    </div>
                `;
            } else if (part === "بطارية" && currentBatteryModel) {
                extraInfoHtml = `
                    <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl mb-4 shadow-sm">
                        <div class="flex items-center gap-2 mb-1">
                            <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            <h4 class="font-bold text-emerald-900 text-sm">موديل البطارية / التوافق:</h4>
                        </div>
                        <p class="text-emerald-800 text-sm leading-relaxed">${currentBatteryModel}</p>
                    </div>
                `;
            }

            let purchaseSectionHtml = `
                <div class="bg-gradient-to-r from-indigo-500 to-blue-600 p-4 rounded-2xl shadow-md text-white flex items-center justify-between mb-4">
                    <div>
                        <span class="block font-bold text-base">قسم شراء المنتج</span>
                        <span class="text-xs text-indigo-100">اطلب قطعة الغيار المتوفرة لهذه الشاشة الآن</span>
                    </div>
                    <button onclick="alert('تم إرسال طلب شراء قطعة: ${part} لجهاز ${selectedModel} بنجاح!')" class="bg-white text-blue-700 hover:bg-blue-50 font-bold px-4 py-2 rounded-xl text-xs sm:text-sm shadow transition-all">
                        طلب الشراء
                    </button>
                </div>
            `;

            let postsHtml = "";
            let maintenanceAlertsHtml = `
                <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl mb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-amber-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <span class="text-amber-900 text-xs sm:text-sm font-semibold">تنبيهات الصيانة: يرجى التأكد من التجربة قبل الفك والتركيب نهائياً.</span>
                </div>
            `;

            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .ilike('device_model', `%${selectedModel}%`)
                    .ilike('spare_part', `%${part}%`);

                if (!error && data && data.length > 0) {
                    postsHtml = data.map((post) => `
                        <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm space-y-2">
                            <h3 class="font-bold text-gray-800 text-base">${post.title || 'ملاحظة صيانة'}</h3>
                            <p class="text-gray-600 text-sm leading-relaxed">${post.content || post.description || ''}</p>
                        </div>
                    `).join('');
                } else if (error) {
                    showSystemAlert("عطل جلب المنشورات (posts)", `الموديل: ${selectedModel} | القطعة: ${part}`, "❌ فشل جدول posts", error.message);
                    postsHtml = `<div class="text-center text-red-400 text-sm py-4">حدث خطأ أثناء جلب المنشورات</div>`;
                } else {
                    postsHtml = `<div class="text-center text-gray-400 text-sm py-4">لا توجد ملاحظات صيانة إضافية مسجلة لهذه القطعة حالياً</div>`;
                }
            } catch (err) {
                showSystemAlert("عطل استثنائي في جدول المنشورات", `الموديل: ${selectedModel}`, "❌ خطأ برمجي", err.message);
                postsHtml = `<div class="text-center text-red-400 text-sm py-4">حدث خطأ أثناء الاتصال</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderPartsScreen('${selectedModel}', '${encodeURIComponent(selectedModelCode)}', '${encodeURIComponent(currentScreenCompatibility)}', '${encodeURIComponent(currentBatteryModel)}')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">${selectedModel} - ${part}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-4 p-1">
                    ${extraInfoHtml}
                    ${purchaseSectionHtml}
                    ${maintenanceAlertsHtml}
                    <div class="space-y-3">
                        ${postsHtml}
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        // تشغيل شاشة تسجيل الدخول عند فتح التطبيق
        window.onload = function() {
            renderLoginScreen();
        };
    </script>
</body>
</html>
