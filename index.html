<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Aswan</title>
    <!-- تضمين Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تضمين مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-2 sm:p-4 flex items-center justify-center">

    <!-- البطاقة البيضاء الرئيسية - ملء الشاشة (Full Screen Card) -->
    <div class="bg-white w-full h-[96vh] sm:h-[94vh] rounded-3xl shadow-2xl p-4 sm:p-8 flex flex-col justify-between transition-all duration-300 overflow-hidden">
        
        <!-- حاوية الشاشات الديناميكية -->
        <div id="appContainer" class="flex-1 flex flex-col overflow-hidden"></div>

    </div>

    <!-- كود الجافاسكريبت لإدارة النظام والصفحات والتنقل الأفقي -->
    <script>
        // إعدادات اتصال Supabase
        const SUPABASE_URL = 'https://byiayomtcwqlgrknvgcz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_buMxNAI5pVKhgLa_KlcHoQ_Tf_jN6Ks';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserRole = "زائر";
        let selectedBrand = "";
        let selectedModel = "";
        let selectedPart = "";
        let currentDeviceData = null; // لتخزين بيانات الموديل المختار لعرض توافقاته الحقيقية

        // قطع الغيار المطلوبة
        const sparePartsList = [
            "شاشة", "بطارية", "ضهرية", "فلاتة ربط", "فلاتة باور", 
            "فلاتة شحن", "فريم", "ميدل", "سماعة داخلية مكالمات", 
            "سماعة خارجية مكبر الصوت", "سوكيت", "ايسيهات"
        ];

        // ================= 1. واجهة تسجيل الدخول (الصفحة الأولى) =================
        function renderLoginScreen() {
            const html = `
                <div class="flex-1 overflow-y-auto px-2">
                    <div class="max-w-xl mx-auto w-full py-4">
                        <div class="text-center mb-6">
                            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wide">Electricity Aswan</h1>
                        </div>

                        <!-- الصورة المستطيلة بحواف دائرية ذات ظلال -->
                        <div class="mb-6">
                            <img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=800&q=80" 
                                 alt="Banner" class="w-full h-40 sm:h-52 object-cover rounded-2xl shadow-md">
                        </div>

                        <!-- أزرار التبديل بين (تسجيل الدخول) و (إنشاء حساب) -->
                        <div class="grid grid-cols-2 gap-2 bg-gray-100 p-1.5 rounded-2xl mb-6">
                            <button onclick="switchTab('login')" id="loginTabBtn" 
                                    class="py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-blue-600 shadow-sm">
                                تسجيل الدخول
                            </button>
                            <button onclick="switchTab('register')" id="registerTabBtn" 
                                    class="py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700">
                                إنشاء حساب
                            </button>
                        </div>

                        <!-- خانة تسجيل الدخول -->
                        <div id="loginFormContainer">
                            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رقم الهاتف</label>
                                    <input type="text" id="loginPhone" required
                                           class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رمز المرور</label>
                                    <input type="password" id="loginPassword" required
                                           class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                
                                <div class="flex items-center justify-between text-sm">
                                    <label class="flex items-center space-x-2 space-x-reverse cursor-pointer">
                                        <input type="checkbox" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                                        <span class="text-gray-600 text-xs">تذكرني</span>
                                    </label>
                                </div>

                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/35 transition-all text-sm">
                                    تسجيل الدخول
                                </button>
                            </form>
                        </div>

                        <!-- خانة إنشاء حساب (مخفية افتراضياً) -->
                        <div id="registerFormContainer" class="hidden">
                            <form onsubmit="handleRegisterSubmit(event)" class="space-y-3.5">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">الاسم</label>
                                    <input type="text" id="regOwnerName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">اسم المحل</label>
                                    <input type="text" id="regShopName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">عنوان المحل</label>
                                    <input type="text" id="regShopAddress" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رقم الهاتف</label>
                                    <input type="text" id="regPhone" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رمز المرور</label>
                                    <input type="password" id="regPassword" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>

                                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/35 transition-all text-sm mt-2">
                                    إنشاء الحساب
                                </button>
                            </form>
                        </div>

                        <div class="relative my-6">
                            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                            <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-400">أو</span></div>
                        </div>

                        <!-- زر الدخول كزائر -->
                        <div>
                            <button onclick="loginAsVisitor()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl transition-all text-sm border border-gray-200">
                                الدخول كزائر
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('loginFormContainer');
            const registerForm = document.getElementById('registerFormContainer');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-blue-600 shadow-sm";
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-600 shadow-sm";
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('phone_number', phone)
                .eq('password', password)
                .single();

            if (error || !data) {
                alert('خطأ في رقم الهاتف أو رمز المرور!');
                return;
            }

            currentUserRole = data.phone_number;
            renderMainDashboard();
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const owner_name = document.getElementById('regOwnerName').value.trim();
            const shop_name = document.getElementById('regShopName').value.trim();
            const shop_address = document.getElementById('regShopAddress').value.trim();
            const phone_number = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            const { data, error } = await supabaseClient
                .from('users')
                .insert([{ owner_name, shop_name, shop_address, phone_number, password }])
                .select();

            if (error) {
                alert('حدث خطأ أثناء إنشاء الحساب أو الرقم مسجل مسبقاً: ' + error.message);
                return;
            }

            alert('تم إنشاء الحساب بنجاح!');
            currentUserRole = phone_number;
            renderMainDashboard();
        }

        function loginAsVisitor() {
            currentUserRole = "زائر";
            renderMainDashboard();
        }

        // ================= قالب الجزء الثابت المتكرر في أعلى كل الصفحات الداخلية =================
        function getHeaderTemplate() {
            return `
                <div class="border-b border-gray-100 pb-4 mb-4 flex-shrink-0">
                    <div class="text-center mb-3">
                        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wide">Electricity Aswan</h1>
                    </div>

                    <div class="flex items-center justify-between mb-4">
                        <div class="relative">
                            <select onchange="handleMenuChange(this)" class="bg-gray-50 border border-gray-200 text-gray-700 text-xs sm:text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-sm">
                                <option value="" disabled selected>القائمة</option>
                                <option value="home">الرئيسية</option>
                                <option value="logout">تسجيل الخروج</option>
                            </select>
                        </div>

                        <div class="bg-blue-50/60 border border-blue-100 px-3.5 py-2 rounded-xl text-blue-700 text-xs sm:text-sm font-semibold shadow-sm">
                            ${currentUserRole}
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="flex-1 relative">
                            <input type="text" placeholder="ابحث" 
                                   class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-xs sm:text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        </div>
                        <button onclick="alert('جارِ الاستماع للصوت...فعل ميكروفون المتصفح')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-3 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث صوتي">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        </button>
                        <button onclick="alert('جارِ فتح الكاميرا للمسح الضوئي...')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-3 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث بالكاميرا">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function handleMenuChange(select) {
            if (select.value === 'logout') {
                renderLoginScreen();
            } else if (select.value === 'home') {
                renderMainDashboard();
            }
            select.value = "";
        }

        // ================= 2. الصفحة الرئيسية =================
        function renderMainDashboard() {
            const html = `
                ${getHeaderTemplate()}

                <div class="flex-1 overflow-y-auto space-y-4 px-1">
                    <div class="mb-4">
                        <img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=800&q=80" 
                             alt="Banner" class="w-full h-36 sm:h-48 object-cover rounded-2xl shadow-md">
                    </div>

                    <div class="space-y-3.5 pb-4">
                        <div onclick="renderBrandsScreen()" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white p-5 sm:p-6 rounded-2xl shadow-md cursor-pointer transition-all flex items-center justify-between">
                            <span class="font-bold text-lg sm:text-xl">الماركات</span>
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>

                        <div onclick="alert('قسم التوافقات')" class="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white p-5 sm:p-6 rounded-2xl shadow-md cursor-pointer transition-all flex items-center justify-between">
                            <span class="font-bold text-lg sm:text-xl">التوافقات</span>
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>

                        <div onclick="alert('تنبيهات بعد التركيب')" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white p-5 sm:p-6 rounded-2xl shadow-md cursor-pointer transition-all flex items-center justify-between">
                            <span class="font-bold text-lg sm:text-xl">تنبيهات بعد التركيب</span>
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>

                        <div onclick="alert('للتواصل مع الشركة')" class="w-full bg-gradient-to-r from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 text-white p-5 sm:p-6 rounded-2xl shadow-md cursor-pointer transition-all flex items-center justify-between">
                            <span class="font-bold text-lg sm:text-xl">التواصل مع الشركة</span>
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        // ================= 3. شاشة الماركات (ديناميكية بالكامل من الجدول) =================
        async function renderBrandsScreen() {
            // جلب كل أسماء المარكات والهواتف من الجدول لاستخلاص الماركات تلقائياً
            const { data, error } = await supabaseClient
                .from('phone_screen_compatibilities')
                .select('phone_name');

            let brandsList = [];
            if (!error && data) {
                // استخراج أول كلمة أو تصنيف الماركة تلقائياً (مثل Samsung, iPhone, Nokia...)
                const extractedBrands = data.map(item => {
                    const parts = item.phone_name.trim().split(' ');
                    // لو أول كلمة Samsung أو iPhone نأخذها، لو Nokia نأخذها، إلخ
                    if (parts[0].toLowerCase() === 'samsung') return 'Samsung';
                    if (parts[0].toLowerCase() === 'iphone') return 'Apple';
                    if (parts[0].toLowerCase() === 'nokia') return 'Nokia';
                    return parts[0]; // لأي ماركة أخرى في الجدول
                });
                // تصفية التكرار
                brandsList = [...new Set(extractedBrands)].filter(Boolean);
            }

            let brandsHtml = "";
            if (brandsList.length > 0) {
                brandsHtml = brandsList.map(brand => `
                    <div onclick="renderModelsScreen('${brand}')" class="w-full bg-blue-50/80 hover:bg-blue-100 border border-blue-200 p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                        <span class="font-bold text-gray-800">${brand}</span>
                        <svg class="w-5 h-5 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                `).join('');
            } else {
                brandsHtml = `<div class="text-center text-gray-500 py-6">جاري تحميل الماركات أو لا توجد بيانات...</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all">
                        ← عودة للرئيسية
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">اختر الماركة</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${brandsHtml}
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        // ================= 4. شاشة الموديلات =================
        async function renderModelsScreen(brand) {
            selectedBrand = brand;
            
            let models = [];
            const { data, error } = await supabaseClient
                .from('phone_screen_compatibilities')
                .select('phone_name, model_code, compatible_screens');

            if (!error && data) {
                // تصفية الموديلات بناءً على الماركة المختارة
                models = data.filter(item => item.phone_name.toLowerCase().includes(brand.toLowerCase()));
            }

            let modelsHtml = "";
            if (models.length > 0) {
                modelsHtml = models.map(m => `
                    <div onclick='renderPartsScreenWithData(${JSON.stringify(m)})' class="w-full bg-blue-50/80 hover:bg-blue-100 border border-blue-200 p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                        <span class="font-bold text-gray-800">
                            ${m.phone_name} <span class="text-xs text-blue-600/70 font-normal">(${m.model_code})</span>
                        </span>
                        <svg class="w-5 h-5 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                `).join('');
            } else {
                modelsHtml = `<div class="text-center text-gray-500 py-6">لا توجد موديلات متاحة حالياً لهذه الماركة</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderBrandsScreen()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200">
                        ↩ عودة للماركات (${brand})
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">موديلات ${brand}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${modelsHtml}
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        function renderPartsScreenWithData(deviceObj) {
            currentDeviceData = deviceObj;
            selectedModel = `${deviceObj.phone_name} (${deviceObj.model_code})`;
            renderPartsScreen(selectedModel);
        }

        // ================= 5. شاشة قطع الغيار =================
        function renderPartsScreen(model) {
            selectedModel = model;

            let partsHtml = sparePartsList.map(part => `
                <div onclick="renderProductDetailScreen('${part}')" class="w-full bg-blue-50/80 hover:bg-blue-100 border border-blue-200 p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                    <span class="font-bold text-gray-800">${part}</span>
                    <svg class="w-5 h-5 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </div>
            `).join('');

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderModelsScreen('${selectedBrand}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200">
                        ↩ عودة للموديلات
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">${selectedBrand} - ${model}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${partsHtml}
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        // ================= 6. صفحة المنتج النهائية =================
        function renderProductDetailScreen(part) {
            selectedPart = part;

            let compatibilitiesText = "هذه القطعة متوافقة مع الإصدارات والنسخ المتطابقة من الماركة.";
            if (part === "شاشة" && currentDeviceData) {
                if (currentDeviceData.compatible_screens) {
                    compatibilitiesText = `متوافق مع: ${currentDeviceData.compatible_screens}`;
                } else {
                    compatibilitiesText = "لا توجد توافقات مسجلة لهذه الشاشة حالياً (تقتصر على نفس الموديل فقط).";
                }
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderPartsScreen('${selectedModel}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200">
                        ↩ عودة لقطع الغيار
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">${part} (${selectedModel})</h2>
                </div>

                <div class="flex-1 overflow-y-auto space-y-4 p-1">
                    <div class="bg-blue-50/70 border border-blue-100 p-4.5 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-blue-800 mb-2 text-sm sm:text-base">🛒 شراء المنتج</h3>
                        <p class="text-xs sm:text-sm text-gray-600 mb-3">القطعة متوفرة بالضمان الكامل.</p>
                        <button onclick="alert('تمت إضافة الطلب بنجاح!')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs sm:text-sm shadow-md transition-all">
                            شراء المنتج / اطلب الآن
                        </button>
                    </div>

                    <div class="bg-emerald-50/70 border border-emerald-100 p-4.5 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-emerald-800 mb-2 text-sm sm:text-base">🔗 التوافقات</h3>
                        <p class="text-xs sm:text-sm text-gray-600">${compatibilitiesText}</p>
                    </div>

                    <div class="bg-amber-50/70 border border-amber-100 p-4.5 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-amber-800 mb-2 text-sm sm:text-base">⚠️ تنبيهات بعد التركيب</h3>
                        <p class="text-xs sm:text-sm text-gray-600">يُرجى التجربة الفورية قبل التثبيت النهائي وإزالة اللزقات.</p>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        window.onload = function() {
            renderLoginScreen();
        };
    </script>
</body>
</html>
