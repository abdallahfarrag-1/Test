        // دالة تسجيل الدخول عبر RPC
        async function handleLoginSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const { data, error } = await supabaseClient
                .rpc('login_user', { 
                    p_phone_number: phone, 
                    p_password: password 
                });

            if (error) {
                alert('خطأ في الاتصال أو بيانات الدخول: ' + error.message);
                return;
            }

            let resObj = data;
            if (Array.isArray(data)) {
                resObj = data[0];
            }

            if (!resObj || resObj.success === false) {
                alert(resObj?.message || 'خطأ في رقم الهاتف أو رمز المرور!');
                return;
            }

            currentUserRole = resObj.phone_number || phone;
            currentUserType = resObj.user_type || "ادمن"; 
            currentUserId = resObj.id || null; // حفظ الـ uuid الخاص بالمستخدم للتحقق منه في القائمة
            renderMainDashboard();
            loadDynamicMenuIntoSidebar(); 
        }

        // دالة إنشاء الحساب عبر RPC

            e.preventDefault();
            const user_name = document.getElementById('regUserName').value.trim();
            const shop_name = document.getElementById('regShopName').value.trim();
            const shop_address = document.getElementById('regShopAddress').value.trim();
            const phone_number = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            const { data, error } = await supabaseClient
                .rpc('register_user', { 
                    p_user_name: user_name, 
                    p_shop_name: shop_name, 
                    p_shop_address: shop_address, 
                    p_phone_number: phone_number, 
                    p_password: password 
                });

            if (error) {
                alert('حدث خطأ أثناء إنشاء الحساب أو الرقم مسجل مسبقاً: ' + error.message);
                return;
            }

            let resObj = data;
            if (Array.isArray(data)) {
                resObj = data[0];
            }

            if (resObj && resObj.success === false) {
                alert(resObj.message || 'حدث خطأ أثناء إنشاء الحساب');
                return;
            }

            alert('تم إنشاء الحساب بنجاح!');
            currentUserRole = phone_number;
            currentUserType = "ادمن"; 
            currentUserId = resObj?.id || null;
            renderMainDashboard();
            loadDynamicMenuIntoSidebar();
        }

        // ================= دالة جلب عناصر القائمة بناءً على الـ UUID ودور الـ Admin عبر دالة الـ RPC =================
        async function loadDynamicMenuIntoSidebar() {
    try {
        let menuItems = [];
        
        // 1. الحصول على المستخدم الحالي لمعرفة الـ UUID الخاص به
        const { data: { user } } = await supabaseClient.auth.getUser();
        
        if (!user) {
            console.log("المستخدم غير مسجل دخول");
            return;
        }

        // 2. استدعاء دالة الـ RPC وإرسال الـ UUID للتحقق من صلاحية الأدمن
        const { data, error } = await supabaseClient.rpc('get_menu_items_for_admin', {
            p_user_id: user.id
        });

        if (!error && data) {
            menuItems = data;
        } else {
            console.error("خطأ أو أن المستخدم ليس أدمن:", error);
        }

        setTimeout(() => {
            const sidebarContainer = document.getElementById('sidebarContent');
            if (!sidebarContainer) return;

            let menuHtml = "";

            if (menuItems && menuItems.length > 0) {
                menuItems.forEach(item => {
                    const title = item.menu_items || "عنصر القائمة"; 
                    const action = item.action || 'defaultAction';
                    menuHtml += `
                        <button onclick="toggleSidebar(); handleMenuAction('${action}');" class="w-full text-right px-4 py-3 rounded-xl bg-gray-50 hover:bg-blue-50 text-gray-700 hover:text-blue-600 font-semibold text-sm transition-all flex items-center gap-3">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            <span>${title}</span>
                        </button>
                    `;
                });
            } else {
                menuHtml = `<div class="text-center text-gray-400 text-xs py-4">لا توجد صلاحية أو عناصر للقائمة</div>`;
            }

            sidebarContainer.innerHTML = menuHtml;
        }, 100);

    } catch (err) {
        console.error('خطأ في جلب عناصر القائمة:', err.message);
    }
}

            if (!error && data) {
                brands = data.map(item => item.brand_name || item.name || Object.values(item)[1]); 
            }

            let brandsHtml = "";
            if (brands.length > 0) {
                brandsHtml = brands.map((brand, index) => {
                    const style = getRotatingCardStyle(index);
                    return `
                        <div onclick="renderModelsScreen('${brand}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">

            } else {
                brandsHtml = `<div class="text-center text-gray-500 py-6">لا توجد ماركات متاحة حالياً أو تأكد من تفعيل RLS والسماح بالقراءة</div>`;

        // ================= 4. شاشة الموديلات =================

            }
            else if (b.includes('iphone') || b.includes('apple')) {
                tableName = 'apple_models';
                nameColumn = 'apple_phone_name';
                codeColumn = 'apple_phone_code';
                compatColumn = 'apple_screen_compatibility';
                batteryColumn = 'apple_battery_model';
            }
            else if (b.includes('xiaomi') || b.includes('poco')) {
                tableName = 'xiaomi_models';
                nameColumn = 'xiaomi_phone_name';
                codeColumn = 'xiaomi_phone_code';

                batteryColumn = 'xiaomi_battery_model';
            }
            else if (b.includes('redmi')) {
                tableName = 'redmi_models';
                nameColumn = 'redmi_phone_name';
                codeColumn = 'redmi_phone_code';
                compatColumn = 'redmi_screen_compatibility';
                batteryColumn = 'redmi_battery_model';

                batteryColumn = 'honor_battery_model';
            }
            else if (b.includes('oppo')) {
                tableName = 'oppo_models';
                nameColumn = 'oppo_phone_name';
                codeColumn = 'oppo_phone_code';
                compatColumn = 'oppo_screen_compatibility';
                batteryColumn = 'oppo_battery_model';
            }
            else if (b.includes('realme')) {
                tableName = 'realme_models';
                nameColumn = 'realme_phone_name';
                codeColumn = 'realme_phone_code';
                compatColumn = 'realme_screen_compatibility';
                batteryColumn = 'realme_battery_model';
            }
            else if (b.includes('itel')) {
                tableName = 'itel_models';
                nameColumn = 'itel_phone_name';
                codeColumn = 'itel_phone_code';
                compatColumn = 'itel_screen_compatibility';
                batteryColumn = 'itel_battery_model';
            }
            else if (b.includes('nokia')) {
                tableName = 'nokia_models';
                nameColumn = 'nokia_phone_name';
                codeColumn = 'nokia_phone_code';
                compatColumn = 'nokia_screen_compatibility';
                batteryColumn = 'nokia_battery_model';
            }
            else if (b.includes('vivo')) {
                tableName = 'vivo_models';
                nameColumn = 'vivo_phone_name';
                codeColumn = 'vivo_phone_code';
                compatColumn = 'vivo_screen_compatibility';
                batteryColumn = 'vivo_battery_model';
            }
            else if (b.includes('techno') || b.includes('tecno')) {
                tableName = 'tecno_models';
                nameColumn = 'tecno_phone_name';
                codeColumn = 'tecno_phone_code';
                compatColumn = 'tecno_screen_compatibility';
                batteryColumn = 'tecno_battery_model';
            }
            else if (b.includes('infinix')) {
                tableName = 'infinix_models';
                nameColumn = 'infinix_phone_name';
                codeColumn = 'infinix_phone_code';
                compatColumn = 'infinix_screen_compatibility';
                batteryColumn = 'infinix_battery_model';
            }

            let models = [];
            if (tableName) {
                const { data, error } = await supabaseClient.from(tableName).select('*');
                if (!error && data) {
                    models = data.map(item => ({
                        device_name: item[nameColumn] || item['device_name'],
                        model_code: item[codeColumn] || item['model_code'],
                        screen_compatibility: item[compatColumn] || item['screen_compatibility'] || null,
                        battery_model: item[batteryColumn] || item['battery_model'] || null
                    }));
                }
            }

            let modelsHtml = "";
            if (models.length > 0) {
                modelsHtml = models.map((m, index) => {
                    const style = getRotatingCardStyle(index);
                    const escapedCompat = m.screen_compatibility ? encodeURIComponent(m.screen_compatibility) : '';
                    const escapedBattery = m.battery_model ? encodeURIComponent(m.battery_model) : '';
                    return `
                        <div onclick="selectModelAndProceed('${m.device_name}', '${m.model_code}', '${escapedCompat}', '${escapedBattery}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">

                            <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>

            } else {
                modelsHtml = `<div class="text-center text-gray-500 py-6">لا توجد موديلات متاحة حالياً لهذه الماركة</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderBrandsScreen()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200 flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">موديلات ${brand}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${modelsHtml}
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        function selectModelAndProceed(deviceName, modelCode, compatEncoded, batteryEncoded) {
            selectedModel = `${deviceName} (${modelCode})`;
            selectedModelCode = modelCode;
            currentScreenCompatibility = compatEncoded ? decodeURIComponent(compatEncoded) : "";
            currentBatteryModel = batteryEncoded ? decodeURIComponent(batteryEncoded) : "";
            renderPartsScreen(selectedModel);
        }

        // ================= 5. شاشة قطع الغيار =================
        function renderPartsScreen(model) {
            selectedModel = model;

            let partsHtml = sparePartsList.map((part, index) => {
                const style = getRotatingCardStyle(index);
                return `
                    <div onclick="renderProductDetailScreen('${part}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                        <span class="font-bold text-gray-800">${part}</span>
                        <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                `;
            }).join('');

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderModelsScreen('${selectedBrand}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200 flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">${selectedBrand} - ${model}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${partsHtml}
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        // ================= 6. صفحة المنتج النهائية =================
        function renderProductDetailScreen(part) {
            selectedPart = part;

            let compatibilityText = "هذه القطعة متوافقة مع الإصدارات والنسخ المتطابقة من الماركة.";
            if (part === "شاشة") {
                if (currentScreenCompatibility) {
                    if (currentScreenCompatibility.toLowerCase() === 'none') {
                        compatibilityText = "هذه الشاشة غير متوافقة مع موديلات أخرى (خاصة بهذا الموديل فقط).";
                    } else {
                        compatibilityText = `الموديلات المتوافقة مع هذه الشاشة: ${currentScreenCompatibility}`;
                    }
                } else {
                    compatibilityText = "لا توجد توافقات مسجلة لهذه الشاشة حالياً.";
                }
            }

            let batterySectionHtml = "";
            if (part === "بطارية") {
                let batteryDisplay = currentBatteryModel ? currentBatteryModel : "غير متوفر طراز مسجل لهذا الموديل";
                batterySectionHtml = `
                    <div class="bg-indigo-50/70 border border-indigo-100 p-6 sm:p-7 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-indigo-800 mb-3 text-base sm:text-lg">🔋 طراز البطارية</h3>
                        <p class="text-sm sm:text-base text-gray-600 font-medium">${batteryDisplay}</p>
                    </div>
                `;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderPartsScreen('${selectedModel}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200 flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">${part} (${selectedModel})</h2>
                </div>

                    ${batterySectionHtml}

                    <div class="bg-blue-50/70 border border-blue-100 p-6 sm:p-7 rounded-2xl shadow-sm">

                        <p class="text-sm sm:text-base text-gray-600 mb-4">القطعة متوفرة بالضمان الكامل.</p>

                    <div class="bg-amber-50/70 border border-amber-100 p-6 sm:p-7 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-amber-800 mb-3 text-base sm:text-lg">⚠️ تنبيهات بعد التركيب</h3>
                        <p class="text-sm sm:text-base text-gray-600">يُرجى التجربة الفورية قبل التثبيت النهائي وإزالة اللزقات.</p>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        // التشغيل المبدئي عند تحميل الصفحة
        window.onload = function() {
