<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrisity "Aswan"</title>
    <!-- استيراد خط Cairo وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- استيراد مكتبة Supabase للربط بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f4f7fb;
            min-height: 100vh;
            color: #102a43;
        }

        /* ================= صفحة تسجيل الدخول / إنشاء حساب ================= */
        #auth-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0056b3, #e3f2fd);
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #0056b3;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-area h1 {
            color: #0056b3;
            font-size: 24px;
            font-weight: 900;
            direction: ltr;
            unicode-bidi: embed;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            background: #f0f4f8;
            border-radius: 10px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            color: #627d98;
            border-radius: 8px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background-color: #0056b3;
            color: #ffffff;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #243b53;
            font-size: 14px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #ccd8e2;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background-color: #fafbfc;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #0056b3;
            background-color: #fff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #004085;
        }

        .guest-btn {
            background-color: #ffffff;
            color: #0056b3;
            border: 2px solid #0056b3;
            margin-top: 10px;
        }

        .guest-btn:hover {
            background-color: #f0f4ff;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #9fb3c8;
            font-size: 13px;
            position: relative;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: #d9e2ec;
        }

        .divider::before { right: 0; }
        .divider::after { left: 0; }

        /* ================= الصفحة الرئيسية / الموديلات / قطع الغيار ================= */
        #home-page, #models-page, #parts-page {
            display: none;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        header {
            background-color: #0056b3;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-right, .header-left {
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 8px;
        }

        .header-center h1 {
            font-size: 18px;
            font-weight: 900;
            direction: ltr;
            unicode-bidi: embed;
            text-align: center;
            color: #fff;
        }

        /* حاوية المحتوى العام */
        .content-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 800;
            color: #0056b3;
            margin-bottom: 15px;
            border-bottom: 2px solid #d9e2ec;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: #e2e8f0;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            color: #0056b3;
        }

        /* شبكة عرض الماركات والموديلات (مربعات متساوية الأضلاع) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            direction: ltr; 
        }

        .card-item {
            background-color: #ffffff;
            border: 2px solid #ccd8e2;
            border-radius: 12px;
            aspect-ratio: 1 / 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 800;
            color: #0056b3;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            padding: 10px;
        }

        .card-item:hover {
            background-color: #0056b3;
            color: #ffffff;
            border-color: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 86, 179, 0.15);
        }

        /* تصميم قائمة قطع الغيار (تكون بشكل قوائم طولية وليست مربعات لسهولة قراءة التفاصيل) */
        .parts-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            direction: rtl;
        }

        .part-card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border: 1.5px solid #ccd8e2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .part-info h3 {
            font-size: 16px;
            color: #0056b3;
            margin-bottom: 4px;
        }

        .part-info p {
            font-size: 13px;
            color: #627d98;
        }

        @media (max-width: 480px) {
            .container { padding: 20px; }
            .grid-container { gap: 10px; }
            .card-item { font-size: 15px; }
        }
    </style>
</head>
<body>

    <!-- ================= الصفحة الأولى: تسجيل الدخول / إنشاء حساب ================= -->
    <div id="auth-page">
        <div class="container">
            <div class="logo-area">
                <h1>Electrisity &ldquo;Aswan&rdquo;</h1>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
                <button class="tab-btn" onclick="switchTab('register')">إنشاء حساب</button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <div id="login-section" class="form-section active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-phone">رقم الهاتف</label>
                        <input type="text" id="login-phone" placeholder="أدخل رقم الهاتف" required>
                    </div>

                    <div class="form-group">
                        <label for="login-pass">رمز المرور</label>
                        <input type="password" id="login-pass" placeholder="أدخل رمز المرور" required>
                    </div>

                    <button type="submit" class="btn">دخول</button>
                </form>

                <div class="divider">أو</div>
                <button type="button" class="btn guest-btn" onclick="handleGuest()">الدخول كزائر</button>
            </div>

            <!-- نموذج إنشاء حساب -->
            <div id="register-section" class="form-section">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="reg-name">الاسم</label>
                        <input type="text" id="reg-name" placeholder="الاسم الكامل" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-shop">اسم المحل</label>
                        <input type="text" id="reg-shop" placeholder="اسم المحل" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-address">عنوان المحل</label>
                        <input type="text" id="reg-address" placeholder="عنوان المحل" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-phone">رقم الهاتف</label>
                        <input type="text" id="reg-phone" placeholder="رقم الهاتف" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-pass">رمز المرور</label>
                        <input type="password" id="reg-pass" placeholder="أنشئ رمز مرور" required>
                    </div>

                    <button type="submit" class="btn">إنشاء حساب وتسجيل الدخول</button>
                </form>

                <div class="divider">أو</div>
                <button type="button" class="btn guest-btn" onclick="handleGuest()">الدخول كزائر</button>
            </div>
        </div>
    </div>

    <!-- ================= الصفحة الرئيسية: عرض الماركات ================= -->
    <div id="home-page">
        <header>
            <div class="header-right" onclick="alert('القائمة الجانبية')" title="القائمة">
                <i class="fa-solid fa-bars fa-lg"></i>
            </div>
            <div class="header-center">
                <h1>Electrisity &ldquo;Aswan&rdquo;</h1>
            </div>
            <div class="header-left" id="user-display" onclick="goToAuth()" title="تسجيل الخروج">
                زائر
            </div>
        </header>

        <div class="content-container">
            <h2 class="section-title">الماركات</h2>
            <div class="grid-container" id="brands-container">
                <!-- تحميل الماركات ديناميكياً -->
            </div>
        </div>
    </div>

    <!-- ================= صفحة عرض الموديلات الخاصة بالماركة ================= -->
    <div id="models-page">
        <header>
            <div class="header-right" onclick="goToHome()" title="الرجوع للماركات">
                <i class="fa-solid fa-arrow-right fa-lg"></i>
            </div>
            <div class="header-center">
                <h1 id="selected-brand-title">الموديلات</h1>
            </div>
            <div class="header-left" onclick="goToAuth()">خروج</div>
        </header>

        <div class="content-container">
            <div class="section-title">
                <span id="models-heading">موديلات الماركة</span>
                <button class="back-btn" onclick="goToHome()">رجوع للماركات</button>
            </div>
            <div class="grid-container" id="models-container">
                <!-- تحميل الموديلات ديناميكياً -->
            </div>
        </div>
    </div>

    <!-- ================= صفحة عرض قطع الغيار الخاصة بالموديل ================= -->
    <div id="parts-page">
        <header>
            <div class="header-right" onclick="goBackToModels()" title="الرجوع للموديلات">
                <i class="fa-solid fa-arrow-right fa-lg"></i>
            </div>
            <div class="header-center">
                <h1 id="selected-model-title">قطع الغيار</h1>
            </div>
            <div class="header-left" onclick="goToAuth()">خروج</div>
        </header>

        <div class="content-container">
            <div class="section-title">
                <span id="parts-heading">قطع الغيار المتوفرة</span>
                <button class="back-btn" onclick="goBackToModels()">رجوع للموديلات</button>
            </div>
            <div class="parts-list" id="parts-container">
                <!-- تحميل قطع الغيار ديناميكياً -->
            </div>
        </div>
    </div>

    <script>
        // إعدادات الاتصال بـ Supabase
        const SUPABASE_URL = 'https://byiayomtcwqlgrknvgcz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_buMxNAI5pVKhgLa_KlcHoQ_Tf_jN6Ks';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentSelectedBrand = '';

        function switchTab(tabName) {
            const loginSection = document.getElementById('login-section');
            const registerSection = document.getElementById('register-section');
            const buttons = document.querySelectorAll('.tab-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            if (tabName === 'login') {
                loginSection.classList.add('active');
                registerSection.classList.remove('active');
                buttons[0].classList.add('active');
            } else {
                registerSection.classList.add('active');
                loginSection.classList.remove('active');
                buttons[1].classList.add('active');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value;
            const pass = document.getElementById('login-pass').value;

            const { data, error } = await _supabase
                .from('users')
                .select('*')
                .eq('phone', phone)
                .eq('password', pass)
                .single();

            if (error || !data) {
                alert("رقم الهاتف أو رمز المرور غير صحيح!");
            } else {
                showHome(data.phone);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const shop = document.getElementById('reg-shop').value;
            const address = document.getElementById('reg-address').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-pass').value;

            const { error } = await _supabase
                .from('users')
                .insert([{ name, shop_name: shop, address, phone, password }]);

            if (error) {
                alert("خطأ أثناء إنشاء الحساب، الرقم مسجل مسبقاً: " + error.message);
            } else {
                alert("تم إنشاء الحساب بنجاح!");
                showHome(phone);
            }
        }

        function handleGuest() {
            showHome('زائر');
        }

        function showHome(userIdentifier) {
            document.getElementById('auth-page').style.display = 'none';
            document.getElementById('models-page').style.display = 'none';
            document.getElementById('parts-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
            document.getElementById('user-display').innerText = userIdentifier;
            loadBrandsFromSupabase();
        }

        function goToHome() {
            document.getElementById('models-page').style.display = 'none';
            document.getElementById('parts-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
        }

        function goToAuth() {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('models-page').style.display = 'none';
            document.getElementById('parts-page').style.display = 'none';
            document.getElementById('auth-page').style.display = 'flex';
        }

        // 1. جلب الماركات
        async function loadBrandsFromSupabase() {
            const grid = document.getElementById('brands-container');
            grid.innerHTML = '<div style="grid-column: span 2; text-align:center; color:#627d98;">جاري التحميل...</div>';

            const { data, error } = await _supabase.from('brands').select('*');

            if (error) {
                grid.innerHTML = '<div style="grid-column: span 2; text-align:center; color:red;">فشل تحميل الماركات</div>';
                return;
            }

            grid.innerHTML = '';
            data.forEach(brand => {
                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerText = brand.name;
                // عند الضغط على الماركة، ننتقل لجلب موديلاتها (مثلاً اسم جدول الموديلات: iphone_models أو بناءً على اسم الماركة)
                card.onclick = () => loadModelsForBrand(brand.name);
                grid.appendChild(card);
            });
        }

        // 2. جلب الموديلات بناءً على الماركة المختارّة
        async function loadModelsForBrand(brandName) {
            currentSelectedBrand = brandName;
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('models-page').style.display = 'block';
            document.getElementById('selected-brand-title').innerText = brandName;
            document.getElementById('models-heading').innerText = `موديلات ${brandName}`;

            const grid = document.getElementById('models-container');
            grid.innerHTML = '<div style="grid-column: span 2; text-align:center; color:#627d98;">جاري التحميل...</div>';

            // تخمين اسم جدول الموديلات بناءً على اسم الماركة (مثال: iphone_models, samsung_models)
            // تحويل الاسم لصغيرة وإزالة المسافات
            let tableName = brandName.toLowerCase().replace(/\s+/g, '_') + '_models';

            const { data, error } = await _supabase.from(tableName).select('*');

            if (error) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align:center; color:red;">عفواً، لا توجد موديلات متاحة حالياً لهذه الماركة (${tableName})</div>`;
                return;
            }

            grid.innerHTML = '';
            data.forEach(model => {
                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerText = model.name || model.model_name; // دعم حسب اسم العامود عندك
                card.onclick = () => loadSpareParts(card.innerText);
                grid.appendChild(card);
            });
        }

        function goBackToModels() {
            document.getElementById('parts-page').style.display = 'none';
            document.getElementById('models-page').style.display = 'block';
        }

        // 3. جلب قطع الغيار الخاصة بالموديل من جدول spare_parts
        async function loadSpareParts(modelName) {
            document.getElementById('models-page').style.display = 'none';
            document.getElementById('parts-page').style.display = 'block';
            document.getElementById('selected-model-title').innerText = modelName;
            document.getElementById('parts-heading').innerText = `قطع غيار: ${modelName}`;

            const container = document.getElementById('parts-container');
            container.innerHTML = '<div style="text-align:center; color:#627d98;">جاري تحميل قطع الغيار...</div>';

            // نفترض أن جدول spare_parts يحتوي على عمود يربط الموديل أو اسم الموديل (مثال: model_name أو model_id)
            const { data, error } = await _supabase
                .from('spare_parts')
                .select('*')
                .eq('model_name', modelName); // عدل اسم العمود `model_name` ليطابق اسم العمود عندك في جدول spare_parts

            if (error || !data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#627d98;">لا توجد قطع غيار مسجلة لهذا الموديل حالياً</div>';
                return;
            }

            container.innerHTML = '';
            data.forEach(part => {
                const item = document.createElement('div');
                item.className = 'part-card';
                item.innerHTML = `
                    <div class="part-info">
                        <h3>${part.name || part.part_name}</h3>
                        <p>السعر: ${part.price ? part.price + ' جنية' : 'غير متوفر'}</p>
                    </div>
                    <div style="font-weight:700; color:#0056b3;">متوفر</div>
                `;
                container.appendChild(item);
            });
        }
    </script>
</body>
</html>
