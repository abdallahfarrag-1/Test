        const SUPABASE_KEY = 'sb_publishable_buMxNAI5pVKhgLa_KlcHoQ_Tf_jN6Ks';

        let selectedBrand = "";

            "فلاتة شحن", "فريم", "ميدل", "سماعة داخلية مكالمات",

        // ================= 1. واجهة تسجيل الدخول =================
        function renderLoginScreen() {

                        <div class="grid grid-cols-2 gap-2 bg-gray-100 p-1.5 rounded-2xl mb-6">

                                    <input type="text" id="loginPhone" required

                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رمز المرور</label>
                                    <input type="password" id="loginPassword" required

                                </div>

                                    تسجيل الدخول
                                </button>
                            </form>
                        </div>

                        <div id="registerFormContainer" class="hidden">
                            <form onsubmit="handleRegisterSubmit(event)" class="space-y-3.5">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">الاسم</label>
                                    <input type="text" id="regOwnerName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">اسم المحل</label>
                                    <input type="text" id="regShopName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50">

                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">عنوان المحل</label>
                                    <input type="text" id="regShopAddress" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50">

                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رمز المرور</label>
                                    <input type="password" id="regPassword" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50">

        function switchTab(tab) {
            const loginForm = document.getElementById('loginFormContainer');
            const registerForm = document.getElementById('registerFormContainer');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-blue-600 shadow-sm";
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-600 shadow-sm";
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const { data, error } = await supabaseClient.from('users').select('*').eq('phone_number', phone).eq('password', password).single();
            if (error || !data) { alert('خطأ في رقم الهاتف أو رمز المرور!'); return; }
            currentUserRole = data.phone_number;
            renderMainDashboard();
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const owner_name = document.getElementById('regOwnerName').value.trim();
            const shop_name = document.getElementById('regShopName').value.trim();
            const shop_address = document.getElementById('regShopAddress').value.trim();
            const phone_number = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const { error } = await supabaseClient.from('users').insert([{ owner_name, shop_name, shop_address, phone_number, password }]);
            if (error) { alert('خطأ أثناء إنشاء الحساب: ' + error.message); return; }
            alert('تم إنشاء الحساب بنجاح!');
            currentUserRole = phone_number;
            renderMainDashboard();
        }

        function loginAsVisitor() {
            currentUserRole = "زائر";
            renderMainDashboard();
        }

        // ================= الهيدر العلوي الموحد (القائمة فوق، الاسم في النص، وزر الزائر على الشمال أو العكس) =================

            return `
                <div class="border-b border-gray-100 pb-3 mb-3 flex-shrink-0">
                    <!-- الشريط العلوي: قائمة، اسم الشركة في النص، زر المستخدم -->
                    <div class="flex items-center justify-between mb-3">
                        <div class="relative">
                            <select onchange="handleMenuChange(this)" class="bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded-xl px-2.5 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-sm">
                                <option value="" disabled selected>القائمة</option>
                                <option value="home">الرئيسية</option>
                                <option value="logout">تسجيل الخروج</option>

                        </div>

                        <h1 class="text-lg sm:text-xl font-bold text-gray-800 tracking-wide">Electricity Aswan</h1>

                    <!-- خانة البحث العام والبحث الصوتي والكاميرا -->

                        </div>
                        <button onclick="alert('جارِ الاستماع للصوت...')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-2.5 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث صوتي">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>

                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>

        function handleMenuChange(select) {
            if (select.value === 'logout') renderLoginScreen();
            else if (select.value === 'home') renderMainDashboard();

        }

                    <div onclick="renderBrandsScreen()" class="bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl shadow-md cursor-pointer transition-all flex flex-col justify-between items-center text-center">
                        <svg class="w-8 h-8 mb-2 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>

                        <svg class="w-8 h-8 mb-2 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>

                    <div onclick="alert('التواصل مع الشركة')" class="bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-2xl shadow-md cursor-pointer transition-all flex flex-col justify-between items-center text-center">
                        <svg class="w-8 h-8 mb-2 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>

        // ================= 3. شاشة الماركات =================
        function renderBrandsScreen() {
            let brandsHtml = brandsData.map(brand => `
                <div onclick="renderModelsScreen('${brand}')" class="w-full bg-blue-50 hover:bg-blue-100 border border-blue-200 p-3.5 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all">

                    <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>

            `).join('');

            const html = `

                <div class="flex items-center justify-between mb-3 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-xl text-xs font-semibold">← عودة للرئيسية</button>
                    <h2 class="text-xs font-bold text-gray-800">اختر الماركة</h2>

        }

        // ================= 4. شاشة التوافقات (مع خانة بحث كتابي وصوتي مخصصة للتوافقات) =================
        function renderCompatibilitiesSearchScreen() {
            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-3 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-xl text-xs font-semibold">← عودة للرئيسية</button>
                    <h2 class="text-xs font-bold text-gray-800">قسم التوافقات</h2>
                </div>

                <div class="flex-1 overflow-y-auto space-y-4 p-1">
                    <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-emerald-800 text-sm mb-2">بحث مخصص داخل التوافقات</h3>
                        <div class="flex items-center gap-2">

                                   class="w-full bg-white border border-gray-300 text-gray-700 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <button onclick="alert('جارِ البحث الصوتي للتوافقات...')" class="bg-white hover:bg-gray-50 border border-gray-300 p-2.5 rounded-xl text-emerald-600" title="بحث صوتي">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                            </button>
                        </div>
                        <button onclick="alert('جاري تنفيذ البحث...')" class="w-full mt-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-md">
                            بحث عن التوافقات
                        </button>
                    </div>

                    <div class="text-center text-gray-500 text-xs py-4">
                        أدخل اسم الجهاز أو اختر من الماركات لاستعراض القطع والتوافقات مباشرة.
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        // ================= 5. شاشة الموديلات =================
        async function renderModelsScreen(brand) {
            selectedBrand = brand;
            let tableName = "";
            let nameColumn = "device_name";
            let codeColumn = "model_code";
            
            const b = brand.toLowerCase();
            if (b.includes('samsung')) { tableName = 'samsung_models'; nameColumn = 'phone_name'; codeColumn = 'phone_code'; }
            else if (b.includes('iphone') || b.includes('apple')) tableName = 'iphone_models';
            else if (b.includes('honor')) tableName = 'honor_models';
            else if (b.includes('huawei')) tableName = 'huawei_models';
            else if (b.includes('itel')) tableName = 'itel_models';
            else if (b.includes('nokia')) tableName = 'nokia_models';
            else if (b.includes('vivo')) tableName = 'vivo_models';
            else if (b.includes('techno') || b.includes('tecno')) tableName = 'tecno_models';
            else if (b.includes('oppo')) tableName = 'oppo_models';
            else if (b.includes('realme')) tableName = 'realme_models';
            else if (b.includes('redmi')) tableName = 'redmi_models';
            else if (b.includes('xiaomi') || b.includes('poco')) tableName = 'xiaomi_poco_models';
            else if (b.includes('infinix')) tableName = 'infinix_models';

            let models = [];
            if (tableName) {
                let queryFields = `${nameColumn}, ${codeColumn}`;
                if (tableName === 'samsung_models') queryFields += `, screen_compatibility`;
                const { data } = await supabaseClient.from(tableName).select(queryFields);
                if (data) {
                    models = data.map(item => ({
                        device_name: item[nameColumn],
                        model_code: item[codeColumn],
                        screen_compatibility: item.screen_compatibility || null
                    }));
                }
            }

            let modelsHtml = models.length > 0 ? models.map(m => {
                const escapedCompat = m.screen_compatibility ? encodeURIComponent(m.screen_compatibility) : '';
                return `
                    <div onclick="selectModelAndProceed('${m.device_name}', '${m.model_code}', '${escapedCompat}')" class="w-full bg-blue-50 hover:bg-blue-100 border border-blue-200 p-3.5 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all">
                        <span class="font-bold text-gray-800 text-sm">${m.device_name} <span class="text-xs text-blue-500 font-normal">(${m.model_code})</span></span>
                        <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                `;
            }).join('') : `<div class="text-center text-gray-500 py-6 text-xs">لا توجد موديلات متاحة</div>`;

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-3 flex-shrink-0">
                    <button onclick="renderBrandsScreen()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-xl text-xs font-bold border border-blue-200">↩ عودة للماركات</button>
                    <h2 class="text-xs font-bold text-gray-800">موديلات ${brand}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-2.5 p-1">${modelsHtml}</div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        let currentScreenCompatibility = "";
        function selectModelAndProceed(deviceName, modelCode, compatEncoded) {
            selectedModel = `${deviceName} (${modelCode})`;
            selectedModelCode = modelCode;
            currentScreenCompatibility = compatEncoded ? decodeURIComponent(compatEncoded) : "";
            renderPartsScreen(selectedModel);
        }

        // ================= 6. شاشة قطع الغيار =================
        function renderPartsScreen(model) {
            let partsHtml = sparePartsList.map(part => `
                <div onclick="renderProductDetailScreen('${part}')" class="w-full bg-blue-50 hover:bg-blue-100 border border-blue-200 p-3.5 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all">
                    <span class="font-bold text-gray-800 text-sm">${part}</span>
                    <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </div>
            `).join('');

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-3 flex-shrink-0">
                    <button onclick="renderModelsScreen('${selectedBrand}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-xl text-xs font-bold border border-blue-200">↩ عودة للموديلات</button>
                    <h2 class="text-xs font-bold text-gray-800">${model}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-2.5 p-1">${partsHtml}</div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        // ================= 7. صفحة المنتج النهائية =================
        function renderProductDetailScreen(part) {
            selectedPart = part;
            let compatibilityText = currentScreenCompatibility ? `التوافقات: ${currentScreenCompatibility}` : "لا توجد توافقات مسجلة.";

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-3 flex-shrink-0">
                    <button onclick="renderPartsScreen('${selectedModel}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-xl text-xs font-bold border border-blue-200">↩ عودة للقطع</button>
                    <h2 class="text-xs font-bold text-gray-800">${part}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-4 p-1">
                    <div class="bg-blue-50 border border-blue-200 p-5 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-blue-800 mb-2 text-sm">🛒 شراء المنتج</h3>
                        <button onclick="alert('تم الطلب بنجاح!')" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md">اطلب الآن</button>
                    </div>
                    <div class="bg-emerald-50 border border-emerald-200 p-5 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-emerald-800 mb-2 text-sm">🔗 التوافقات</h3>
                        <p class="text-xs text-gray-700">${compatibilityText}</p>
                    </div>
                    <div class="bg-amber-50 border border-amber-200 p-5 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-amber-800 mb-2 text-sm">⚠️ تنبيهات بعد التركيب</h3>
                        <p class="text-xs text-gray-700">يُرجى التجربة الفورية قبل اللزق النهائي.</p>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        window.onload = function() { renderLoginScreen(); };
    </script>
</body>
</html>
