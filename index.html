<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity - تسجيل الدخول</title>
    <!-- استيراد خط عربي جميل من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0052D4, #4364F7, #6FB1FC);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-area h1 {
            color: #0052D4;
            font-size: 32px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .logo-area p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #0052D4;
            box-shadow: 0 0 5px rgba(0, 82, 212, 0.2);
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
            color: #555;
        }

        .options-row label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .btn-login {
            background-color: #0052D4;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-login:hover {
            background-color: #003fa7;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #888;
            font-size: 13px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }

        .divider::before {
            margin-left: 10px;
        }

        .divider::after {
            margin-right: 10px;
        }

        .btn-guest {
            background-color: #f3f4f6;
            color: #0052D4;
            border: 1px solid #0052D4;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-guest:hover {
            background-color: #ebf5ff;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <h1>Electricity</h1>
            <p>مرحباً بك، يرجى تسجيل الدخول للمتابعة</p>
        </div>

        <form action="#" method="POST">
            <div class="input-group">
                <label for="phone">رقم الهاتف</label>
                <input type="tel" id="phone" name="phone" placeholder="أدخل رقم الهاتف" required>
            </div>

            <div class="input-group">
                <label for="password">رمز المرور</label>
                <input type="password" id="password" name="password" placeholder="أدخل رمز المرور" required>
            </div>

            <div class="options-row">
                <label>
                    <input type="checkbox" name="remember"> تذكرني
                </label>
            </div>

            <button type="submit" class="btn-login">تسجيل الدخول</button>
        </form>

        <div class="divider">أو</div>

        <a href="#" class="btn-guest">الدخول كزائر</a>
    </div>

</body>
</html>
