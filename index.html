<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrisity "Aswan"</title>
    <!-- استيراد خط عربي وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0056b3, #e3f2fd);
            min-height: 100vh;
            color: #333;
        }

        /* حاوية صفحة تسجيل الدخول */
        #auth-page {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 86, 179, 0.2);
            border-top: 5px solid #0056b3;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area h1 {
            color: #0056b3;
            font-size: 24px;
            font-weight: 700;
            direction: ltr;
            unicode-bidi: embed;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: #0056b3;
            border-bottom: 3px solid #0056b3;
            margin-bottom: -2px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #0056b3;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b0bec5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #0056b3;
            box-shadow: 0 0 5px rgba(0, 86, 179, 0.3);
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #555;
        }

        .remember-me input {
            margin-left: 8px;
            accent-color: #0056b3;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #003d82;
        }

        .guest-btn {
            background-color: #ffffff;
            color: #0056b3;
            border: 2px solid #0056b3;
            margin-top: 10px;
        }

        .guest-btn:hover {
            background-color: #e3f2fd;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #888;
            font-size: 13px;
            position: relative;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: #ddd;
        }

        .divider::before { right: 0; }
        .divider::after { left: 0; }

        /* حاوية الصفحة الرئيسية (مخفية افتراضياً حتى يتم الدخول) */
        #home-page {
            display: none;
            background-color: #f4f9ff;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        header {
            background-color: #0056b3;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .header-right, .header-left {
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .header-center h1 {
            font-size: 20px;
            font-weight: 700;
            direction: ltr;
            unicode-bidi: embed;
            text-align: center;
            color: #fff;
        }

        .search-container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #fff;
            border: 2px solid #0056b3;
            border-radius: 12px;
            padding: 8px 15px;
            box-shadow: 0 4px 15px rgba(0, 86, 179, 0.1);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            padding: 5px;
            background: transparent;
        }

        .search-actions {
            display: flex;
            gap: 12px;
            margin-right: 10px;
        }

        .search-actions button {
            background: none;
            border: none;
            color: #0056b3;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-actions button:hover {
            color: #003d82;
        }

        .brands-section {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #0056b3;
            margin-bottom: 15px;
            border-bottom: 2px solid #e3f2fd;
            padding-bottom: 5px;
        }

        .brands-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            direction: ltr; /* من اليسار لليمين */
        }

        .brand-card {
            background-color: #ffffff;
            border: 2px solid #0056b3;
            border-radius: 12px;
            aspect-ratio: 1 / 1; /* مربع متساوي الأضلاع */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: 700;
            color: #0056b3;
            box-shadow: 0 4px 10px rgba(0, 86, 179, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            padding: 10px;
        }

        .brand-card:hover {
            background-color: #0056b3;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 86, 179, 0.2);
        }

        @media (max-width: 480px) {
            .brands-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            .brand-card {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- ================= الصفحة الأولى: تسجيل الدخول / إنشاء حساب ================= -->
    <div id="auth-page">
        <div class="container">
            <div class="logo-area">
                <h1>Electrisity &ldquo;Aswan&rdquo;</h1>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
                <button class="tab-btn" onclick="switchTab('register')">إنشاء حساب</button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <div id="login-section" class="form-section active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-phone">رقم الهاتف</label>
                        <input type="text" id="login-phone" placeholder="أدخل رقم الهاتف" required>
                    </div>

                    <div class="form-group">
                        <label for="login-pass">رمز المرور</label>
                        <input type="text" id="login-pass" placeholder="أدخل رمز المرور" required>
                    </div>

                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember" style="margin-bottom:0; display:inline; color:#555;">تذكرني</label>
                    </div>

                    <button type="submit" class="btn">دخول</button>
                </form>

                <div class="divider">أو</div>
                <button type="button" class="btn guest-btn" onclick="handleGuest()">الدخول كزائر</button>
            </div>

            <!-- نموذج إنشاء حساب -->
            <div id="register-section" class="form-section">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="reg-name">الاسم</label>
                        <input type="text" id="reg-name" placeholder="الاسم الكامل" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-shop">اسم المحل</label>
                        <input type="text" id="reg-shop" placeholder="اسم المحل" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-address">عنوان المحل</label>
                        <input type="text" id="reg-address" placeholder="عنوان المحل" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-phone">رقم الهاتف</label>
                        <input type="text" id="reg-phone" placeholder="رقم الهاتف" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-pass">رمز المرور</label>
                        <input type="text" id="reg-pass" placeholder="أنشئ رمز مرور" required>
                    </div>

                    <button type="submit" class="btn">إنشاء حساب وتسجيل الدخول</button>
                </form>

                <div class="divider">أو</div>
                <button type="button" class="btn guest-btn" onclick="handleGuest()">الدخول كزائر</button>
            </div>
        </div>
    </div>


    <!-- ================= الصفحة الثانية: الرئيسية والماركات ================= -->
    <div id="home-page">
        <header>
            <div class="header-right" onclick="openMenu()" title="القائمة">
                <i class="fa-solid fa-bars fa-lg"></i>
            </div>
            <div class="header-center">
                <h1>Electrisity &ldquo;Aswan&rdquo;</h1>
            </div>
            <div class="header-left" id="user-display" onclick="goToAuth()" title="تسجيل الخروج / تبديل الحساب">
                زائر
            </div>
        </header>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="ابحث عن قطع الغيار، الماركات...">
                <div class="search-actions">
                    <button type="button" onclick="startCameraSearch()" title="بحث بالكاميرا">
                        <i class="fa-solid fa-camera"></i>
                    </button>
                    <button type="button" onclick="startVoiceSearch()" title="بحث بالصوت">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="brands-section">
            <h2 class="section-title">الماركات</h2>
            <div class="brands-grid">
                <div class="brand-card" onclick="selectBrand('Apple')">Apple</div>
                <div class="brand-card" onclick="selectBrand('Samsung')">Samsung</div>
                <div class="brand-card" onclick="selectBrand('Xiaomi')">Xiaomi</div>
                <div class="brand-card" onclick="selectBrand('Redmi')">Redmi</div>
                <div class="brand-card" onclick="selectBrand('Infinix')">Infinix</div>
                <div class="brand-card" onclick="selectBrand('Oppo')">Oppo</div>
                <div class="brand-card" onclick="selectBrand('Realme')">Realme</div>
                <div class="brand-card" onclick="selectBrand('Huawei')">Huawei</div>
                <div class="brand-card" onclick="selectBrand('Vivo')">Vivo</div>
                <div class="brand-card" onclick="selectBrand('Honor')">Honor</div>
                <div class="brand-card" onclick="selectBrand('Techno')">Techno</div>
                <div class="brand-card" onclick="selectBrand('itel')">itel</div>
                <div class="brand-card" onclick="selectBrand('Nokia')">Nokia</div>
            </div>
        </div>
    </div>


    <script>
        // التبديل بين تبويبات تسجيل الدخول وإنشاء الحساب
        function switchTab(tabName) {
            const loginSection = document.getElementById('login-section');
            const registerSection = document.getElementById('register-section');
            const buttons = document.querySelectorAll('.tab-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            if (tabName === 'login') {
                loginSection.classList.add('active');
                registerSection.classList.remove('active');
                buttons[0].classList.add('active');
            } else {
                registerSection.classList.add('active');
                loginSection.classList.remove('active');
                buttons[1].classList.add('active');
            }
        }

        // التعامل مع تسجيل الدخول والانتقال للرئيسية
        function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value;
            showHome(phone);
        }

        // التعامل مع إنشاء الحساب والانتقال للرئيسية
        function handleRegister(e) {
            e.preventDefault();
            const phone = document.getElementById('reg-phone').value;
            showHome(phone);
        }

        // الدخول كزائر (تم تصحيح اسم الدالة)
        function handleGuest() {
            showHome('زائر');
        }

        // إظهار الصفحة الرئيسية وإخفاء صفحة الدخول
        function showHome(userIdentifier) {
            document.getElementById('auth-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
            document.getElementById('user-display').innerText = userIdentifier;
        }

        // الرجوع لصفحة الدخول (عند الضغط على اسم المستخدم/الزائر)
        function goToAuth() {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('auth-page').style.display = 'flex';
        }

        // أزرار الوظائف في الصفحة الرئيسية
        function openMenu() {
            alert("تم فتح القائمة الجانبية");
        }

        function startCameraSearch() {
            alert("جاري فتح الكاميرا للبحث...");
        }

        function startVoiceSearch() {
            alert("جاري الاستماع للبحث الصوتي...");
        }

        function selectBrand(brandName) {
            alert("تم اختيار ماركة: " + brandName);
        }
    </script>
</body>
</html>
