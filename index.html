<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrisity "Aswan"</title>
    <!-- استيراد خط Cairo وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f4f7fb;
            min-height: 100vh;
            color: #102a43;
        }

        /* ================= صفحة تسجيل الدخول / إنشاء حساب ================= */
        #auth-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0056b3, #e3f2fd);
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #0056b3;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-area h1 {
            color: #0056b3;
            font-size: 24px;
            font-weight: 900;
            direction: ltr;
            unicode-bidi: embed;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            background: #f0f4f8;
            border-radius: 10px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            color: #627d98;
            border-radius: 8px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background-color: #0056b3;
            color: #ffffff;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #243b53;
            font-size: 14px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #ccd8e2;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background-color: #fafbfc;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #0056b3;
            background-color: #fff;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #486581;
        }

        .remember-me input {
            margin-left: 8px;
            accent-color: #0056b3;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #004085;
        }

        .guest-btn {
            background-color: #ffffff;
            color: #0056b3;
            border: 2px solid #0056b3;
            margin-top: 10px;
        }

        .guest-btn:hover {
            background-color: #f0f4ff;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #9fb3c8;
            font-size: 13px;
            position: relative;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: #d9e2ec;
        }

        .divider::before { right: 0; }
        .divider::after { left: 0; }


        /* ================= الصفحة الرئيسية ================= */
        #home-page {
            display: none;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        header {
            background-color: #0056b3;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-right, .header-left {
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 8px;
        }

        .header-center h1 {
            font-size: 18px;
            font-weight: 900;
            direction: ltr;
            unicode-bidi: embed;
            text-align: center;
            color: #fff;
        }

        /* شريط البحث */
        .search-container {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #fff;
            border: 2px solid #0056b3;
            border-radius: 12px;
            padding: 6px 14px;
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.06);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            padding: 6px;
            background: transparent;
            color: #102a43;
        }

        .search-actions {
            display: flex;
            gap: 14px;
            margin-right: 8px;
            align-items: center;
        }

        .search-actions button {
            background: none;
            border: none;
            color: #0056b3;
            font-size: 20px; /* مكبرة سيكا ومظبوطة تماماً */
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-actions button:hover {
            color: #003d82;
            transform: scale(1.1);
        }

        /* قسم الماركات */
        .brands-section {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 800;
            color: #0056b3;
            margin-bottom: 12px;
            border-bottom: 2px solid #d9e2ec;
            padding-bottom: 5px;
        }

        /* شبكة مربعات ثنائية (عمدان اثنين) ومن اليسار لليمين ومتساوية الأضلاع */
        .brands-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            direction: ltr; 
        }

        .brand-card {
            background-color: #ffffff;
            border: 2px solid #ccd8e2;
            border-radius: 12px;
            aspect-ratio: 1 / 1; /* مربع متساوي الأضلاع تماماً */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 800;
            color: #0056b3;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            padding: 10px;
        }

        .brand-card:hover {
            background-color: #0056b3;
            color: #ffffff;
            border-color: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 86, 179, 0.15);
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            .brands-grid {
                gap: 10px;
            }
            .brand-card {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ================= الصفحة الأولى: تسجيل الدخول / إنشاء حساب ================= -->
    <div id="auth-page">
        <div class="container">
            <div class="logo-area">
                <h1>Electrisity &ldquo;Aswan&rdquo;</h1>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
                <button class="tab-btn" onclick="switchTab('register')">إنشاء حساب</button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <div id="login-section" class="form-section active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-phone">رقم الهاتف</label>
                        <input type="text" id="login-phone" placeholder="أدخل رقم الهاتف" required>
                    </div>

                    <div class="form-group">
                        <label for="login-pass">رمز المرور</label>
                        <input type="password" id="login-pass" placeholder="أدخل رمز المرور" required>
                    </div>

                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember" style="margin-bottom:0; display:inline;">تذكرني</label>
                    </div>

                    <button type="submit" class="btn">دخول</button>
                </form>

                <div class="divider">أو</div>
                <button type="button" class="btn guest-btn" onclick="handleGuest()">الدخول كزائر</button>
            </div>

            <!-- نموذج إنشاء حساب -->
            <div id="register-section" class="form-section">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="reg-name">الاسم</label>
                        <input type="text" id="reg-name" placeholder="الاسم الكامل" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-shop">اسم المحل</label>
                        <input type="text" id="reg-shop" placeholder="اسم المحل" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-address">عنوان المحل</label>
                        <input type="text" id="reg-address" placeholder="عنوان المحل" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-phone">رقم الهاتف</label>
                        <input type="text" id="reg-phone" placeholder="رقم الهاتف" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-pass">رمز المرور</label>
                        <input type="password" id="reg-pass" placeholder="أنشئ رمز مرور" required>
                    </div>

                    <button type="submit" class="btn">إنشاء حساب وتسجيل الدخول</button>
                </form>

                <div class="divider">أو</div>
                <button type="button" class="btn guest-btn" onclick="handleGuest()">الدخول كزائر</button>
            </div>
        </div>
    </div>


    <!-- ================= الصفحة الثانية: الرئيسية والماركات ================= -->
    <div id="home-page">
        <header>
            <div class="header-right" onclick="openMenu()" title="القائمة">
                <i class="fa-solid fa-bars fa-lg"></i>
            </div>
            <div class="header-center">
                <h1>Electrisity &ldquo;Aswan&rdquo;</h1>
            </div>
            <div class="header-left" id="user-display" onclick="goToAuth()" title="تسجيل الخروج / تبديل الحساب">
                زائر
            </div>
        </header>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="ابحث عن قطع الغيار، الماركات...">
                <div class="search-actions">
                    <button type="button" onclick="startCameraSearch()" title="بحث بالكاميرا">
                        <i class="fa-solid fa-camera"></i>
                    </button>
                    <button type="button" onclick="startVoiceSearch()" title="بحث بالصوت">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="brands-section">
            <h2 class="section-title">الماركات</h2>
            <div class="brands-grid">
                <div class="brand-card" onclick="selectBrand('Apple')">Apple</div>
                <div class="brand-card" onclick="selectBrand('Samsung')">Samsung</div>
                <div class="brand-card" onclick="selectBrand('Xiaomi')">Xiaomi</div>
                <div class="brand-card" onclick="selectBrand('Redmi')">Redmi</div>
                <div class="brand-card" onclick="selectBrand('Infinix')">Infinix</div>
                <div class="brand-card" onclick="selectBrand('Oppo')">Oppo</div>
                <div class="brand-card" onclick="selectBrand('Realme')">Realme</div>
                <div class="brand-card" onclick="selectBrand('Huawei')">Huawei</div>
                <div class="brand-card" onclick="selectBrand('Vivo')">Vivo</div>
                <div class="brand-card" onclick="selectBrand('Honor')">Honor</div>
                <div class="brand-card" onclick="selectBrand('Techno')">Techno</div>
                <div class="brand-card" onclick="selectBrand('itel')">itel</div>
                <div class="brand-card" onclick="selectBrand('Nokia')">Nokia</div>
            </div>
        </div>
    </div>


    <script>
        function switchTab(tabName) {
            const loginSection = document.getElementById('login-section');
            const registerSection = document.getElementById('register-section');
            const buttons = document.querySelectorAll('.tab-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            if (tabName === 'login') {
                loginSection.classList.add('active');
                registerSection.classList.remove('active');
                buttons[0].classList.add('active');
            } else {
                registerSection.classList.add('active');
                loginSection.classList.remove('active');
                buttons[1].classList.add('active');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value;
            showHome(phone);
        }

        function handleRegister(e) {
            e.preventDefault();
            const phone = document.getElementById('reg-phone').value;
            showHome(phone);
        }

        function handleGuest() {
            showHome('زائر');
        }

        function showHome(userIdentifier) {
            document.getElementById('auth-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
            document.getElementById('user-display').innerText = userIdentifier;
        }

        function goToAuth() {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('auth-page').style.display = 'flex';
        }

        function openMenu() {
            alert("تم فتح القائمة الجانبية");
        }

        function startCameraSearch() {
            alert("جاري فتح الكاميرا للبحث...");
        }

        function startVoiceSearch() {
            alert("جاري الاستماع للبحث الصوتي...");
        }

        function selectBrand(brandName) {
            alert("تم اختيار ماركة: " + brandName);
        }
    </script>
</body>
</html>
