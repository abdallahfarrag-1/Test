<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>هاي واي راش – Highway Rush</title>
<style>
html,body{margin:0;height:100%;background:#0c0e10;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Roboto,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
.tag{position:fixed;background:rgba(18,14,4,.6);color:#ffc83a;padding:4px 14px 6px;border-radius:4px;pointer-events:none;font-weight:800;line-height:1.1;clip-path:polygon(0 0,100% 0,100% 100%,8px 100%)}
.tag small{display:block;font-size:12px;color:#ffe29a;font-weight:600}
.tag b{font-size:28px;direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
#tScore{left:10px;top:calc(8px + env(safe-area-inset-top))}
#tSpeed{right:60px;top:calc(8px + env(safe-area-inset-top));text-align:right}
#tDist{right:60px;top:calc(72px + env(safe-area-inset-top));text-align:right}
#mult{position:fixed;left:12px;top:calc(74px + env(safe-area-inset-top));font-weight:800;color:#7dff9a;font-size:20px;opacity:0;transition:opacity .2s;pointer-events:none;text-shadow:0 1px 4px #000}
#pause,#snd{position:fixed;right:10px;width:40px;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(10,14,16,.55);color:#fff;font-size:18px}
#pause{top:calc(8px + env(safe-area-inset-top))}
#snd{top:calc(56px + env(safe-area-inset-top))}
#tilt{top:calc(104px + env(safe-area-inset-top))}
#inv{top:calc(152px + env(safe-area-inset-top));display:none}
#tilt.on,#inv.on{background:rgba(255,200,58,.55)}
#tilt,#inv{position:fixed;right:10px;width:40px;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(10,14,16,.55);color:#fff;font-size:18px}
.btn{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:18px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn.on{background:rgba(255,200,58,.5)}
#bl{left:14px}#br{left:102px}
#gas{right:14px;width:96px;height:112px;background:rgba(120,230,90,.22);border-color:rgba(140,240,100,.8);font-size:16px}
#brk{right:122px;height:90px;background:rgba(248,100,100,.2);border-color:rgba(248,113,113,.75);font-size:14px}
#toast{position:fixed;left:50%;top:26%;transform:translate(-50%,-10px);font-size:26px;font-weight:800;color:#ffd84a;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));box-sizing:border-box;z-index:5}
#over{justify-content:center;background:rgba(5,8,10,.8)}
.ttl{font-size:44px;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 3px 0 #b3141b,0 6px 18px rgba(0,0,0,.6);font-style:italic}
.ttl span{color:#ff3b3b}
.sub{font-size:13px;opacity:.85;margin-top:4px;text-shadow:0 1px 4px #000}
.panel{background:rgba(10,14,16,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;width:100%;max-width:420px;box-sizing:border-box}
#sw{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.sw{width:40px;height:40px;border-radius:8px;border:2px solid rgba(255,255,255,.35);position:relative;box-sizing:border-box}
.sw.sel{border-color:#ffd84a;box-shadow:0 0 0 2px #ffd84a}
.sw i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;background:rgba(0,0,0,.55);border-radius:6px;font-weight:700}
.go{background:linear-gradient(#b6f23a,#7ac61c);color:#16300a;border:0;border-radius:10px;padding:14px 0;font-size:22px;font-weight:900;width:100%;box-shadow:0 4px 0 #4c8610}
#money{font-size:15px;margin-bottom:8px;color:#9df07a;font-weight:700}
#over h1{margin:0 0 10px;font-size:34px;color:#ff5a4a}
#over p{margin:5px 0;font-size:17px}
#over b{color:#ffd84a;font-size:26px}
#over .go{max-width:300px;margin-top:18px}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="vig"></div>
<div class="tag" id="tScore"><small>النقاط</small><b id="score">0</b></div>
<div class="tag" id="tSpeed"><small>السرعة</small><b id="kmh">0</b> <small style="display:inline">KMH</small></div>
<div class="tag" id="tDist"><small>المسافة</small><b id="dist">0.00</b> <small style="display:inline">KM</small></div>
<div id="mult">x2 الاتجاه المعاكس</div>
<button id="pause">⏸</button><button id="snd">🔊</button><button id="tilt">📱</button><button id="inv">↔</button>
<div id="toast"></div>
<div class="btn" id="bl">◀</div><div class="btn" id="br">▶</div>
<div class="btn" id="brk">فرامل</div><div class="btn" id="gas">بنزين</div>

<div class="ov" id="menu">
  <div><div class="ttl">HIGHWAY <span>RUSH</span></div><div class="sub">هاي واي راش · يفضّل تلعب والموبايل بالعرض 📱↔️</div></div>
  <div class="panel">
    <div id="money">💲 0</div>
    <div id="sw"></div>
    <button class="go" id="go">لعب</button>
  </div>
</div>
<div class="ov hide" id="over">
  <h1>تحطمت!</h1>
  <p>النقاط: <b id="fScore">0</b></p>
  <p>أفضل نتيجة: <b id="fBest" style="font-size:20px">0</b></p>
  <p>المسافة: <span id="fDist">0</span> كم · ربحت 💲<span id="fCash">0</span></p>
  <button class="go" id="again">العب تاني</button>
  <button class="go" id="home" style="background:#374151;color:#fff;box-shadow:0 4px 0 #1f2937;margin-top:12px;font-size:17px">القائمة</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'){document.body.innerHTML='<div style="padding:40px;text-align:center;font-size:18px">تعذّر تحميل مكتبة الرسومات. تأكد من الإنترنت وحدّث الصفحة.</div>';return;}
const cv=$('c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});}
catch(e){document.body.innerHTML='<div style="padding:40px;text-align:center;font-size:18px">المتصفح لا يدعم WebGL.</div>';return;}
const mobile=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent||'');
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,mobile?2:2.5));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const FOG=0xd7e4ea;
scene.fog=new THREE.Fog(FOG,90,430);
const camera=new THREE.PerspectiveCamera(58,1,.3,900);
const maxAniso=renderer.capabilities.getMaxAnisotropy();

// ---------- sky + environment
const SUN=new THREE.Vector3(.35,.5,-.65).normalize();
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(0x2f78cf)},mid:{value:new THREE.Color(0x8fc6f0)},hor:{value:new THREE.Color(0xe6e9e2)},sunDir:{value:SUN}},
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top,mid,hor,sunDir;varying vec3 vP;void main(){float h=clamp(vP.y,0.,1.);vec3 c=mix(hor,mid,smoothstep(0.,.22,h));c=mix(c,top,smoothstep(.18,.85,h));c=mix(c,vec3(.55,.5,.36),smoothstep(0.,-.12,vP.y));float s=max(dot(normalize(vP),sunDir),0.);c+=vec3(1.,.92,.75)*(pow(s,900.)*4.+pow(s,14.)*.22);gl_FragColor=vec4(c,1.);}'});
const sky=new THREE.Mesh(new THREE.SphereGeometry(600,32,16),skyMat);sky.frustumCulled=false;scene.add(sky);
scene.add(new THREE.HemisphereLight(0xcfe6ff,0x8c7d58,.95));
const sun=new THREE.DirectionalLight(0xfff1d8,1.9);
sun.castShadow=true;
const SM=mobile?1024:2048;sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-42,right:42,top:42,bottom:-42,near:1,far:200});
sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0006;sun.shadow.normalBias=.03;
scene.add(sun);scene.add(sun.target);

// ---------- textures
function mkTex(c,rx,ry){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=maxAniso;t.encoding=THREE.sRGBEncoding;return t;}
function roadCanvas(){
  const w=512,h=1024,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const ppx=w/19,ppy=h/20;
  g.fillStyle='#3d4045';g.fillRect(0,0,w,h);
  for(let i=0;i<14000;i++){const v=45+Math.random()*50|0;g.fillStyle='rgba('+v+','+v+','+(v+4)+','+Math.random()*.55+')';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*3,1+Math.random()*3);}
  // wheel tracks (darker)
  for(const m of [-5.25,-1.75,1.75,5.25])for(const o of [-.8,.8]){
    const gr=g.createLinearGradient((9.5+m+o-.5)*ppx,0,(9.5+m+o+.5)*ppx,0);
    gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.5,'rgba(0,0,0,.22)');gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.fillRect((9.5+m+o-.5)*ppx,0,ppx,h);
  }
  // cracks
  g.strokeStyle='rgba(15,15,18,.5)';g.lineWidth=1;
  for(let i=0;i<40;i++){let x=Math.random()*w,y=Math.random()*h;g.beginPath();g.moveTo(x,y);for(let k=0;k<8;k++){x+=(Math.random()-.5)*24;y+=(Math.random()-.3)*26;g.lineTo(x,y);}g.stroke();}
  // oil stains
  for(let i=0;i<10;i++){const x=Math.random()*w,y=Math.random()*h,r=10+Math.random()*30;const gr=g.createRadialGradient(x,y,1,x,y,r);gr.addColorStop(0,'rgba(10,10,12,.35)');gr.addColorStop(1,'rgba(10,10,12,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
  // dirt shoulders
  g.fillStyle='#b3a176';g.fillRect(0,0,(9.5-7.2)*ppx,h);g.fillRect((9.5+7.2)*ppx,0,w,h);
  for(let i=0;i<3000;i++){g.fillStyle='rgba(120,100,60,'+Math.random()*.4+')';g.fillRect(Math.random()*(2.3*ppx),Math.random()*h,2,2);g.fillRect((9.5+7.2)*ppx+Math.random()*(2.3*ppx),Math.random()*h,2,2);}
  // edge lines
  g.fillStyle='#e9e9e4';
  g.fillRect((9.5-6.85)*ppx,0,.22*ppx,h);g.fillRect((9.5+6.63)*ppx,0,.22*ppx,h);
  // double yellow
  g.fillStyle='#e8b923';g.fillRect((9.5-.22)*ppx,0,.12*ppx,h);g.fillRect((9.5+.1)*ppx,0,.12*ppx,h);
  // dashes
  g.fillStyle='#ecece6';
  for(const m of [-3.5,3.5])for(const y0 of [0,10])g.fillRect((9.5+m-.1)*ppx,y0*ppy,.2*ppx,3*ppy);
  // wear on lines
  for(let i=0;i<1500;i++){g.fillStyle='rgba(61,64,69,'+Math.random()*.6+')';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*3);}
  return c;
}
function grassCanvas(){
  const w=512,c=document.createElement('canvas');c.width=c.height=w;const g=c.getContext('2d');
  g.fillStyle='#6e8d3c';g.fillRect(0,0,w,w);
  for(let i=0;i<60;i++){const x=Math.random()*w,y=Math.random()*w,r=30+Math.random()*80;const gr=g.createRadialGradient(x,y,1,x,y,r);const dry=Math.random()<.5;gr.addColorStop(0,dry?'rgba(176,160,88,.55)':'rgba(70,120,50,.5)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
  for(let i=0;i<14000;i++){const l=Math.random();g.strokeStyle='rgba('+(70+l*80|0)+','+(110+l*70|0)+','+(40+l*30|0)+',.55)';g.lineWidth=1;const x=Math.random()*w,y=Math.random()*w;g.beginPath();g.moveTo(x,y);g.lineTo(x+(Math.random()-.5)*4,y-3-Math.random()*5);g.stroke();}
  return c;
}
const roadTex=mkTex(roadCanvas(),1,13);
const grassTex=mkTex(grassCanvas(),15,15);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({map:grassTex,roughness:1,metalness:0,envMapIntensity:.3}));
grass.rotation.x=-Math.PI/2;grass.receiveShadow=true;scene.add(grass);
const road=new THREE.Mesh(new THREE.PlaneGeometry(19,260),new THREE.MeshStandardMaterial({map:roadTex,roughness:.88,metalness:0,envMapIntensity:.35,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));
road.rotation.x=-Math.PI/2;road.position.y=.02;road.receiveShadow=true;scene.add(road);

// ---------- helpers
function merge(list){
  const pos=[],nor=[],uv=[],idx=[];let off=0;
  for(const g of list){
    const p=g.attributes.position.array,n=g.attributes.normal.array,u=g.attributes.uv.array;
    for(let i=0;i<p.length;i++){pos.push(p[i]);nor.push(n[i]);}
    for(let i=0;i<u.length;i++)uv.push(u[i]);
    if(g.index){const ia=g.index.array;for(let i=0;i<ia.length;i++)idx.push(ia[i]+off);}
    else for(let i=0;i<p.length/3;i++)idx.push(i+off);
    off+=p.length/3;
  }
  const m=new THREE.BufferGeometry();
  m.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  m.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  m.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  m.setIndex(idx);return m;
}
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---------- roadside: palms, bushes, rocks, mountains, guardrail
const palmTrunkGeo=(()=>{
  const cu=new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,0),new THREE.Vector3(.35,2.5,0),new THREE.Vector3(.25,5,0),new THREE.Vector3(-.1,7,0)]);
  return new THREE.TubeGeometry(cu,10,.2,7,false);
})();
const palmFrondGeo=(()=>{
  const list=[];
  for(let k=0;k<11;k++){
    const g=new THREE.PlaneGeometry(3.6,.95,8,1);g.translate(1.8,0,0);g.rotateX(-Math.PI/2);
    const p=g.attributes.position;
    for(let i=0;i<p.count;i++){const x=p.getX(i);p.setY(i,p.getY(i)-.085*x*x+.4*Math.sin(p.getZ(i)*3)*.05);p.setZ(i,p.getZ(i)*(1-x/5));}
    g.computeVertexNormals();
    g.rotateZ(rnd(-.15,.1));g.rotateY(k/11*Math.PI*2+rnd(-.2,.2));g.translate(-.1,7,0);
    list.push(g);
  }
  return merge(list);
})();
const trunkMat=new THREE.MeshStandardMaterial({color:0x6b4a2c,roughness:.95});
const frondMat=new THREE.MeshStandardMaterial({color:0x3f8a2c,roughness:.75,side:THREE.DoubleSide,envMapIntensity:.6});
function makePalm(){
  const g=new THREE.Group();
  const t=new THREE.Mesh(palmTrunkGeo,trunkMat),f=new THREE.Mesh(palmFrondGeo,frondMat);
  t.castShadow=f.castShadow=true;g.add(t,f);return g;
}
const rockGeos=[0,1,2].map(()=>{
  const g=new THREE.IcosahedronGeometry(1,1),p=g.attributes.position;
  for(let i=0;i<p.count;i++){const k=1+rnd(-.25,.25);p.setXYZ(i,p.getX(i)*k*1.2,p.getY(i)*k*.8,p.getZ(i)*k);}
  g.computeVertexNormals();return g;
});
const rockMat=new THREE.MeshStandardMaterial({color:0x8d877a,roughness:.95,flatShading:true});
const bushGeo=new THREE.IcosahedronGeometry(1,1);
const bushMat=new THREE.MeshStandardMaterial({color:0x4d7f2e,roughness:.9,flatShading:true});
const decor=[];
function addDecor(kind,n,spacing){
  for(let i=0;i<n;i++){
    let g;
    if(kind==='palm')g=makePalm();
    else if(kind==='rock'){g=new THREE.Mesh(rockGeos[i%3],rockMat);g.castShadow=true;}
    else{g=new THREE.Mesh(bushGeo,bushMat);g.castShadow=true;}
    g.receiveShadow=true;scene.add(g);
    decor.push({g,kind,s:i*spacing+rnd(0,spacing),x:0,spacing,n});
  }
}
addDecor('palm',26,16);addDecor('bush',16,26);addDecor('rock',12,36);
function placeDecor(d,first){
  const side=Math.random()<.5?-1:1;
  d.x=side*(d.kind==='palm'?rnd(10.5,34):rnd(9.8,40));
  const sc=d.kind==='palm'?rnd(.8,1.35):d.kind==='rock'?rnd(.6,2.1):rnd(.8,1.8);
  d.g.scale.setScalar(sc);d.g.rotation.y=Math.random()*6.28;
  if(d.kind==='palm')d.g.rotation.z=side*-.05*Math.random();
  d.g.position.set(d.x,d.kind==='palm'?0:.3*sc,-d.s);
}
decor.forEach(d=>placeDecor(d,true));
const mountMat=new THREE.MeshStandardMaterial({color:0xa5977a,roughness:1,flatShading:true});
const mounts=[];
for(let i=0;i<12;i++){
  const h=rnd(40,95),m=new THREE.Mesh(new THREE.ConeGeometry(rnd(55,95),h,6),mountMat);
  m.userData={s:i*140,x:(i%2?1:-1)*rnd(200,320),h};
  m.position.set(m.userData.x,h/2-4,-m.userData.s);scene.add(m);mounts.push(m);
}
const railMat=new THREE.MeshStandardMaterial({color:0xb8bec4,roughness:.35,metalness:.5});
const postMat=new THREE.MeshStandardMaterial({color:0x6a7077,roughness:.6,metalness:.6});
const rails=[];
for(const sx of[-1,1]){
  const r1=new THREE.Mesh(new THREE.BoxGeometry(.07,.3,380),railMat);r1.position.set(sx*8.15,.68,0);r1.castShadow=true;
  const r2=new THREE.Mesh(new THREE.BoxGeometry(.05,.06,380),railMat);r2.position.set(sx*8.14,.9,0);
  scene.add(r1,r2);rails.push(r1,r2);
}
const POSTS=100;
const posts=new THREE.InstancedMesh(new THREE.BoxGeometry(.12,.95,.12),postMat,POSTS*2);
posts.castShadow=true;scene.add(posts);posts.frustumCulled=false;
let postBase=null;const dm=new THREE.Object3D();
function updPosts(s){
  const b=Math.floor(s/4)-12;if(b===postBase)return;postBase=b;
  for(let i=0;i<POSTS;i++)for(let k=0;k<2;k++){
    dm.position.set(k?8.3:-8.3,.47,-(b+i)*4);dm.updateMatrix();posts.setMatrixAt(i*2+k,dm.matrix);
  }
  posts.instanceMatrix.needsUpdate=true;
}

// ---------- cars
const glassMat=new THREE.MeshStandardMaterial({color:0x0f151b,roughness:.1,metalness:.35});
const tireMat=new THREE.MeshStandardMaterial({color:0x0d0d0f,roughness:.9});
const rimMat=new THREE.MeshStandardMaterial({color:0xcfd4db,roughness:.3,metalness:.6});
const blackMat=new THREE.MeshStandardMaterial({color:0x141517,roughness:.55,metalness:.3});
const headMat=new THREE.MeshStandardMaterial({color:0xfffbe8,emissive:0xfff0b0,emissiveIntensity:1.6,roughness:.2});
const tailMat=new THREE.MeshStandardMaterial({color:0x9c1010,emissive:0xff1c1c,emissiveIntensity:.9,roughness:.3});
function paintMat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.35,metalness:.3});}
function taper(w,h,d,sx,sz,dz){const g=new THREE.BoxGeometry(w,h,d),p=g.attributes.position;for(let i=0;i<p.count;i++)if(p.getY(i)>0){p.setX(i,p.getX(i)*sx);p.setZ(i,p.getZ(i)*sz+dz);}g.computeVertexNormals();return g;}
function bx(w,h,d,mat,x,y,z,par){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);par.add(m);return m;}
function tp(g,mat,x,y,z,par){const m=new THREE.Mesh(g,mat);m.position.set(x,y,z);par.add(m);return m;}
function wheel(r,w,x,y,z,par,wheels){
  const g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.CylinderGeometry(r,r,w,22),tireMat);t.rotation.z=Math.PI/2;
  const rm=new THREE.Mesh(new THREE.CylinderGeometry(r*.64,r*.64,w+.02,18),rimMat);rm.rotation.z=Math.PI/2;
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(r*.2,r*.2,w+.05,8),blackMat);hub.rotation.z=Math.PI/2;
  g.add(t,rm,hub);g.position.set(x,y,z);par.add(g);wheels.push(g);return g;
}
function lights(par,W,zf,zr,y,hw){
  bx(.32,.16,.06,headMat,-W*.32,y,zf,par);bx(.32,.16,.06,headMat,W*.32,y,zf,par);
  bx(.36,.18,.06,tailMat,-W*.34,y+.04,zr,par);bx(.36,.18,.06,tailMat,W*.34,y+.04,zr,par);
}
// front = -z
function buildCar(type,color){
  const g=new THREE.Group(),wheels=[],paint=paintMat(color);let L,W,
  fn={
    sedan(){L=4.5;W=1.82;
      bx(1.8,.58,4.5,paint,0,.62,0,g);
      tp(taper(1.78,.1,2.2,.97,.9,0),paint,0,.95,-1.2,g);
      tp(taper(1.62,.62,2.35,.84,.68,0),glassMat,0,1.28,.25,g);
      tp(taper(1.4,.05,1.5,.86,.7,0),paint,0,1.6,.28,g);
      bx(1.84,.3,.14,blackMat,0,.42,-2.28,g);bx(1.84,.3,.14,blackMat,0,.42,2.28,g);
      bx(1.0,.18,.05,blackMat,0,.68,-2.27,g);
      bx(.14,.1,.22,paint,-.95,1.05,-.5,g);bx(.14,.1,.22,paint,.95,1.05,-.5,g);
      lights(g,W,-2.26,2.26,.72);
      for(const sx of[-1,1])for(const z of[-1.45,1.45])wheel(.34,.24,sx*.9,.34,z,g,wheels);
    },
    pickup(){L=5.3;W=2.0;
      bx(2,.7,5.3,paint,0,.72,0,g);
      tp(taper(1.9,.78,2.0,.88,.74,0),glassMat,0,1.5,-.6,g);
      tp(taper(1.65,.05,1.5,.9,.7,0),paint,0,1.9,-.6,g);
      bx(1.8,.08,2.3,blackMat,0,1.0,1.55,g);
      bx(.1,.42,2.3,paint,-.95,1.2,1.55,g);bx(.1,.42,2.3,paint,.95,1.2,1.55,g);
      bx(1.9,.46,.1,paint,0,1.2,.45,g);bx(1.9,.42,.1,paint,0,1.18,2.68,g);
      bx(2.02,.3,.16,blackMat,0,.5,-2.68,g);bx(2.02,.28,.16,blackMat,0,.48,2.72,g);
      bx(1.1,.22,.05,blackMat,0,.8,-2.66,g);
      lights(g,W,-2.66,2.7,.85);
      for(const sx of[-1,1])for(const z of[-1.7,1.7])wheel(.4,.26,sx*1,.4,z,g,wheels);
    },
    van(){L=5.2;W=2.0;
      bx(2,1.2,5.2,paint,0,.95,0,g);
      tp(taper(1.96,1.0,5.0,.97,.9,-.08),paint,0,1.55,0,g);
      tp(taper(1.9,.5,1.5,.9,.7,-1.6),glassMat,0,1.7,-1.5,g);
      bx(2.04,.3,.15,blackMat,0,.5,-2.62,g);bx(2.04,.3,.15,blackMat,0,.5,2.62,g);
      lights(g,W,-2.6,2.6,.8);
      for(const sx of[-1,1])for(const z of[-1.6,1.6])wheel(.38,.24,sx*.95,.38,z,g,wheels);
    },
    truck(){L=11;W=2.5;
      bx(2.4,1.4,2.3,paint,0,1.1,-4.3,g);
      tp(taper(2.3,1.0,2.2,.92,.8,0),glassMat,0,2.3,-4.35,g);
      bx(2.5,2.9,7.6,paint,0,2.35,1.3,g);
      for(let i=0;i<8;i++){bx(2.56,2.8,.06,blackMat,0,2.35,-2.2+i*.95,g);}
      bx(2.46,.4,.2,blackMat,0,.55,-5.5,g);
      bx(2.4,.3,10.5,blackMat,0,.7,.2,g);
      lights(g,W,-5.45,5.1,.9);
      for(const sx of[-1,1])for(const z of[-4.4,1.8,3.2,4.6])wheel(.5,.3,sx*1.12,.5,z,g,wheels);
    }
  };
  fn[type]();
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  return{g,wheels,paint,L,W,type};
}
const CARCOLS=[0xe5e7eb,0xdc2626,0x2563eb,0xfacc15,0x7c3aed,0xf97316,0x64748b,0x0d9488,0x1f2937,0x9ca3af,0xb91c1c];
const TRUCKCOLS=[0xd9d9dc,0xd29a52,0x6a98c0,0xb85a3a];
const pool=[];
for(const [t,n] of [['sedan',7],['pickup',4],['van',4],['truck',3]])for(let i=0;i<n;i++){
  const c=buildCar(t,CARCOLS[i%CARCOLS.length]);c.g.visible=false;scene.add(c.g);
  Object.assign(c,{use:false,s:0,x:0,vs:0,prev:null,brake:false});pool.push(c);
}

// ---------- player + garage
const COLORS=[{c:0xf59e0b,p:0},{c:0x3b82f6,p:0},{c:0xef4444,p:0},{c:0x22c55e,p:400},{c:0xa855f7,p:600},{c:0x111827,p:800},{c:0xe5e7eb,p:1000}];
let wallet=0,unlocked=[0,1,2],selColor=0,best=0;
try{wallet=+localStorage.getItem('hr_w')||0;best=+localStorage.getItem('hr_b')||0;const u=JSON.parse(localStorage.getItem('hr_u')||'null');if(u)unlocked=u;selColor=+localStorage.getItem('hr_c')||0;}catch(_){}
function save(){try{localStorage.setItem('hr_w',wallet);localStorage.setItem('hr_b',best);localStorage.setItem('hr_u',JSON.stringify(unlocked));localStorage.setItem('hr_c',selColor);}catch(_){}}
const player=buildCar('pickup',COLORS[selColor].c);scene.add(player.g);
function drawSw(){
  const box=$('sw');box.innerHTML='';
  COLORS.forEach((o,i)=>{
    const d=document.createElement('div');d.className='sw'+(i===selColor?' sel':'');
    d.style.background='#'+o.c.toString(16).padStart(6,'0');
    if(!unlocked.includes(i)){const l=document.createElement('i');l.textContent='🔒'+o.p;d.appendChild(l);}
    d.addEventListener('click',()=>{
      if(!unlocked.includes(i)){
        if(wallet>=o.p){wallet-=o.p;unlocked.push(i);}
        else{toast('محتاج 💲'+(o.p-wallet)+' كمان');return;}
      }
      selColor=i;player.paint.color.set(o.c);save();drawSw();$('money').textContent='💲 '+wallet;
    });
    box.appendChild(d);
  });
  $('money').textContent='💲 '+wallet;
}
drawSw();player.paint.color.set(COLORS[selColor].c);

// ---------- game state
const P={s:0,x:1.75,v:0,steer:0,spin:0,dir:1};
let state='menu',paused=false,score=0,dist=0,time=0,camBlend=0,crashT=0,shake=0,menuAng=0;
const keys={},touch={};
const LANES_R=[1.75,5.25],LANES_L=[-1.75,-5.25];

function clearTraffic(){for(const c of pool){c.use=false;c.g.visible=false;}}
function spawn(){
  let act=0;for(const c of pool)if(c.use)act++;
  if(act>=15)return;
  const onc=Math.random()<.45;
  const x=(onc?LANES_L:LANES_R)[Math.random()<.5?0:1];
  const s=P.s+(onc?330:270)+Math.random()*170;
  for(const c of pool)if(c.use&&Math.abs(c.x-x)<1&&Math.abs(c.s-s)<45)return;
  const r=Math.random(),t=r<.13?'truck':r<.28?'van':r<.48?'pickup':'sedan';
  const free=pool.filter(c=>!c.use&&c.type===t);if(!free.length)return;
  const c=free[Math.floor(Math.random()*free.length)];
  c.use=true;c.g.visible=true;c.s=s;c.x=x;c.prev=null;
  const sp=t==='truck'?rnd(12,20):rnd(15,32);
  c.vs=onc?-(sp+rnd(0,6)):sp;
  c.g.rotation.y=onc?Math.PI:0;
  c.paint.color.set(t==='truck'?TRUCKCOLS[Math.floor(Math.random()*TRUCKCOLS.length)]:CARCOLS[Math.floor(Math.random()*CARCOLS.length)]);
}
function populate(){clearTraffic();for(let i=0;i<9;i++){spawn();}for(const c of pool)if(c.use)c.s=P.s+60+Math.random()*340;}

// audio
let ac=null,osc=null,osc2=null,og=null,muted=false;
function ensureAudio(){
  if(ac||muted)return;
  try{ac=new(window.AudioContext||window.webkitAudioContext)();
    osc=ac.createOscillator();osc.type='sawtooth';osc2=ac.createOscillator();osc2.type='square';
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=500;og=ac.createGain();og.gain.value=0;
    osc.connect(f);osc2.connect(f);f.connect(og);og.connect(ac.destination);osc.start();osc2.start();}catch(e){ac=null}
}
function beep(a,b,d,type,v){if(!ac||muted)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(a,ac.currentTime);o.frequency.linearRampToValueAtTime(b,ac.currentTime+d);g.gain.setValueAtTime(v||.1,ac.currentTime);g.gain.linearRampToValueAtTime(0,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function crashSound(){
  if(!ac||muted)return;
  try{const n=ac.sampleRate*.5|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const s=ac.createBufferSource();s.buffer=b;const g=ac.createGain();g.gain.value=.5;s.connect(g);g.connect(ac.destination);s.start();}catch(e){}
}
let toastT=0;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1100);}

// input
const kmap={ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',Space:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{const k=kmap[e.code];if(k){keys[k]=true;e.preventDefault();}});
addEventListener('keyup',e=>{const k=kmap[e.code];if(k)keys[k]=false;});
function bind(id,key){
  const el=$(id);
  const on=e=>{e.preventDefault();touch[key]=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}ensureAudio();};
  const off=()=>{touch[key]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bind('bl','left');bind('br','right');bind('gas','gas');bind('brk','brake');


// ---------- tilt steering
let tiltOn=false,gotMotion=false,tiltVal=0,theta=0,neutral=0,invert=false,tiltListening=false;
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent||'');
function onMotion(e){
  const a=e.accelerationIncludingGravity;if(!a||a.x==null||a.y==null)return;
  gotMotion=true;
  let ax=a.x,ay=a.y;if(isIOS){ax=-ax;ay=-ay;}
  const ang=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*Math.PI/180;
  const sx=ax*Math.cos(ang)+ay*Math.sin(ang),sy=-ax*Math.sin(ang)+ay*Math.cos(ang);
  theta=Math.atan2(sx,sy)*57.2958;
  let rel=-(theta-neutral);
  if(rel>180)rel-=360;if(rel<-180)rel+=360;
  if(invert)rel=-rel;
  const dz=3;rel=Math.abs(rel)<dz?0:rel-Math.sign(rel)*dz;
  const tv=Math.max(-1,Math.min(1,rel/22));
  tiltVal+=(tv-tiltVal)*.35;
}
function calibrate(){neutral=theta;tiltVal=0;}
function setTilt(on){
  tiltOn=on;$('tilt').classList.toggle('on',on);$('inv').style.display=on?'block':'none';
  $('bl').style.display=$('br').style.display=on?'none':'flex';
  if(on){
    if(!tiltListening){addEventListener('devicemotion',onMotion);tiltListening=true;}
    setTimeout(()=>{
      if(!gotMotion){toast('الميل غير متاح هنا، استخدم الأزرار');setTilt(false);}
      else{calibrate();toast('ثبّت الموبايل زي ما بتحب ومِيل يمين/شمال');}
    },1500);
  }
}
$('tilt').addEventListener('click',async()=>{
  if(tiltOn){setTilt(false);return;}
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      const r=await DeviceMotionEvent.requestPermission();
      if(r!=='granted'){toast('تم رفض إذن الحساسات');return;}
    }
  }catch(e){toast('الميل غير متاح هنا، استخدم الأزرار');return;}
  setTilt(true);
});
$('inv').addEventListener('click',()=>{invert=!invert;$('inv').classList.toggle('on',invert);toast(invert?'الاتجاه معكوس':'الاتجاه عادي');});

function startGame(){
  $('menu').classList.add('hide');$('over').classList.add('hide');
  if(tiltOn)calibrate();state='play';P.s=0;P.x=1.75;P.v=22;P.steer=0;P.spin=0;score=0;dist=0;crashT=0;
  player.g.rotation.set(0,0,0);populate();ensureAudio();
}
$('go').addEventListener('click',()=>{startGame();camBlend=0;});
$('again').addEventListener('click',()=>{camBlend=1;startGame();});
$('home').addEventListener('click',()=>{$('over').classList.add('hide');$('menu').classList.remove('hide');state='menu';camBlend=0;clearTraffic();P.s=0;P.x=1.75;P.v=0;player.g.rotation.set(0,0,0);drawSw();});
$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'▶':'⏸';});
$('snd').addEventListener('click',()=>{muted=!muted;$('snd').textContent=muted?'🔇':'🔊';if(muted&&og)og.gain.value=0;else ensureAudio();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){paused=true;$('pause').textContent='▶';}});

function doCrash(c){
  state='crash';crashT=0;shake=1;
  P.dir=(P.x>=c.x)?1:-1;
  crashSound();try{navigator.vibrate&&navigator.vibrate([80,40,120])}catch(_){}
  toast('');$('mult').style.opacity=0;
}
function showOver(){
  state='over';
  const sc=Math.floor(score);if(sc>best)best=sc;
  const cash=Math.floor(sc/15);wallet+=cash;save();
  $('fScore').textContent=sc;$('fBest').textContent=best;$('fDist').textContent=(dist/1000).toFixed(2);$('fCash').textContent=cash;
  $('over').classList.remove('hide');
}
let lastH='';
function hud(){
  const k=Math.round(P.v*3.6),sc=Math.floor(score),d=(dist/1000).toFixed(2),s=k+'|'+sc+'|'+d;
  if(s===lastH)return;lastH=s;
  $('kmh').textContent=k;$('score').textContent=sc;$('dist').textContent=d;
}

function update(dt){
  time+=dt;
  const play=state==='play';
  const gas=play&&(keys.gas||touch.gas),brk=play&&(keys.brake||touch.brake);
  const L=play&&(keys.left||touch.left),R=play&&(keys.right||touch.right);
  if(play){
    if(gas)P.v+=Math.max(4,22*(1-P.v/78))*dt;
    if(brk)P.v-=38*dt;
    if(!gas&&!brk)P.v-=(2.2+P.v*.02)*dt;
    P.v=Math.max(10,Math.min(75,P.v));
    let tgt=(R?1:0)-(L?1:0);if(tiltOn&&gotMotion)tgt=tiltVal;
    P.steer+=(tgt-P.steer)*Math.min(1,dt*9);
    P.x+=P.steer*(7+P.v*.1)*dt;
    P.x=Math.max(-6.4,Math.min(6.4,P.x));
    P.s+=P.v*dt;dist+=P.v*dt;
    const mult=P.x<0?2:1;
    score+=P.v*dt*.12*mult;
    $('mult').style.opacity=(P.x<0&&P.v>20)?1:0;
  }else if(state==='crash'){
    crashT+=dt;P.v*=Math.exp(-dt*1.6);P.s+=P.v*dt;dist+=P.v*dt;
    P.spin+=P.dir*dt*5*Math.min(1,P.v/12+.2);
    P.x=Math.max(-6.6,Math.min(6.6,P.x+P.dir*dt*2.5*Math.min(1,P.v/15)));
    if(crashT>1.5)showOver();
  }
  shake=Math.max(0,shake-dt*2.2);
  // traffic
  if(play||state==='crash'){
    if(play&&Math.random()<dt*3)spawn();
    for(const c of pool){
      if(!c.use)continue;
      c.brake=false;
      if(c.vs>0)for(const o of pool){
        if(o===c||!o.use||o.vs<=0||Math.abs(o.x-c.x)>1)continue;
        const gap=o.s-c.s-(o.L+c.L)/2;
        if(gap>0&&gap<22&&o.vs<c.vs){c.vs+=(o.vs-c.vs)*Math.min(1,dt*3);c.brake=true;}
      }
      c.s+=c.vs*dt;
      c.g.position.set(c.x,0,-c.s);
      const sp=Math.abs(c.vs)*dt;
      for(const w of c.wheels)w.rotation.x-=sp/.4;
      if(c.s<P.s-70||c.s>P.s+560){c.use=false;c.g.visible=false;continue;}
      if(play){
        const ds=c.s-P.s,dx=c.x-P.x;
        const hitX=Math.abs(dx)<(c.W+player.W)/2-.08;
        const overlap=Math.abs(ds)<(c.L+player.L)/2-.1&&hitX;
        const crossed=c.prev!==null&&c.prev*ds<0;
        if(overlap||(crossed&&hitX)){doCrash(c);break;}
        if(crossed&&Math.abs(dx)<(c.W+player.W)/2+1.15){
          const b=Math.round(20+P.v*.6)*(c.vs<0?2:1);
          score+=b;toast('قريبة! +'+b);beep(900,1500,.12,'triangle',.08);
        }
        c.prev=ds;
      }
    }
  }
  // decor recycle
  for(const d of decor){
    if(d.s<P.s-40){d.s+=d.spacing*d.n*(.95+Math.random()*.1);placeDecor(d);}
    d.g.position.z=-d.s;
  }
  for(const m of mounts){if(m.userData.s<P.s-300){m.userData.s+=140*12;m.userData.x=(Math.random()<.5?-1:1)*rnd(200,320);}m.position.set(m.userData.x,m.userData.h/2-4,-m.userData.s);}
  updPosts(P.s);
  for(const r of rails)r.position.z=-(P.s+120);
  // ground follow + texture sync
  const zc=P.s+100;
  road.position.z=-zc;roadTex.offset.y=(zc/20)%1;
  grass.position.z=-(P.s+150);grassTex.offset.y=((P.s+150)/40)%1;
  // player visual
  const pg=player.g;
  pg.position.set(P.x,0,-P.s);
  if(state==='play'||state==='menu'){
    pg.rotation.y=-P.steer*.16;pg.rotation.z=-P.steer*.03;
    pg.rotation.x=(play&&(keys.brake||touch.brake))?.025:0;
  }else if(state==='crash'||state==='over'){
    pg.rotation.y=-P.spin;pg.rotation.z=Math.sin(crashT*8)*.08*Math.max(0,1-crashT/1.2);
  }
  for(const w of player.wheels)w.rotation.x-=P.v*dt/.4;
  // lights / sun / sky
  sun.position.set(P.x+SUN.x*70,SUN.y*70,-P.s+SUN.z*70);
  sun.target.position.set(P.x,0,-P.s-8);sun.target.updateMatrixWorld();
  // camera
  const asp=W_/H_;
  const port=asp<1;
  const chaseH=port?8.2:5.4,chaseD=port?14:10.4,fovBase=port?70:56;
  camera.fov=fovBase+P.v*.1;camera.aspect=asp;camera.updateProjectionMatrix();
  const sh=shake*.35;
  const chasePos=new THREE.Vector3(P.x*.62+(Math.random()-.5)*sh,chaseH+(Math.random()-.5)*sh,-P.s+chaseD+P.v*.04);
  const chaseLook=new THREE.Vector3(P.x*.75,.9,-P.s-17);
  if(state==='menu'){
    menuAng+=dt*.45;
    const mp=new THREE.Vector3(P.x+Math.sin(menuAng)*7.5,2.6,-P.s+Math.cos(menuAng)*7.5);
    camera.position.copy(mp);camera.lookAt(P.x,1,-P.s);
    camBlend=0;
  }else{
    camBlend=Math.min(1,camBlend+dt*.9);
    const e=camBlend*camBlend*(3-2*camBlend);
    const mp=new THREE.Vector3(P.x+Math.sin(menuAng)*7.5,2.6,-P.s+Math.cos(menuAng)*7.5);
    camera.position.lerpVectors(mp,chasePos,e);
    const ml=new THREE.Vector3(P.x,1,-P.s);
    const look=new THREE.Vector3().lerpVectors(ml,chaseLook,e);
    camera.lookAt(look);
  }
  sky.position.copy(camera.position);
  if(og&&ac&&!muted)try{osc.frequency.value=40+P.v*2.8;osc2.frequency.value=20+P.v*1.4;og.gain.value=(state==='play'&&!paused)?.025+(gas?.02:0):0;}catch(_){}
  hud();
}

let W_=1,H_=1;
function resize(){W_=innerWidth;H_=innerHeight;renderer.setSize(W_,H_,false);cv.style.width=W_+'px';cv.style.height=H_+'px';}
addEventListener('resize',resize);resize();

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{if(!paused)update(dt);renderer.render(scene,camera);}catch(e){console.error(e);}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
