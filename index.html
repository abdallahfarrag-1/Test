                    border: "border-amber-200",
                    text: "text-amber-800",

        // قائمة الماركات المطلوبة تماماً (من قاعدة البيانات أو الثابتة)

        // ================= 1. واجهة تسجيل الدخول (الصفحة الأولى) =================

                                </div>

                                    <input type="text" id="regOwnerName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">

                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">اسم المحل</label>
                                    <input type="text" id="regShopName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">

                                <div>

                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رقم الهاتف</label>

                        <!-- زر الدخول كزائر -->

        }

        function switchTab(tab) {
            const loginForm = document.getElementById('loginFormContainer');
            const registerForm = document.getElementById('registerFormContainer');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-blue-600 shadow-sm";
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-600 shadow-sm";
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('phone_number', phone)
                .eq('password', password)
                .single();

            if (error || !data) {
                alert('خطأ في رقم الهاتف أو رمز المرور!');
                return;
            }

            currentUserRole = data.phone_number;
            renderMainDashboard();
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const owner_name = document.getElementById('regOwnerName').value.trim();
            const shop_name = document.getElementById('regShopName').value.trim();
            const shop_address = document.getElementById('regShopAddress').value.trim();
            const phone_number = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            const { data, error } = await supabaseClient
                .from('users')
                .insert([{ owner_name, shop_name, shop_address, phone_number, password }])
                .select();

            if (error) {
                alert('حدث خطأ أثناء إنشاء الحساب أو الرقم مسجل مسبقاً: ' + error.message);
                return;
            }

            alert('تم إنشاء الحساب بنجاح!');
            currentUserRole = phone_number;
            renderMainDashboard();
        }

        function loginAsVisitor() {
            currentUserRole = "زائر";
            renderMainDashboard();
        }

        // ================= قالب الجزء الثابت المتكرر في أعلى كل الصفحات الداخلية =================
        function getHeaderTemplate() {
            return `
                <div class="border-b border-gray-100 pb-4 mb-4 flex-shrink-0">
                    <div class="text-center mb-3">
                        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wide">Electricity Aswan</h1>
                    </div>

                    <div class="flex items-center justify-between mb-4">
                        <div class="relative">
                            <select onchange="handleMenuChange(this)" class="bg-gray-50 border border-gray-200 text-gray-700 text-xs sm:text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-sm">
                                <option value="" disabled selected>القائمة</option>
                                <option value="home">الرئيسية</option>

                        <div class="bg-blue-50/60 border border-blue-100 px-3.5 py-2 rounded-xl text-blue-700 text-xs sm:text-sm font-semibold shadow-sm">

                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        </button>
                        <button onclick="alert('جارِ فتح الكاميرا للمسح الضوئي...')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-3 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث بالكاميرا">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function handleMenuChange(select) {
            if (select.value === 'logout') {
                renderLoginScreen();
            } else if (select.value === 'home') {
                renderMainDashboard();
            }
            select.value = "";
        }

        // ================= 2. الصفحة الرئيسية =================
        function renderMainDashboard(push = true) {
            if (push) {
                history.pushState({ screen: 'main' }, "", "");
            }
            const html = `
                ${getHeaderTemplate()}

                <div class="flex-1 overflow-y-auto space-y-4 px-1">
                    <div class="mb-4">
                        <img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=800&q=80"

                    </div>

                    <div class="space-y-3.5 pb-4">
                        <div onclick="renderBrandsScreen()" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white p-5 sm:p-6 rounded-2xl shadow-md cursor-pointer transition-all flex items-center justify-between">

                            <span class="font-bold text-lg sm:text-xl">التوافقات</span>

                        </div>

                        <div onclick="alert('تنبيهات بعد التركيب')" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white p-5 sm:p-6 rounded-2xl shadow-md cursor-pointer transition-all flex items-center justify-between">
                            <span class="font-bold text-lg sm:text-xl">تنبيهات بعد التركيب</span>

                            <span class="font-bold text-lg sm:text-xl">التواصل مع الشركة</span>
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>

        // ================= 3. شاشة الماركات (مع الألوان الدورية) =================
        function renderBrandsScreen(push = true) {
            if (push) {
                history.pushState({ screen: 'brands' }, "", "");
            }
            let brandsHtml = brandsData.map((brand, index) => {
                const style = getRotatingCardStyle(index);
                return `
                    <div onclick="renderModelsScreen('${brand}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                        <span class="font-bold text-gray-800">${brand}</span>
                        <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                `;
            }).join('');

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all">
                        رجوع ←
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">اختر الماركة</h2>

        // ================= 4. شاشة الموديلات (مع الألوان الدورية) =================
        async function renderModelsScreen(brand, push = true) {
            selectedBrand = brand;
            if (push) {
                history.pushState({ screen: 'models', brand: brand }, "", "");
            }
            
            let tableName = "";
            let nameColumn = "device_name";
            let codeColumn = "model_code";
            let compatColumn = "screen_compatibility";
            
            const b = brand.toLowerCase();
            if (b.includes('samsung')) {
                tableName = 'samsung_models';
                nameColumn = 'samsung_phone_name';
                codeColumn = 'samsung_phone_code';
                compatColumn = 'samsung_screen_compatibility';
            }
            else if (b.includes('iphone') || b.includes('apple')) {
                tableName = 'apple_models';
                nameColumn = 'apple_phone_name';
                codeColumn = 'apple_phone_code';
                compatColumn = 'apple_screen_compatibility';
            }
            else if (b.includes('xiaomi') || b.includes('poco')) {
                tableName = 'xiaomi_models';
                nameColumn = 'xiaomi_phone_name';
                codeColumn = 'xiaomi_phone_code';
                compatColumn = 'xiaomi_screen_compatibility';
            }
            else if (b.includes('redmi')) {
                tableName = 'redmi_models';
                nameColumn = 'redmi_phone_name';
                codeColumn = 'redmi_phone_code';
                compatColumn = 'redmi_screen_compatibility';
            }
            else if (b.includes('huawei')) {
                tableName = 'huawei_models';
                nameColumn = 'huawei_phone_name';
                codeColumn = 'huawei_phone_code';
                compatColumn = 'huawei_screen_compatibility';
            }
            else if (b.includes('honor')) {
                tableName = 'honor_models';
                nameColumn = 'honor_phone_name';
                codeColumn = 'honor_phone_code';
                compatColumn = 'honor_screen_compatibility';
            }
            else if (b.includes('oppo')) {
                tableName = 'oppo_models';
                nameColumn = 'oppo_phone_name';
                codeColumn = 'oppo_phone_code';
                compatColumn = 'oppo_screen_compatibility';
            }
            else if (b.includes('realme')) {
                tableName = 'realme_models';
                nameColumn = 'realme_phone_name';
                codeColumn = 'realme_phone_code';
                compatColumn = 'realme_screen_compatibility';
            }
            else if (b.includes('itel')) {
                tableName = 'itel_models';
                nameColumn = 'itel_phone_name';
                codeColumn = 'itel_phone_code';
                compatColumn = 'itel_screen_compatibility';
            }
            else if (b.includes('nokia')) {
                tableName = 'nokia_models';
                nameColumn = 'nokia_phone_name';
                codeColumn = 'nokia_phone_code';
                compatColumn = 'nokia_screen_compatibility';
            }
            else if (b.includes('vivo')) {
                tableName = 'vivo_models';
                nameColumn = 'vivo_phone_name';
                codeColumn = 'vivo_phone_code';
                compatColumn = 'vivo_screen_compatibility';
            }
            else if (b.includes('techno') || b.includes('tecno')) {
                tableName = 'tecno_models';
                nameColumn = 'tecno_phone_name';
                codeColumn = 'tecno_phone_code';
                compatColumn = 'tecno_screen_compatibility';
            }
            else if (b.includes('infinix')) {
                tableName = 'infinix_models';
                nameColumn = 'infinix_phone_name';
                codeColumn = 'infinix_phone_code';
                compatColumn = 'infinix_screen_compatibility';
            }

            let models = [];
            if (tableName) {
                let queryFields = `${nameColumn}, ${codeColumn}, ${compatColumn}`;

                const { data, error } = await supabaseClient.from(tableName).select(queryFields);
                if (!error && data) {
                    models = data.map(item => ({
                        device_name: item[nameColumn],
                        model_code: item[codeColumn],
                        screen_compatibility: item[compatColumn] || null
                    }));
                }
            }

            let modelsHtml = "";
            if (models.length > 0) {
                modelsHtml = models.map((m, index) => {
                    const style = getRotatingCardStyle(index);
                    const escapedCompat = m.screen_compatibility ? encodeURIComponent(m.screen_compatibility) : '';
                    return `
                        <div onclick="selectModelAndProceed('${m.device_name}', '${m.model_code}', '${escapedCompat}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                            <span class="font-bold text-gray-800">
                                ${m.device_name} <span class="text-xs ${style.icon} font-normal">(${m.model_code})</span>
                            </span>
                            <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>
                    `;
                }).join('');
            } else {
                modelsHtml = `<div class="text-center text-gray-500 py-6">لا توجد موديلات متاحة حالياً لهذه الماركة</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderBrandsScreen()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200">
                        رجوع ←
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">موديلات ${brand}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${modelsHtml}
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        function selectModelAndProceed(deviceName, modelCode, compatEncoded) {
            selectedModel = `${deviceName} (${modelCode})`;
            selectedModelCode = modelCode;
            currentScreenCompatibility = compatEncoded ? decodeURIComponent(compatEncoded) : "";
            renderPartsScreen(selectedModel);
        }

        // ================= 5. شاشة قطع الغيار (مع الألوان الدورية) =================
        function renderPartsScreen(model, push = true) {
            selectedModel = model;
            if (push) {
                history.pushState({ screen: 'parts', model: model, brand: selectedBrand }, "", "");
            }

            let partsHtml = sparePartsList.map((part, index) => {
                const style = getRotatingCardStyle(index);
                return `
                    <div onclick="renderProductDetailScreen('${part}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                        <span class="font-bold text-gray-800">${part}</span>
                        <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                `;
            }).join('');

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderModelsScreen('${selectedBrand}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200">
                        رجوع ←
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">${selectedBrand} - ${model}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${partsHtml}
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        // ================= 6. صفحة المنتج النهائية =================
        function renderProductDetailScreen(part, push = true) {
            selectedPart = part;
            if (push) {
                history.pushState({ screen: 'product', part: part, model: selectedModel, brand: selectedBrand }, "", "");
            }

            let compatibilityText = "هذه القطعة متوافقة مع الإصدارات والنسخ المتطابقة من الماركة.";
            if (part === "شاشة") {
                if (currentScreenCompatibility) {
                    if (currentScreenCompatibility.toLowerCase() === 'none') {
                        compatibilityText = "هذه الشاشة غير متوافقة مع موديلات أخرى (خاصة بهذا الموديل فقط).";
                    } else {
                        compatibilityText = `الموديلات المتوافقة مع هذه الشاشة: ${currentScreenCompatibility}`;
                    }
                } else {
                    compatibilityText = "لا توجد توافقات مسجلة لهذه الشاشة حالياً.";
                }
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderPartsScreen('${selectedModel}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all border border-blue-200">
                        رجوع ←
                    </button>
                    <h2 class="text-xs sm:text-sm font-bold text-gray-800">${part} (${selectedModel})</h2>
                </div>

                <div class="flex-1 overflow-y-auto space-y-5 p-1">
                    <div class="bg-blue-50/70 border border-blue-100 p-6 sm:p-7 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-blue-800 mb-3 text-base sm:text-lg">🛒 شراء المنتج</h3>
                        <p class="text-sm sm:text-base text-gray-600 mb-4">القطعة متوفرة بالضمان الكامل.</p>
                        <button onclick="alert('تمت إضافة الطلب بنجاح!')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-sm sm:text-base shadow-md transition-all">
                            شراء المنتج / اطلب الآن
                        </button>
                    </div>

                    <div class="bg-emerald-50/70 border border-emerald-100 p-6 sm:p-7 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-emerald-800 mb-3 text-base sm:text-lg">🔗 التوافقات</h3>
                        <p class="text-sm sm:text-base text-gray-600 font-medium">${compatibilityText}</p>
                    </div>

                    <div class="bg-amber-50/70 border border-amber-100 p-6 sm:p-7 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-amber-800 mb-3 text-base sm:text-lg">⚠️ تنبيهات بعد التركيب</h3>
                        <p class="text-sm sm:text-base text-gray-600">يُرجى التجربة الفورية قبل التثبيت النهائي وإزالة اللزقات.</p>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        // التشغيل المبدئي وإدارة زر الرجوع (Back Button)
        window.onload = function() {
            renderLoginScreen();

            // الاستماع لحركة زر الرجوع في الهاتف أو المتصفح
            window.addEventListener('popstate', function(event) {
                if (event.state && event.state.screen) {
                    const state = event.state;
                    if (state.screen === 'login') {
                        renderLoginScreen(false);
                    } else if (state.screen === 'main') {
                        renderMainDashboard(false);
                    } else if (state.screen === 'brands') {
                        renderBrandsScreen(false);
                    } else if (state.screen === 'models') {
                        selectedBrand = state.brand;
                        renderModelsScreen(state.brand, false);
                    } else if (state.screen === 'parts') {
                        selectedBrand = state.brand;
                        renderPartsScreen(state.model, false);
                    } else if (state.screen === 'product') {
                        selectedBrand = state.brand;
                        selectedModel = state.model;
                        renderProductDetailScreen(state.part, false);
                    }
                } else {
                    renderLoginScreen(false);
                }
            });
        };
    </script>
</body>
</html>
