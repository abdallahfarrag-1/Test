<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Aswan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            min-height: 100vh;
            border: 2px solid #b3d7ff;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .page {
            display: none;
            flex: 1;
            padding: 20px;
            flex-direction: column;
        }
        .page.active {
            display: flex;
        }
        .company-title {
            text-align: center;
            color: #0056b3;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #0056b3;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            background: #e9ecef;
            font-weight: bold;
        }
        .tab.active {
            background: #0056b3;
            color: #fff;
        }
        .form-section {
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        .form-section.active {
            display: flex;
        }
        input[type="text"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }
        input:focus {
            border-color: #0056b3;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            background-color: #0056b3;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        .btn:hover {
            background-color: #004085;
        }
        .guest-btn {
            background-color: #e2e3e5;
            color: #383d41;
            margin-top: 15px;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        .header-fixed {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 15px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }
        .search-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }
        .grid-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .grid-box {
            background: #f8f9fa;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: #0056b3;
        }
        .brands-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .brand-box {
            aspect-ratio: 1 / 1;
            background: #f8f9fa;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            color: #0056b3;
        }
        .list-item {
            background: #f8f9fa;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            color: #0056b3;
        }
        .back-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            align-self: flex-end;
        }
        .content-box {
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            background: #fff;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- الصفحة الأولى -->
    <div id="page1" class="page active">
        <div class="company-title">Electricity Aswan</div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">تسجيل الدخول</div>
            <div class="tab" onclick="switchTab('register')">إنشاء حساب</div>
        </div>

        <!-- تسجيل الدخول -->
        <div id="loginSection" class="form-section active">
            <input type="tel" placeholder="رقم الهاتف">
            <input type="password" placeholder="رمز المرور">
            <div class="checkbox-container">
                <input type="checkbox" id="remember">
                <label for="remember">تذكرنى</label>
            </div>
            <button class="btn" onclick="goToPage2()">تسجيل الدخول</button>
        </div>

        <!-- إنشاء حساب -->
        <div id="registerSection" class="form-section">
            <input type="text" placeholder="اسم الفنى">
            <input type="text" placeholder="اسم المحل">
            <input type="text" placeholder="عنوان المحل">
            <input type="tel" placeholder="رقم الهاتف">
            <input type="password" placeholder="رمز المرور">
            <button class="btn" onclick="goToPage2()">إنشاء حساب</button>
        </div>

        <button class="guest-btn" onclick="goToPage2()">الدخول كزائر</button>
    </div>

    <!-- الصفحة الثانية -->
    <div id="page2" class="page">
        <!-- الجزء الثابت فى الأعلى -->
        <div class="header-fixed">
            <button class="search-btn" onclick="alert('قائمة منسدلة')">☰</button>
            <div class="company-title" style="margin:0; font-size:18px;">Electricity Aswan</div>
            <div style="font-size: 14px; font-weight: bold;">0123456789</div>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="ابحث">
            <button class="search-btn" onclick="alert('بحث بالكاميرا')">كاميرا</button>
            <button class="search-btn" onclick="alert('بحث بالصوت')">صوت</button>
        </div>

        <!-- المحتوى الرئيسي (٤ مربعات بشكل ثنائى) -->
        <div id="mainDashboard" class="grid-2x2">
            <div class="grid-box" onclick="showBrands()">الماركات</div>
            <div class="grid-box" onclick="alert('التوافقات')">التوافقات</div>
            <div class="grid-box" onclick="alert('تنبيهات بعد التركيب')">تنبيهات بعد التركيب</div>
            <div class="grid-box" onclick="alert('التواصل مع الشركة')">التواصل مع الشركة</div>
        </div>

        <!-- قسم الماركات -->
        <div id="brandsSection" style="display:none; flex-direction:column;">
            <button class="back-btn" onclick="showDashboard()">عودة</button>
            <div class="brands-grid" id="brandsGrid"></div>
        </div>

        <!-- قسم الموديلات -->
        <div id="modelsSection" style="display:none; flex-direction:column;">
            <button class="back-btn" onclick="showBrands()">عودة للماركات</button>
            <div id="modelsList"></div>
        </div>

        <!-- قسم قطع الغيار -->
        <div id="partsSection" style="display:none; flex-direction:column;">
            <button class="back-btn" onclick="showModels()">عودة للموديلات</button>
            <div id="partsList"></div>
        </div>

        <!-- قسم تفاصيل قطعة الغيار -->
        <div id="partDetailSection" style="display:none; flex-direction:column;">
            <button class="back-btn" onclick="showParts()">عودة لقطع الغيار</button>
            <div class="content-box">شراء المنتج</div>
            <div class="content-box">التوافقات</div>
            <div class="content-box">تنبيهات بعد التركيب</div>
        </div>
    </div>

</div>

<script>
    function switchTab(tabName) {
        const tabs = document.querySelectorAll('.tab');
        tabs[0].classList.toggle('active', tabName === 'login');
        tabs[1].classList.toggle('active', tabName === 'register');

        document.getElementById('loginSection').classList.toggle('active', tabName === 'login');
        document.getElementById('registerSection').classList.toggle('active', tabName === 'register');
    }

    function goToPage2() {
        document.getElementById('page1').classList.remove('active');
        document.getElementById('page2').classList.add('active');
    }

    function showDashboard() {
        document.getElementById('mainDashboard').style.display = 'grid';
        document.getElementById('brandsSection').style.display = 'none';
        document.getElementById('modelsSection').style.display = 'none';
        document.getElementById('partsSection').style.display = 'none';
        document.getElementById('partDetailSection').style.display = 'none';
    }

    const brands = [
        "Apple", "Samsung", "Xiaomi", "Redmi", "Infinix", "Oppo",
        "Realme", "Huawei", "Vivo", "Honor", "Itel", "Nokia", "Techno"
    ];

    function showBrands() {
        document.getElementById('mainDashboard').style.display = 'none';
        document.getElementById('brandsSection').style.display = 'flex';
        document.getElementById('modelsSection').style.display = 'none';
        document.getElementById('partsSection').style.display = 'none';
        document.getElementById('partDetailSection').style.display = 'none';

        const grid = document.getElementById('brandsGrid');
        grid.innerHTML = '';
        brands.forEach(brand => {
            const div = document.createElement('div');
            div.className = 'brand-box';
            div.innerText = brand;
            div.onclick = () => showModels(brand);
            grid.appendChild(div);
        });
    }

    function showModels(brandName) {
        document.getElementById('brandsSection').style.display = 'none';
        document.getElementById('modelsSection').style.display = 'flex';
        document.getElementById('partsSection').style.display = 'none';
        document.getElementById('partDetailSection').style.display = 'none';

        const list = document.getElementById('modelsList');
        list.innerHTML = '';
        // افتراض موديلات تجريبية للماركة
        const models = [brandName + " Model 1", brandName + " Model 2", brandName + " Model 3"];
        models.forEach(model => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerText = model;
            div.onclick = () => showParts();
            list.appendChild(div);
        });
    }

    const parts = [
        "شاشة", "بطارية", "ضهرية", "فلاتة ربط", "فلاتة باور", "فلاتة شحن",
        "فريم", "ميدل", "سماعة داخلية مكالمات", "سماعة خارجية مكبر الصوت", "سوكيت", "ايسيهات"
    ];

    function showParts() {
        document.getElementById('modelsSection').style.display = 'none';
        document.getElementById('partsSection').style.display = 'flex';
        document.getElementById('partDetailSection').style.display = 'none';

        const list = document.getElementById('partsList');
        list.innerHTML = '';
        parts.forEach(part => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerText = part;
            div.onclick = () => showPartDetail();
            list.appendChild(div);
        });
    }

    function showPartDetail() {
        document.getElementById('partsSection').style.display = 'none';
        document.getElementById('partDetailSection').style.display = 'flex';
    }
</script>

</body>
</html>
