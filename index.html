<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Aswan</title>
    <!-- تضمين Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تضمين مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-2 sm:p-4 flex items-center justify-center relative overflow-x-hidden">

    <!-- القائمة الجانبية (Sidebar) المخفية افتراضياً -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity opacity-0 duration-300"></div>
    <div id="sideMenu" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <!-- رأس القائمة الجانبية -->
        <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
            <h3 class="font-bold text-gray-800 text-base">القائمة الرئيسية</h3>
            <button onclick="toggleSidebar()" class="p-2 text-gray-500 hover:text-red-500 rounded-xl transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <!-- محتوى القائمة الجانبية الديناميكي -->
        <div id="sidebarContent" class="flex-1 overflow-y-auto p-4 space-y-2">
            <!-- يتم تعبئتها ديناميكياً -->
        </div>
    </div>

    <!-- البطاقة البيضاء الرئيسية -->
    <div class="bg-white w-full h-[96vh] sm:h-[94vh] rounded-3xl shadow-2xl p-4 sm:p-8 flex flex-col justify-between transition-all duration-300 overflow-hidden">
        <div id="appContainer" class="flex-1 flex flex-col overflow-hidden"></div>
    </div>

    <!-- كود الجافاسكريبت -->
    <script>
        // ================= 1. المتغيرات وإعدادات الاتصال =================
        const SUPABASE_URL = 'https://byiayomtcwqlgrknvgcz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_buMxNAI5pVKhgLa_KlcHoQ_Tf_jN6Ks';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserRole = "زائر";
        let currentUserType = "زائر";
        let currentUserId = null;
        let selectedBrand = "";
        let selectedModel = "";
        let selectedPart = "";
        let selectedModelCode = ""; 
        let currentScreenCompatibility = "";
        let currentBatteryModel = "";

        const sparePartsList = [
            "شاشة", "بطارية", "ضهرية", "فلاتة ربط", "فلاتة باور", 
            "فلاتة شحن", "فريم", "ميدل", "سماعة داخلية مكالمات", 
            "سماعة خارجية مكبر الصوت", "سوكيت", "ايسيهات"
        ];

        // ================= 2. دوال مساعدة عامة =================
        function toggleSidebar() {
            const sidebar = document.getElementById('sideMenu');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function getRotatingCardStyle(index) {
            const styles = [
                { bg: "bg-blue-50/80 hover:bg-blue-100", border: "border-blue-200", text: "text-blue-800", icon: "text-blue-500" },
                { bg: "bg-emerald-50/80 hover:bg-emerald-100", border: "border-emerald-200", text: "text-emerald-800", icon: "text-emerald-500" },
                { bg: "bg-amber-50/80 hover:bg-amber-100", border: "border-amber-200", text: "text-amber-800", icon: "text-amber-500" }
            ];
            return styles[index % 3];
        }

        function getHeaderTemplate() {
            return `
                <div class="border-b border-gray-100 pb-4 mb-4 flex-shrink-0">
                    <div class="text-center mb-3">
                        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wide">Electricity Aswan</h1>
                    </div>

                    <div class="flex items-center justify-between mb-4">
                        <button onclick="toggleSidebar()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs sm:text-sm rounded-xl px-4 py-2.5 flex items-center gap-2 shadow-sm transition-all cursor-pointer">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                            <span>القائمة</span>
                        </button>

                        <div class="bg-blue-50/60 border border-blue-100 px-3.5 py-2 rounded-xl text-blue-700 text-xs sm:text-sm font-semibold shadow-sm">
                            ${currentUserRole}
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="flex-1 relative">
                            <input type="text" placeholder="ابحث" class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-xs sm:text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        </div>
                        <button onclick="alert('جارِ الاستماع للصوت...فعل ميكروفون المتصفح')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-3 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث صوتي">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        </button>
                        <button onclick="alert('جارِ فتح الكاميرا للمسح الضوئي...')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-3 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث بالكاميرا">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        // ================= التنبيه التشخيصي الذكي =================
        async function loadDynamicMenuIntoSidebar() {
            try {
                let diagnosticMsg = "--- تقرير التشخيص الفوري ---\n\n";

                // 1. فحص الـ ID
                if (currentUserId) {
                    diagnosticMsg += `✅ 1. تم جلب الـ ID بنجاح.\n- قيمة الـ ID: ${currentUserId}\n\n`;
                } else {
                    diagnosticMsg += `❌ 1. لم يتم جلب الـ ID!\n- السبب: متغير currentUserId فارغ (null)، إما لأن المستخدم زائر أو أن استجابة الدخول لم تحتوي على الـ ID.\n\n`;
                    alert(diagnosticMsg);
                    return;
                }

                // 2. طلب المنيو عبر الـ RPC
                diagnosticMsg += `⏳ 2. جاري إرسال الـ ID إلى دالة get_menu_items_for_admin...\n`;
                
                const { data, error } = await supabaseClient.rpc('get_menu_items_for_admin', {
                    p_user_id: currentUserId
                });

                // 3. تحليل النتيجة والسبب
                if (error) {
                    diagnosticMsg += `❌ 3. فشل جلب محتويات المنيو بسبب خطأ في قاعدة البيانات (RPC Error):\n- التفاصيل: ${error.message}`;
                } else if (!data) {
                    diagnosticMsg += `❌ 3. لم يتم جلب محتويات المنيو:\n- السبب: دالة الـ RPC أعادت قيمة فارغة (null).`;
                } else if (Array.isArray(data) && data.length === 0) {
                    diagnosticMsg += `❌ 3. لم يتم جلب محتويات المنيو (القوائم فارغة: []):\n- السبب المحتمل: قاعدة البيانات لم تعتبر هذا المستخدم "أدمن" (user_role ليس admin أو ادمن)، أو أن جدول menu_items فارغ تماماً.`;
                } else {
                    diagnosticMsg += `✅ 3. تم جلب محتويات المنيو بنجاح! عدد العناصر: ${data.length}`;
                }

                // عرض التنبيه التشخيصي للمستخدم
                alert(diagnosticMsg);

                // تعبئة القائمة في حال نجاح الجلب
                let menuItems = (!error && data) ? data : [];
                const sidebarContainer = document.getElementById('sidebarContent');
                if (sidebarContainer) {
                    let menuHtml = "";
                    if (menuItems.length > 0) {
                        menuItems.forEach(item => {
                            const title = item.menu_items || item.title || "عنصر القائمة"; 
                            const action = item.action || 'defaultAction';
                            menuHtml += `
                                <button onclick="toggleSidebar(); handleMenuAction('${action}');" class="w-full text-right px-4 py-3 rounded-xl bg-gray-50 hover:bg-blue-50 text-gray-700 hover:text-blue-600 font-semibold text-sm transition-all flex items-center gap-3">
                                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                    <span>${title}</span>
                                </button>
                            `;
                        });
                    } else {
                        menuHtml = `<div class="text-center text-gray-400 text-xs py-4">لا توجد عناصر مضافة للقائمة (أو الصلاحية غير مطابقة)</div>`;
                    }
                    sidebarContainer.innerHTML = menuHtml;
                }

            } catch (err) {
                alert("❌ حدث استثناء جافاسكريبت غير متوقع أثناء فحص المنيو:\n" + err.message);
            }
        }

        function handleMenuAction(actionName) {
            if (typeof window[actionName] === 'function') {
                window[actionName]();
            } else {
                alert(`تم اختيار الإجراء: ${actionName}`);
            }
        }

        // ================= 3. شاشات المصادقة =================
        function renderLoginScreen() {
            const html = `
                <div class="flex-1 overflow-y-auto px-2">
                    <div class="max-w-xl mx-auto w-full py-4">
                        <div class="text-center mb-6">
                            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wide">Electricity Aswan</h1>
                        </div>

                        <div class="mb-6">
                            <img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=800&q=80" alt="Banner" class="w-full h-40 sm:h-52 object-cover rounded-2xl shadow-md">
                        </div>

                        <div class="grid grid-cols-2 gap-2 bg-gray-100 p-1.5 rounded-2xl mb-6">
                            <button onclick="switchTab('login')" id="loginTabBtn" class="py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-blue-600 shadow-sm">
                                تسجيل الدخول
                            </button>
                            <button onclick="switchTab('register')" id="registerTabBtn" class="py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700">
                                إنشاء حساب
                            </button>
                        </div>

                        <div id="loginFormContainer">
                            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رقم الهاتف</label>
                                    <input type="text" id="loginPhone" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رمز المرور</label>
                                    <input type="password" id="loginPassword" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/35 transition-all text-sm">
                                    تسجيل الدخول
                                </button>
                            </form>
                        </div>

                        <div id="registerFormContainer" class="hidden">
                            <form onsubmit="handleRegisterSubmit(event)" class="space-y-3.5">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">الاسم</label>
                                    <input type="text" id="regUserName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">اسم المحل</label>
                                    <input type="text" id="regShopName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">عنوان المحل</label>
                                    <input type="text" id="regShopAddress" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رقم الهاتف</label>
                                    <input type="text" id="regPhone" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رمز المرور</label>
                                    <input type="password" id="regPassword" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                                </div>
                                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/35 transition-all text-sm mt-2">
                                    إنشاء الحساب
                                </button>
                            </form>
                        </div>

                        <div class="relative my-6">
                            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                            <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-400">أو</span></div>
                        </div>

                        <div>
                            <button onclick="loginAsVisitor()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl transition-all text-sm border border-gray-200">
                                الدخول كزائر
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('loginFormContainer');
            const registerForm = document.getElementById('registerFormContainer');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-blue-600 shadow-sm";
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-600 shadow-sm";
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const { data, error } = await supabaseClient.rpc('login_user', { 
                p_phone_number: phone, 
                p_password: password 
            });

            if (error) {
                alert('خطأ في الاتصال أو بيانات الدخول: ' + error.message);
                return;
            }

            let resObj = Array.isArray(data) ? data[0] : data;

            if (!resObj || resObj.success === false) {
                alert(resObj?.message || 'خطأ في رقم الهاتف أو رمز المرور!');
                return;
            }

            currentUserRole = resObj.phone_number || phone;
            currentUserType = resObj.user_type || "ادمن"; 
            currentUserId = resObj?.user?.id || resObj?.user_id || resObj?.id || resObj?.ID || resObj?.uuid || null; 
            
            renderMainDashboard();
            loadDynamicMenuIntoSidebar(); 
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const user_name = document.getElementById('regUserName').value.trim();
            const shop_name = document.getElementById('regShopName').value.trim();
            const shop_address = document.getElementById('regShopAddress').value.trim();
            const phone_number = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            const { data, error } = await supabaseClient.rpc('register_user', { 
                p_user_name: user_name, 
                p_shop_name: shop_name, 
                p_shop_address: shop_address, 
                p_phone_number: phone_number, 
                p_password: password 
            });

            if (error) {
                alert('حدث خطأ أثناء إنشاء الحساب أو الرقم مسجل مسبقاً: ' + error.message);
                return;
            }

            let resObj = Array.isArray(data) ? data[0] : data;

            if (resObj && resObj.success === false) {
                alert(resObj.message || 'حدث خطأ أثناء إنشاء الحساب');
                return;
            }

            currentUserRole = phone_number;
            currentUserType = "ادمن"; 
            currentUserId = resObj?.user?.id || resObj?.id || resObj?.user_id || resObj?.ID || resObj?.uuid || null;
            
            renderMainDashboard();
            loadDynamicMenuIntoSidebar();
        }

        function loginAsVisitor() {
            currentUserRole = "زائر";
            currentUserType = "زائر";
            currentUserId = null;
            renderMainDashboard();
            loadDynamicMenuIntoSidebar();
        }

        // ================= 4. الشاشات الرئيسية =================
        function renderMainDashboard() {
            const html = `
                ${getHeaderTemplate()}

                <div class="flex-1 overflow-y-auto space-y-4 px-1">
                    <div class="mb-4">
                        <img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=800&q=80" alt="Banner" class="w-full h-36 sm:h-48 object-cover rounded-2xl shadow-md">
                    </div>

                    <div class="space-y-3.5 pb-4">
                        <div onclick="renderBrandsScreen()" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white p-5 sm:p-6 rounded-2xl shadow-md cursor-pointer transition-all flex items-center justify-between">
                            <span class="font-bold text-lg sm:text-xl">الماركات</span>
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        async function renderBrandsScreen() {
            let brands = [];
            const { data, error } = await supabaseClient.from('brands').select('*');
            if (!error && data) {
                brands = data.map(item => item.brand_name || item.name || Object.values(item)[1]); 
            }

            let brandsHtml = brands.length > 0 ? brands.map((brand, index) => {
                const style = getRotatingCardStyle(index);
                return `
                    <div onclick="alert('موديلات ${brand}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base">
                        <span class="font-bold text-gray-800">${brand}</span>
                        <svg class="w-5 h-5 ${style.icon} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                `;
            }).join('') : `<div class="text-center text-gray-500 py-6">لا توجد ماركات متاحة</div>`;

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all">رجوع</button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">اختر الماركة</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">${brandsHtml}</div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        window.onload = function() {
            renderLoginScreen();
        };
    </script>
</body>
</html>
