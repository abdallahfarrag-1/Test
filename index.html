<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Aswan</title>
    <style>
        :root {
            --primary-color: #0288d1;
            --primary-light: #e1f5fe;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            min-height: 100vh;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        /* الهيدر الثابت */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .company-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .header-left {
            font-size: 14px;
            color: var(--text-color);
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--primary-color);
        }

        /* شريط البحث */
        .search-container {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            border-radius: var(--border-radius);
            padding: 8px 15px;
            margin: 15px 20px;
        }

        .search-input {
            flex: 1;
            border: none;
            background: none;
            outline: none;
            font-size: 14px;
            text-align: right;
            color: var(--text-color);
        }

        .search-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--primary-color);
        }

        /* النماذج والبطاقات */
        h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            outline: none;
            font-size: 14px;
            background-color: var(--bg-color);
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            margin-top: 10px;
        }

        .text-center {
            text-align: center;
            margin: 15px 0;
            font-size: 14px;
            color: #666;
        }

        .link {
            color: var(--primary-color);
            text-decoration: none;
            cursor: pointer;
        }

        /* شبكة المربعات الثنائية (2 فوق 2) */
        .grid-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 10px 20px;
        }

        .grid-card {
            background-color: var(--primary-light);
            padding: 25px 15px;
            border-radius: var(--border-radius);
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: var(--primary-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: 0.2s;
        }

        .grid-card:hover {
            transform: translateY(-2px);
        }

        /* القوائم الأفقية والموديلات والقطع */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px 20px;
        }

        .list-item {
            background-color: white;
            padding: 15px;
            border-radius: var(--border-radius);
            border: 1px solid #eee;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item:hover {
            border-color: var(--primary-color);
        }

        .back-nav {
            padding: 10px 20px;
            display: flex;
            justify-content: flex-start;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .details-section {
            padding: 20px;
        }

        .details-section h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- شاشة تسجيل الدخول وإنشاء الحساب (الصفحة الأولى) -->
    <div id="loginScreen" class="screen active">
        <h2>Electricity Aswan</h2>
        
        <!-- تسجيل الدخول -->
        <div id="loginFormSection">
            <div class="form-group">
                <input type="text" class="form-control" placeholder="رقم الهاتف">
            </div>
            <div class="form-group">
                <input type="password" class="form-control" placeholder="رمز المرور">
            </div>
            <div style="display: flex; align-items: center; margin-bottom: 15px; font-size: 14px;">
                <input type="checkbox" id="remember" style="margin-left: 8px;">
                <label for="remember">تذكرنى</label>
            </div>
            <button class="btn" onclick="goToMainScreen()">تسجيل الدخول</button>
            
            <div class="text-center">
                <span>ليس لديك حساب؟ </span>
                <span class="link" onclick="toggleAuthMode('register')">إنشاء حساب</span>
            </div>
            
            <div class="text-center">أو</div>
            
            <button class="btn btn-secondary" onclick="goToMainScreen()">الدخول كزائر</button>
        </div>

        <!-- إنشاء حساب -->
        <div id="registerFormSection" style="display: none;">
            <div class="form-group">
                <input type="text" class="form-control" placeholder="اسم الفنى">
            </div>
            <div class="form-group">
                <input type="text" class="form-control" placeholder="اسم المحل">
            </div>
            <div class="form-group">
                <input type="text" class="form-control" placeholder="عنوان المحل">
            </div>
            <div class="form-group">
                <input type="text" class="form-control" placeholder="رقم الهاتف">
            </div>
            <div class="form-group">
                <input type="password" class="form-control" placeholder="رمز المرور">
            </div>
            <button class="btn" onclick="goToMainScreen()">إنشاء حساب</button>
            
            <div class="text-center">
                <span>لديك حساب بالفعل؟ </span>
                <span class="link" onclick="toggleAuthMode('login')">تسجيل الدخول</span>
            </div>
        </div>
    </div>

    <!-- الصفحة الرئيسية (الصفحة الثانية) وما تتبعها -->
    <div id="mainAppScreen" class="screen" style="padding: 0;">
        
        <!-- الهيدر الثابت فى كل الصفحات -->
        <header class="app-header">
            <button class="menu-btn">&#9776;</button>
            <div class="company-title">Electricity Aswan</div>
            <div class="header-left">0123456789</div>
        </header>

        <!-- شريط البحث الثابت -->
        <div class="search-container">
            <div class="search-actions">
                <button class="icon-btn" title="بحث بالكاميرا">&#128247;</button>
                <button class="icon-btn" title="بحث بالصوت">&#127897;</button>
            </div>
            <input type="text" class="search-input" placeholder="ابحث">
        </div>

        <!-- المحتوى المتغير حسب التنقل -->
        <div id="dynamicContent" style="flex: 1; overflow-y: auto;">
            
            <!-- القائمة الرئيسية (٤ مربعات) -->
            <div id="homeGrid" class="grid-2x2">
                <div class="grid-card" onclick="loadBrands()">الماركات</div>
                <div class="grid-card">التوافقات</div>
                <div class="grid-card">تنبيهات بعد التركيب</div>
                <div class="grid-card">التواصل مع الشركة</div>
            </div>

        </div>
    </div>

</div>

<script>
    // التنقل بين تسجيل الدخول وإنشاء الحساب
    function toggleAuthMode(mode) {
        if(mode === 'register') {
            document.getElementById('loginFormSection').style.display = 'none';
            document.getElementById('registerFormSection').style.display = 'block';
        } else {
            document.getElementById('loginFormSection').style.display = 'block';
            document.getElementById('registerFormSection').style.display = 'none';
        }
    }

    function goToMainScreen() {
        document.getElementById('loginScreen').classList.remove('active');
        document.getElementById('mainAppScreen').classList.add('active');
    }

    // قائمة الماركات (مرتبة من اليسار لليمين)
    const brands = [
        "Apple", "Samsung", "Xiaomi", "Redmi", "Infinix", 
        "Oppo", "Realme", "Huawei", "Vivo", "Honor", "Itel", "Nokia", "Techno"
    ];

    // قائمة قطع الغيار الثابتة
    const spareParts = [
        "شاشة", "بطارية", "ضهرية", "فلاتة ربط", "فلاتة باور", 
        "فلاتة شحن", "فريم", "ميدل", "سماعة داخلية مكالمات", 
        "سماعة خارجية مكبر الصوت", "سوكيت", "ايسيهات"
    ];

    function loadBrands() {
        let content = `
            <div class="back-nav"><button class="back-btn" onclick="resetToHome()">← عودة للرئيسية</button></div>
            <div class="list-container" style="direction: ltr;">
        `;
        brands.forEach(brand => {
            content += `<div class="list-item" onclick="loadModels('${brand}')" style="direction: rtl;"><span>${brand}</span><span>›</span></div>`;
        });
        content += `</div>`;
        document.getElementById('dynamicContent').innerHTML = content;
    }

    function resetToHome() {
        document.getElementById('dynamicContent').innerHTML = `
            <div class="grid-2x2">
                <div class="grid-card" onclick="loadBrands()">الماركات</div>
                <div class="grid-card">التوافقات</div>
                <div class="grid-card">تنبيهات بعد التركيب</div>
                <div class="grid-card">التواصل مع الشركة</div>
            </div>
        `;
    }

    function loadModels(brandName) {
        // افتراض موديلات تجريبية للماركة
        const models = [`${brandName} Pro 1`, `${brandName} Prime 2`, `${brandName} Ultra 3`];
        
        let content = `
            <div class="back-nav"><button class="back-btn" onclick="loadBrands()">← عودة للماركات</button></div>
            <div class="list-container">
                <h3 style="padding: 0 5px; color: var(--primary-color);">${brandName}</h3>
        `;
        models.forEach(model => {
            content += `<div class="list-item" onclick="loadSpareParts('${brandName}', '${model}')"><span>${model}</span><span>›</span></div>`;
        });
        content += `</div>`;
        document.getElementById('dynamicContent').innerHTML = content;
    }

    function loadSpareParts(brandName, modelName) {
        let content = `
            <div class="back-nav"><button class="back-btn" onclick="loadModels('${brandName}')">← عودة للموديلات</button></div>
            <div class="list-container">
                <h3 style="padding: 0 5px; color: var(--primary-color);">${modelName} - قطع الغيار</h3>
        `;
        spareParts.forEach(part => {
            content += `<div class="list-item" onclick="loadPartDetails('${modelName}', '${part}')"><span>${part}</span><span>›</span></div>`;
        });
        content += `</div>`;
        document.getElementById('dynamicContent').innerHTML = content;
    }

    function loadPartDetails(modelName, partName) {
        let content = `
            <div class="back-nav"><button class="back-btn" onclick="loadSpareParts('', '${modelName}')">← عودة للموديلات</button></div>
            <div class="details-section">
                <h3>${modelName} - ${partName}</h3>
                
                <div style="background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #eee;">
                    <h4 style="color: var(--primary-color); margin-bottom: 8px;">شراء المنتج</h4>
                    <p style="font-size: 14px; color: #666; margin-bottom: 10px;">متوفر أصلي ومتوفر كوبي درجة أولى.</p>
                    <button class="btn">إضافة إلى السلة / طلب شراء</button>
                </div>

                <div style="background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #eee;">
                    <h4 style="color: var(--primary-color); margin-bottom: 8px;">التوافقات</h4>
                    <p style="font-size: 14px; color: #666;">هذه القطعة متوافقة مع إصدارات أخرى من نفس الفئة.</p>
                </div>

                <div style="background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #eee;">
                    <h4 style="color: var(--primary-color); margin-bottom: 8px;">تنبيهات بعد التركيب</h4>
                    <p style="font-size: 14px; color: #666;">يجب تجربة الشاشة/القطعة قبل إزالة اللصق الضماني وضمان عدم وجود تلف بالباند.</p>
                </div>
            </div>
        `;
        document.getElementById('dynamicContent').innerHTML = content;
    }
</script>

</body>
</html>
