<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity "Aswan" - تسجيل الدخول</title>
    <!-- استيراد خط عربي جميل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0056b3, #e3f2fd);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 86, 179, 0.2);
            border-top: 5px solid #0056b3;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area h1 {
            color: #0056b3;
            font-size: 24px;
            font-weight: 700;
        }

        /* نظام التبويبات (لتسهيل التنقل بين تسجيل الدخول وإنشاء الحساب) */
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: #0056b3;
            border-bottom: 3px solid #0056b3;
            margin-bottom: -2px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #0056b3;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b0bec5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #0056b3;
            box-shadow: 0 0 5px rgba(0, 86, 179, 0.3);
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #555;
        }

        .remember-me input {
            margin-left: 8px;
            accent-color: #0056b3;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #003d82;
        }

        .guest-btn {
            background-color: #ffffff;
            color: #0056b3;
            border: 2px solid #0056b3;
            margin-top: 10px;
        }

        .guest-btn:hover {
            background-color: #e3f2fd;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #888;
            font-size: 13px;
            position: relative;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: #ddd;
        }

        .divider::before { right: 0; }
        .divider::after { left: 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- شعار الشركة -->
        <div class="logo-area">
            <h1>Electricity &ldquo;Aswan&rdquo;</h1>
        </div>

        <!-- أزرار التبويب -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="tab-btn" onclick="switchTab('register')">إنشاء حساب</button>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <div id="login-section" class="form-section active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-phone">رقم الهاتف</label>
                    <input type="text" id="login-phone" placeholder="أدخل رقم الهاتف" required>
                </div>

                <div class="form-group">
                    <label for="login-pass">رمز المرور</label>
                    <input type="text" id="login-pass" placeholder="أدخل رمز المرور" required>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember" style="margin-bottom:0; display:inline; color:#555;">تذكرني</label>
                </div>

                <button type="submit" class="btn">دخول</button>
            </form>

            <div class="divider">أو</div>
            <button type="button" class="btn guest-btn" onclick="handleGuest()">الدخول كزائر</button>
        </div>

        <!-- نموذج إنشاء حساب -->
        <div id="register-section" class="form-section">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-name">الاسم</label>
                    <input type="text" id="reg-name" placeholder="الاسم الكامل" required>
                </div>

                <div class="form-group">
                    <label for="reg-shop">اسم المحل</label>
                    <input type="text" id="reg-shop" placeholder="اسم المحل التجاري" required>
                </div>

                <div class="form-group">
                    <label for="reg-address">عنوان المحل</label>
                    <input type="text" id="reg-address" placeholder="عنوان المحل بالتفصيل" required>
                </div>

                <div class="form-group">
                    <label for="reg-phone">رقم الهاتف</label>
                    <input type="text" id="reg-phone" placeholder="رقم الهاتف للتواصل" required>
                </div>

                <div class="form-group">
                    <label for="reg-pass">رمز المرور</label>
                    <input type="text" id="reg-pass" placeholder="أنشئ رمز مرور" required>
                </div>

                <button type="submit" class="btn">إنشاء حساب وتسجيل الدخول</button>
            </form>

            <div class="divider">أو</div>
            <button type="button" class="btn guest-btn" onclick="handleGuest()">الدخول كزائر</button>
        </div>
    </div>

    <script>
        // دالة التبديل بين نماذج تسجيل الدخول وإنشاء الحساب
        function switchTab(tabName) {
            const loginSection = document.getElementById('login-section');
            const registerSection = document.getElementById('register-section');
            const buttons = document.querySelectorAll('.tab-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            if (tabName === 'login') {
                loginSection.classList.add('active');
                registerSection.classList.remove('active');
                buttons[0].classList.add('active');
            } else {
                registerSection.classList.add('active');
                loginSection.classList.remove('active');
                buttons[1].classList.add('active');
            }
        }

        // دوال وهمية للتعامل مع الأحداث
        function handleLogin(e) {
            e.preventDefault();
            alert("تم محاولة تسجيل الدخول بنجاح!");
        }

        function handleRegister(e) {
            e.preventDefault();
            alert("تم إنشاء الحساب بنجاح!");
        }

        function handleGuest() {
            alert("مرحباً بك! جاري الدخول كزائر...");
        }
    </script>
</body>
</html>
